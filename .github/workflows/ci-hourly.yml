name: CI hourly

# Master pushes run every CI job but test only the affected Go packages, and
# run no end-to-end suite. Once an hour this workflow dispatches a full CI run
# and an E2E run on the master head, each unless that commit already has one,
# so an idle master costs one short job an hour.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: Dispatch full CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch CI and E2E on an unmeasured head
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for workflow in ci.yml e2e.yml; do
            runs=$(gh api "repos/$GH_REPO/actions/workflows/$workflow/runs?head_sha=$GITHUB_SHA&event=workflow_dispatch&per_page=1" \
              --jq '.total_count')
            if [ "$runs" -gt 0 ]; then
              echo "A $workflow run already measured $GITHUB_SHA."
              continue
            fi
            gh workflow run "$workflow" --ref "$GITHUB_REF_NAME"
          done
