name: CI

# A pull request into master and each master push run a delta: the Go tests of
# the changed packages and every package whose tests depend on one, the lint of
# the changed packages, and the JavaScript, Lean, Python Resource, and Licenses
# checks when their inputs changed. The hourly schedule, a manual dispatch, and
# a pull request into release run the full suite with every E2E job.
on:
  push:
    branches: ['master']
    paths-ignore:
      - 'doc/**'
      - '*.md'
      - 'CHANGELOG.org'
  pull_request:
    branches: ['master', 'release']
    paths-ignore:
      - 'doc/**'
      - '*.md'
      - 'CHANGELOG.org'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

# Pull request runs group by pull request number, and a new push cancels the
# previous run. Every other run groups by commit, so each master push gets its
# own delta run and a burst of pushes cannot cancel a pending one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # affected selects the jobs this run needs; see scripts/ci-affected.ts. An
  # empty matrix output skips its job. The hourly run skips a commit that
  # already has a scheduled or dispatched run, so an idle master costs one
  # short job an hour.
  affected:
    name: Select
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      members: ${{ steps.select.outputs.members }}
      alpha: ${{ steps.select.outputs.alpha }}
      db: ${{ steps.select.outputs.db }}
      lean: ${{ steps.select.outputs.lean }}
      python: ${{ steps.select.outputs.python }}
      licenses: ${{ steps.select.outputs.licenses }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: true

      - uses: oven-sh/setup-bun@v2

      # A pull request checks out the merge commit, whose first parent is the
      # base branch. A push compares with the previous master head; a new
      # branch or a force push that dropped it runs the full suite.
      - name: Select jobs
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
          schedule)
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&per_page=100" \
              --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID and (.event == \"schedule\" or .event == \"workflow_dispatch\"))] | length")
            if [ "$runs" -gt 0 ]; then
              echo "A full run already measured $GITHUB_SHA."
              echo 'mode=skip' >> "$GITHUB_OUTPUT"
            else
              bun scripts/ci-affected.ts full
            fi
            ;;
          pull_request)
            if [ "$BASE_REF" = release ]; then
              bun scripts/ci-affected.ts full
            else
              bun scripts/ci-affected.ts delta HEAD^1
            fi
            ;;
          push)
            if git fetch --depth=1 origin "$BEFORE"; then
              bun scripts/ci-affected.ts delta "$BEFORE"
            else
              bun scripts/ci-affected.ts full
            fi
            ;;
          *)
            bun scripts/ci-affected.ts full
            ;;
          esac

  member-ci:
    name: CI (${{ matrix.name }})
    needs: affected
    if: ${{ needs.affected.outputs.members != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.affected.outputs.members) }}

    # A typical member run finishes in ten minutes, so a fifteen minute budget
    # leaves a slow runner no room: the job is killed, and GitHub reports that
    # kill as "cancelled", which reads as a superseded run rather than a
    # defect. Runner minutes are cheaper than that misreading.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: true

      - uses: oven-sh/setup-bun@v2

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Cache aptre tools
        uses: actions/cache@v6
        with:
          path: ./.tools
          key: ${{ runner.os }}-${{ runner.arch }}-aptre-tools-${{ hashFiles('go.mod', 'go.sum', '.custom-gcl.yml', 'lint/nonavigate/**', 'bldr/**/*.go') }}

      - name: Setup aptre tools and vendor
        run: bun run prepare

      - name: Build Javascript
        if: ${{ matrix.build_script != '' }}
        run: bun run ${{ matrix.build_script }}

      - name: Test Go
        if: ${{ matrix.test_go_script != '' }}
        env:
          GO_PACKAGES: ${{ matrix.go_packages }}
        run: bun run ${{ matrix.test_go_script }}

      - name: Test Js
        if: ${{ matrix.test_js_script != '' }}
        run: bun run ${{ matrix.test_js_script }}

      - name: Lint Js
        if: ${{ matrix.lint_js_script != '' }}
        run: bun run ${{ matrix.lint_js_script }}

      - name: Lint Go
        if: ${{ matrix.lint_go_script != '' }}
        env:
          GO_LINT_PACKAGES: ${{ matrix.lint_packages }}
        run: bun run ${{ matrix.lint_go_script }}

  # Alpha's Go tests, JavaScript tests, and Go lint each saturate a runner for
  # three to six minutes. Running them serially made CI (alpha) the last job
  # to finish while the other runners sat idle, so the stages run as parallel
  # jobs on the shared matrix machinery instead of serial steps. The JavaScript
  # lint takes seconds, so it runs as the test-js stage's check.
  member-ci-alpha:
    name: CI (alpha / ${{ matrix.name }})
    needs: affected
    if: ${{ needs.affected.outputs.alpha != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.affected.outputs.alpha) }}
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: true

      - uses: oven-sh/setup-bun@v2

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Cache aptre tools
        uses: actions/cache@v6
        with:
          path: ./.tools
          key: ${{ runner.os }}-${{ runner.arch }}-aptre-tools-${{ hashFiles('go.mod', 'go.sum', '.custom-gcl.yml', 'lint/nonavigate/**', 'bldr/**/*.go') }}

      - name: Setup aptre tools and vendor
        run: bun run prepare

      - name: Setup alpha production-source fixture
        run: bun run bldr -- --state-path=.bldr-dist setup

      - name: Run alpha checks
        if: ${{ matrix.check_script != '' }}
        run: bun run ${{ matrix.check_script }}

      - name: Run alpha stage
        if: ${{ matrix.script != '' }}
        env:
          GO_PACKAGES: ${{ matrix.go_packages }}
          GO_LINT_PACKAGES: ${{ matrix.go_packages }}
        run: bun run ${{ matrix.script }}

  # The db member's compile check (startup-trace builds ./bldr/... ./db/... with
  # sqlite3, about 153s) and its Go test suite (about 266s, run with -p=1) each
  # saturate a runner; serially they made CI (db) the second-to-last job to finish
  # while other runners sat idle. The stages run as parallel jobs instead.
  member-ci-db:
    name: CI (db / ${{ matrix.name }})
    needs: affected
    if: ${{ needs.affected.outputs.db != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.affected.outputs.db) }}
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: true

      - uses: oven-sh/setup-bun@v2

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Cache aptre tools
        uses: actions/cache@v6
        with:
          path: ./.tools
          key: ${{ runner.os }}-${{ runner.arch }}-aptre-tools-${{ hashFiles('go.mod', 'go.sum', '.custom-gcl.yml', 'lint/nonavigate/**') }}

      - name: Setup aptre tools and vendor
        run: bun run prepare

      # Compile-check the db and bldr packages with the startup-trace tags
      # (compiles sqlite3; about 153s).
      - name: Compile-check startup trace
        if: ${{ matrix.startup_trace }}
        run: bun run check:go:startup-trace

      - name: Lint db
        if: ${{ matrix.lint_go }}
        env:
          GO_LINT_PACKAGES: ${{ matrix.lint_packages }}
        run: bun run lint:go:db

      # About 266s with -p=1 for the whole tree.
      - name: Test db
        if: ${{ matrix.test_go }}
        env:
          GO_PACKAGES: ${{ matrix.go_packages }}
        run: bun run test:go:db

      # wasmbrowsertest runs js/wasm Go test binaries in the runner's Chrome.
      # Ubuntu 24.04 denies unprivileged user namespaces through AppArmor, which
      # leaves Chrome no usable sandbox, so allow them for this job.
      - name: Install wasmbrowsertest
        if: ${{ matrix.test_go_js }}
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          go install github.com/agnivade/wasmbrowsertest@v0.11.1-0.20260609113502-ff350cc7eb28
          mv "$(go env GOPATH)/bin/wasmbrowsertest" "$(go env GOPATH)/bin/go_js_wasm_exec"

      # The js-only Go tests of every selected product package, in Chrome.
      - name: Test js-only Go packages
        if: ${{ matrix.test_go_js }}
        env:
          GO_JS_PACKAGES: ${{ matrix.go_js_packages }}
        run: bun run test:go:js $GO_JS_PACKAGES

      - name: Test and lint db JavaScript
        if: ${{ matrix.js }}
        run: |
          bun run test:js:db
          bun run lint:js:db

  lean:
    name: Lean
    needs: affected
    if: ${{ needs.affected.outputs.lean == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: true

      - uses: oven-sh/setup-bun@v2

      - name: Install Lean
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh |
            sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Check proofs and conformance
        run: bun run test:lean

  python-resource:
    name: Python Resource
    needs: affected
    if: ${{ needs.affected.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: true

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install uv
        run: python -m pip install uv==0.12.3

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install Python Resource environment
        run: uv sync --frozen --all-groups

      - name: Prepare generation dependencies
        run: go mod vendor

      - name: Generate Resource bindings
        run: bun run gen

      - name: Verify generated Resource bindings
        run: |
          manifests=(
            .protoc-python-resource-manifest.json
            .protoc-python-session-journey-manifest.json
          )
          mapfile -t python_generated < <(
            jq -r '.packages[].generatedFiles[]' "${manifests[@]}"
          )
          paths=(
            .protoc-manifest.json
            "${manifests[@]}"
            bldr/resource/resource.pb.go
            bldr/resource/resource.pb.ts
            bldr/resource/resource_srpc.pb.go
            bldr/resource/resource_srpc.pb.ts
            "${python_generated[@]}"
          )
          if ! git diff --exit-code -- "${paths[@]}" ||
            [ -n "$(git status --porcelain -- "${paths[@]}")" ]; then
            echo 'Resource generation changed a committed binding or manifest.'
            exit 1
          fi

      - name: Test Python Resource package
        run: uv run python -m unittest discover -s python/tests -v

      - name: Check Python Resource package
        run: |
          paths=(
            spacewave_resource
            python/tests
            bldr/resource/testdata/cross-runtime-python-client.py
            bldr/resource/testdata/cross-runtime-python-server.py
            bldr/resource/testdata/python-session-journey-client.py
          )
          uv run mypy "${paths[@]}"
          uv run ruff check "${paths[@]}"
          uv run ruff format --check "${paths[@]}"

      - name: Test reciprocal Resource lifecycle
        run: >-
          go test -timeout=30s ./bldr/resource ./bldr/resource/server
          -run 'Test(PythonClientResourceLifecycleAgainstGoServer|PythonClientResourceLifecycleAgainstTypeScriptServer|TypeScriptClientResourceLifecycleAgainstPythonServer|GoClientResourceLifecycleAgainstPythonServer)$'

      - name: Test Python Session journey
        env:
          RUN_PYTHON_SESSION_JOURNEY: '1'
        run: >-
          go test -count=1 -timeout=120s ./core/resource/session
          -run '^TestPythonSessionJourneyAgainstGoSessionOwner$'

      - name: Verify Python Resource wheel
        run: |
          uv build --wheel --out-dir .tmp/python-resource-wheel
          uv run python - <<'PY'
          import json
          from pathlib import Path
          from zipfile import ZipFile

          manifests = (
              Path(".protoc-python-resource-manifest.json"),
              Path(".protoc-python-session-journey-manifest.json"),
          )
          expected = {
              generated
              for manifest in manifests
              for package in json.loads(manifest.read_text())["packages"].values()
              for generated in package["generatedFiles"]
          }
          expected.update(
              {
                  "bldr/resource/py.typed",
                  "core/py.typed",
                  "db/py.typed",
                  "net/py.typed",
                  "sdk/py.typed",
                  "spacewave_resource/__init__.py",
                  "spacewave_resource/client.py",
                  "spacewave_resource/errors.py",
                  "spacewave_resource/py.typed",
                  "spacewave_resource/resource.py",
                  "spacewave_resource/root.py",
                  "spacewave_resource/rpc_stream.py",
                  "spacewave_resource/server.py",
                  "spacewave_resource/session.py",
              }
          )
          wheel = next(Path(".tmp/python-resource-wheel").glob("*.whl"))
          with ZipFile(wheel) as archive:
              payload = {
                  name
                  for name in archive.namelist()
                  if not name.endswith("/") and ".dist-info/" not in name
              }
          if payload != expected:
              raise SystemExit(
                  f"wheel payload = {sorted(payload)!r}, want {sorted(expected)!r}"
              )
          PY
          python=.tmp/python-resource-wheel/venv/bin/python
          uv venv .tmp/python-resource-wheel/venv
          uv pip install --python "$python" .tmp/python-resource-wheel/*.whl
          "$python" -I - <<'PY'
          from bldr.resource import resource_pb2, resource_srpc
          from core.space import space_pb2
          from sdk.root import root_pb2, root_srpc
          from sdk.session import session_pb2, session_srpc
          import spacewave_resource

          assert hasattr(spacewave_resource, "ResourceClient")
          assert hasattr(spacewave_resource, "Resource")
          assert hasattr(spacewave_resource, "Root")
          assert hasattr(spacewave_resource, "Session")
          assert hasattr(resource_pb2, "ResourceClientRequest")
          assert hasattr(resource_srpc, "ResourceServiceClient")
          assert hasattr(root_pb2, "MountSessionByIdxRequest")
          assert hasattr(root_srpc, "RootResourceServiceClient")
          assert hasattr(session_pb2, "WatchResourcesListRequest")
          assert hasattr(session_srpc, "SessionResourceServiceClient")
          assert hasattr(space_pb2, "SpaceSoListEntry")
          rpc = next(
              method
              for method in resource_srpc.RESOURCESERVICE_SERVICE.methods
              if method.name == "ResourceRpc"
          )
          assert rpc.input_type is resource_pb2.ResourceRpcPacket
          assert rpc.output_type is resource_pb2.ResourceRpcPacket
          PY

  licenses:
    name: Licenses
    needs: affected
    if: ${{ needs.affected.outputs.licenses == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: true

      - uses: oven-sh/setup-bun@v2

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Cache aptre tools
        uses: actions/cache@v6
        with:
          path: ./.tools
          key: ${{ runner.os }}-${{ runner.arch }}-aptre-tools-${{ hashFiles('go.mod', 'go.sum', '.custom-gcl.yml', 'lint/nonavigate/**', 'bldr/**/*.go') }}

      - name: Setup aptre tools and vendor
        run: bun run prepare

      - name: Snapshot committed dependencies
        run: |
          mkdir -p .tmp
          jq '[.entries[] | {name, source}] | unique' \
            app/licenses/licenses.json > .tmp/committed-tuples.json

      - name: Test license reporter
        run: go -C scripts/licenses test ./...

      - name: Generate licenses
        run: bun run licenses

      - name: Validate SPDX allowlist
        run: |
          allowed='["0bsd","apache-2.0","apache-2.0 or mit","bsd-2-clause","bsd-3-clause","cc0-1.0","isc","mit","mit-0","mpl-2.0","ofl-1.1"]'
          unknown=$(jq --argjson allowed "$allowed" -r \
            '[.entries[].spdx | ascii_downcase] | unique - $allowed | .[]' \
            app/licenses/licenses.json)
          if [ -n "$unknown" ]; then
            echo "Disallowed SPDX licenses found in app/licenses/licenses.json:"
            echo "$unknown"
            echo
            echo "Allowed list (update .github/workflows/ci.yml if intentional):"
            echo "$allowed" | jq -r '.[]'
            exit 1
          fi

      - name: Validate no new dependencies
        run: |
          jq '[.entries[] | {name, source}] | unique' \
            app/licenses/licenses.json > .tmp/generated-tuples.json
          additions=$(jq -r --slurpfile c .tmp/committed-tuples.json \
            '. - $c[0] | .[] | "  \(.source)/\(.name)"' \
            .tmp/generated-tuples.json)
          if [ -n "$additions" ]; then
            echo "New dependencies present in generated app/licenses/licenses.json but not in the committed file:"
            echo "$additions"
            echo
            echo "Run 'bun run licenses' locally and commit the updated app/licenses/."
            exit 1
          fi
          if ! git diff --quiet -- app/licenses/; then
            echo "app/licenses/ is dirty after 'bun run licenses' but no new dependencies were added."
            echo "The licenses-update job on master will reconcile removals."
          fi

  e2e-go:
    name: E2E (${{ matrix.suite.name }})
    needs: affected
    if: ${{ needs.affected.outputs.mode == 'full' }}
    runs-on: ${{ matrix.suite.os || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: cli
            script: test:go:e2e:cli
            needs_playwright: false
            playwright_browsers: ''
            timeout_minutes: 10
          - name: bldr-comms
            script: test:go:e2e:bldr-comms
            needs_playwright: true
            playwright_browsers: chromium firefox webkit
            timeout_minutes: 10
          - name: bldr-opfs-webkit
            os: macos-latest
            script: test:go:e2e:bldr-opfs:webkit
            needs_playwright: true
            playwright_browsers: webkit
            timeout_minutes: 15
          - name: alpha-core
            script: test:go:e2e:core
            needs_playwright: false
            playwright_browsers: ''
            timeout_minutes: 40
          - name: alpha-browser
            script: test:go:e2e:browser
            needs_playwright: true
            playwright_browsers: chromium
            timeout_minutes: 20
          - name: opfs-chrome-smoke
            script: test:go:db:opfs:chrome:smoke
            needs_playwright: true
            playwright_browsers: chromium
            timeout_minutes: 10
          - name: opfs-chrome-stress
            script: test:go:db:opfs:chrome:stress
            needs_playwright: true
            playwright_browsers: chromium
            timeout_minutes: 20
          - name: trace-service
            script: test:go:e2e:trace
            needs_playwright: false
            playwright_browsers: ''
            timeout_minutes: 20
    timeout-minutes: ${{ matrix.suite.timeout_minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: true

      - uses: oven-sh/setup-bun@v2

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install Playwright browsers for Go tests
        if: ${{ matrix.suite.needs_playwright && matrix.suite.name != 'alpha-browser' }}
        run: go run github.com/mxschmitt/playwright-go/cmd/playwright install --with-deps ${{ matrix.suite.playwright_browsers }}

      - name: Install Playwright browsers for Vitest
        if: ${{ matrix.suite.name == 'alpha-browser' }}
        run: bunx playwright install --with-deps ${{ matrix.suite.playwright_browsers }}

      - name: Cache aptre tools
        uses: actions/cache@v6
        with:
          path: ./.tools
          key: ${{ runner.os }}-${{ runner.arch }}-aptre-tools-${{ hashFiles('go.mod', 'go.sum', '.custom-gcl.yml', 'lint/nonavigate/**', 'bldr/**/*.go') }}

      - name: Setup aptre tools and vendor
        run: bun run prepare

      - name: Run E2E suite
        run: bun run ${{ matrix.suite.script }}

  e2e-wasm:
    name: E2E (wasm / ${{ matrix.slice.name }})
    needs: affected
    if: ${{ needs.affected.outputs.mode == 'full' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        slice:
          - name: support
            run: '^(TestE2ECloudAuthConfigEndpoint|TestStableE2ECloudAuthConfigAddr|TestApplyE2ECloudAuthConfigEndpoint|TestCompileTestScripts|TestCrashReportClassifiesGoFatalAndExitedGoLoop|TestDrainCrashReportDoesNotWaitForFutureMessages|TestTrace(CaptureBytes|CaptureWritesFile|PathDerivation|WindowControl|PolicyBehavior)|Test(Enable(TinyGo|GoScript)ForManifest|ResolveE2EWasmCompiler(RejectsInvalid|RejectsLegacyTinyGoEnv)?|Configure(TinyGoForManifest(RemovesDebugTrace|RemovesSessionHarnessWebRTC|DeterministicConfig)|GoScriptForManifestRemovesSeedRuntimeConfig)|StartupBuildCacheDefaultsToTinyGo|WorkerMode(DefaultsToDedicated|SelectsSharedWorker)|ApplyE2EWasmTinyGoCompilerEnv(DefaultsToFastProfile|CopiesExplicitDebugKnobs)|ClearHarnessStateRoot(PreservesStartupBuildCache|RemovesStartupBuildCache)|BrowserPeerErrorClassification|PeerWatcher(ReturnsNewestObservation|ObservationAfterSkipsStalePeers)|ResourceConnectionTimingSnapshot)|Test(BuildHarnessStateRootKeepsCachedRunsStable|ChromiumLaunchOptions|ConfigureGoScriptBrowserStartupUsesLauncherCoreAndBuildsSQL|ConfigureGoScriptForManifestPreservesTraceService|ConfigureGoScriptForManifestRetainsSessionHarnessWebRTC|CrashReport(IgnoresBenignNormalCloseTeardownAbort|StillCatchesRealAbortPageError)|E2EWasm(BrowserWebRTCEnabled|DriveBenchJSProfileEnabled|TraceServiceEnabled)|HarnessStateRoot(ConcurrentOwnersUseDistinctRoots|OwnerMarkerRoundTrip|ReleaseStopsConsumersBeforeUnlock|SerialOwnersReuseStableRoot)|ReapHarnessCacheOffStateRoots(DeletesDeadPIDMarker|DeletesOldMarkerlessStateRoot|PreservesLivePIDMarker|PreservesStableStateRoot|PreservesYoungMarkerlessStateRoot)|ResolveBldrDependencyUsesExplicitSpacewaveRepoRoot|ResolveE2EWasmManifestBuildTimeout(RejectsInvalid)?|StartupBuildCache(DefaultsOnWithExplicitFreshBuildEscape|EscapeHatchOverridesPreserveOption)|Summarize(BrowserCPUProfileBucketsSamples|TraceBuildsOperationShapeFromTasksAndLogs)|TransientAppWaitErrorIncludesStartupNavigation|WaitForCountConsumesOwnerUpdates)|TestJSSourcemapsDefaultOffWithExplicitDiagnosticOptIn)$'
            timeout_minutes: 20
            job_timeout_minutes: 40
          - name: wasm-harness-retained
            run: '^(TestWasmHarness(Boot|PackageLifecycle|Readiness|Teardown)|TestBrowserSessionIsolation|TestMultiSessionPeerDiscovery|Test(RootResourceMount|SessionMount|SpaceMountAfterQuickstart))$'
            timeout_minutes: 30
            job_timeout_minutes: 50
          - name: drive
            package: scenario
            tags: drive
            run: '^TestScenarios$'
            timeout_minutes: 40
            job_timeout_minutes: 60
          - name: drive-retained
            run: '^(TestQuickstartDriveVideoPreview|TestExistingDriveOpenMeasurement|TestDriveNavigationBurstTrace|TestGoScriptDriveBrowserPreviewRenameUIParity)$'
            timeout_minutes: 40
            job_timeout_minutes: 60
          - name: session-sync
            run: '^(TestLocalOnboardingScenario|TestMultiSessionScenario|TestNoCloud(AnonymousParticipantSync|PairingDirect)|TestRecreatedPageSharedObjectHealthGuard|TestRetainedStatePagePeerProbe)$'
            timeout_minutes: 30
            job_timeout_minutes: 50
          - name: pairing
            run: '^Test(Pairing(HomeDrive|SignedInDrive|StorageQuota)Journey|E2ESignalingReconnect)$'
            timeout_minutes: 30
            job_timeout_minutes: 50
          - name: web-lifecycle-host
            run: '^(TestDedicatedWorkerHostMultiTab|TestWebDocumentLivenessLockReleaseNoDeletion)$'
            timeout_minutes: 40
            job_timeout_minutes: 60
          - name: web-lifecycle-session
            run: '^(TestBackgroundThrottledLifecycle|TestNeverFocusedBackgroundTabLoads|TestReturnVisitorStaticPluginAssetCache|TestServiceWorkerRestartRecoversBldrWebHarness)$'
            timeout_minutes: 40
            job_timeout_minutes: 60
    timeout-minutes: ${{ matrix.slice.job_timeout_minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: true

      - uses: oven-sh/setup-bun@v2

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Resolve Playwright Go version
        id: playwright-go-version
        run: echo "version=$(go list -m -f '{{.Version}}' github.com/mxschmitt/playwright-go)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-browser-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/ms-playwright-go
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-go-driver-${{ steps.playwright-go-version.outputs.version }}

      # Killing apt-get mid-install would leave the dpkg lock held for a retry, so
      # the OS packages get one attempt bounded by the step timeout.
      - name: Install Playwright OS dependencies
        timeout-minutes: 15
        run: go run github.com/mxschmitt/playwright-go/cmd/playwright install-deps chromium

      - name: Install Playwright Chromium
        if: steps.playwright-browser-cache.outputs.cache-hit != 'true'
        run: |
          for attempt in 1 2; do
            if timeout --kill-after=30s 7m go run github.com/mxschmitt/playwright-go/cmd/playwright install chromium; then
              exit 0
            fi
            echo "Playwright install attempt $attempt failed."
          done
          exit 1

      - name: Cache aptre tools
        uses: actions/cache@v6
        with:
          path: ./.tools
          key: ${{ runner.os }}-${{ runner.arch }}-aptre-tools-${{ hashFiles('go.mod', 'go.sum', '.custom-gcl.yml', 'lint/nonavigate/**', 'bldr/**/*.go') }}

      - name: Setup aptre tools and vendor
        run: bun run prepare

      # Reuse the bldr startup manifest build (~280s of vite and GoScript
      # compilation) across runs. The manifest dependency snapshot validates a
      # restored build against the current plugin sources; a stale entry falls
      # back to a normal rebuild.
      - name: Cache bldr startup manifests
        uses: actions/cache@v6
        with:
          path: .bldr/e2e-wasm
          key: ${{ runner.os }}-${{ runner.arch }}-e2e-wasm-manifests-${{ matrix.slice.name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-e2e-wasm-manifests-${{ matrix.slice.name }}-

      - name: Run wasm E2E slice
        env:
          ENABLE_E2E_WASM: 'true'
          E2E_SCENARIO_TAGS: ${{ matrix.slice.tags }}
          GO_TEST_REPORT_TITLE: E2E (wasm / ${{ matrix.slice.name }})
          WASM_TEST_RUN: ${{ matrix.slice.run }}
        run: |
          if [ "${{ matrix.slice.package }}" = "scenario" ]; then
            bun scripts/go-test-report.ts -- go test -json -count=1 -tags e2e_scenario -timeout=${{ matrix.slice.timeout_minutes }}m -run "$WASM_TEST_RUN" ./e2e/scenario
          else
            bun scripts/go-test-report.ts -- go test -json -count=1 -timeout=${{ matrix.slice.timeout_minutes }}m -run "$WASM_TEST_RUN" ./e2e/wasm
          fi

  e2e-wasm-complete:
    name: E2E (wasm)
    runs-on: ubuntu-latest
    needs: [affected, e2e-wasm]
    if: ${{ !cancelled() && needs.affected.outputs.mode == 'full' }}
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Check wasm E2E slices
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ needs.e2e-wasm.result }}" = "success" ]; then
            echo "wasm E2E slices passed"
            exit 0
          fi
          # The matrix result on its own says only that something went wrong,
          # and a slice killed by its own timeout-minutes reports as cancelled,
          # which reads as a slow runner rather than as a defect. Name the
          # slices that did not pass and the step each one stopped on.
          echo "wasm E2E slices completed with result: ${{ needs.e2e-wasm.result }}"
          echo
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100" \
            --jq '.jobs[]
              | select(.name | startswith("E2E (wasm / "))
              | select(.conclusion != "success")
              | . as $job
              | (($job.steps // [])
                  | map(select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out"))
                  | first) as $step
              | "\($job.conclusion)\t\($job.name)\tstopped on: \($step.name // "unknown")\n  \($job.html_url)"' \
            || echo "could not list the slice jobs; open the run to see which slice failed"
          exit 1

  e2e-playwright:
    name: E2E (${{ matrix.suite.name }})
    needs: affected
    if: ${{ needs.affected.outputs.mode == 'full' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: bldr-web
            script: bldr:test:e2e
            playwright_browsers: chromium firefox
            timeout_minutes: 15
    timeout-minutes: ${{ matrix.suite.timeout_minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: true

      - uses: oven-sh/setup-bun@v2

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps ${{ matrix.suite.playwright_browsers }}

      - name: Cache aptre tools
        uses: actions/cache@v6
        with:
          path: ./.tools
          key: ${{ runner.os }}-${{ runner.arch }}-aptre-tools-${{ hashFiles('go.mod', 'go.sum', '.custom-gcl.yml', 'lint/nonavigate/**', 'bldr/**/*.go') }}

      - name: Setup aptre tools and vendor
        run: bun run prepare

      - name: Run Playwright E2E suite
        run: bun run ${{ matrix.suite.script }}
  nightly-workflow-contract:
    name: Nightly workflow contract
    needs: affected
    if: ${{ needs.affected.outputs.mode == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate release-WASM matrix contract
        shell: bash
        run: |
          ruby -ryaml <<'RUBY'
          options = Psych::VERSION.to_i >= 4 ? { aliases: true } : {}
          workflow = YAML.load_file(".github/workflows/e2e-nightly.yml", **options)
          jobs = workflow.fetch("jobs")
          build = jobs.fetch("release-wasm-build")
          smoke = jobs.fetch("release-wasm-smoke")

          step = lambda do |job, name|
            job.fetch("steps").find { |candidate| candidate["name"] == name } ||
              abort("missing step #{name.inspect}")
          end

          [build, smoke].each do |job|
            strategy = job.fetch("strategy")
            abort("release-WASM matrices must disable fail-fast") unless strategy["fail-fast"] == false
          end

          build_matrix = Array(build.fetch("strategy").fetch("matrix").fetch("include"))
          smoke_matrix = Array(smoke.fetch("strategy").fetch("matrix").fetch("include"))
          unless build_matrix == smoke_matrix
            abort("release-WASM build and smoke matrices differ")
          end

          expected = {
            "go" => {
              "build_script" => "build:release:web:e2e:ci",
              "smoke_script" => "test:go:e2e:release-wasm",
              "e2e_tinygo" => "",
              "e2e_goscript" => "",
              "install_binaryen" => false,
              "install_tinygo" => false,
            },
            "tinygo" => {
              "build_script" => "build:release:web:e2e:tinygo",
              "smoke_script" => "test:go:e2e:release-wasm",
              "e2e_tinygo" => true,
              "e2e_goscript" => "",
              "install_binaryen" => true,
              "install_tinygo" => true,
            },
            "goscript" => {
              "build_script" => "build:release:web:e2e:goscript",
              "smoke_script" => "test:go:e2e:release-wasm:goscript",
              "e2e_tinygo" => "",
              "e2e_goscript" => true,
              "install_binaryen" => false,
              "install_tinygo" => false,
            },
          }
          unless build_matrix.all? { |entry| expected.key?(entry.fetch("compiler")) }
            abort("release-WASM compiler matrix contains an unknown compiler")
          end
          build_matrix.each do |entry|
            compiler = entry.fetch("compiler")
            unless entry.slice(*expected.fetch(compiler).keys) == expected.fetch(compiler)
              abort("release-WASM matrix entry for #{compiler.inspect} is incorrect: #{entry.inspect}")
            end
          end

          unless smoke.fetch("needs") == "release-wasm-build"
            abort("release-WASM smoke must consume release-wasm-build")
          end

          ["Install Binaryen", "Install TinyGo"].each do |name|
            producer = step.call(build, name)
            consumer = step.call(smoke, name)
            unless producer["run"] == consumer["run"]
              abort("#{name} differs between build and smoke jobs")
            end
            unless producer["if"] == consumer["if"]
              abort("#{name} condition differs between build and smoke jobs")
            end
          end

          verify = step.call(smoke, "Verify release-WASM fallback toolchain")
          unless verify.fetch("if") == "matrix.install_binaryen || matrix.install_tinygo"
            abort("smoke job must gate fallback toolchain probes on the matrix arm")
          end
          unless verify.fetch("run").include?("command -v tinygo") &&
              verify.fetch("run").include?("command -v wasm-opt")
            abort("smoke job must probe each required release-WASM toolchain")
          end

          matrix_expression = "$" + "{{ matrix.compiler }}"
          smoke_steps = smoke.fetch("steps")
          verify_index = smoke_steps.index(verify)
          test_index = smoke_steps.index { |candidate| candidate["name"] == "Run release-WASM #{matrix_expression} browser smoke" }
          abort("toolchain probe must precede the smoke test") unless verify_index < test_index

          [build, smoke].each do |job|
            artifact_step = step.call(job, job.equal?(build) ? "Upload release-WASM browser artifact" : "Download release-WASM browser artifact")
            unless artifact_step.fetch("with").fetch("name").include?(matrix_expression)
              abort("release-WASM artifact names must include the compiler")
            end
          end

          puts "nightly release-WASM smoke contract: PASS"
          RUBY
