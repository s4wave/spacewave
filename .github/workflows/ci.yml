name: CI

on:
  push:
    branches: ['master']
    paths-ignore:
      - 'doc/**'
      - '*.md'
      - 'CHANGELOG.org'
  pull_request:
    branches: ['master']
    paths-ignore:
      - 'doc/**'
      - '*.md'
      - 'CHANGELOG.org'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  member-ci:
    name: CI (${{ matrix.member.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        member:
          - name: alpha
            build_script: ''
            check_script: typecheck
            lint_go_script: ''
            lint_js_script: ''
            test_go_script: test:go:alpha
            test_js_script: test:js:alpha
          - name: auth
            build_script: ''
            check_script: ''
            lint_go_script: lint:go:auth
            lint_js_script: lint:js:auth
            test_go_script: test:go:auth
            test_js_script: test:js:auth
          - name: forge
            build_script: ''
            check_script: ''
            lint_go_script: lint:go:forge
            lint_js_script: lint:js:forge
            test_go_script: test:go:forge
            test_js_script: test:js:forge
          - name: net
            build_script: build:net
            check_script: ''
            lint_go_script: lint:go:net
            lint_js_script: lint:js:net
            test_go_script: test:go:net
            test_js_script: test:js:net
          - name: bldr
            build_script: ''
            check_script: bldr:typecheck
            lint_go_script: ''
            lint_js_script: ''
            test_go_script: ''
            test_js_script: ''
          - name: goscript
            build_script: ''
            check_script: ''
            lint_go_script: ''
            lint_js_script: ''
            test_go_script: test:go:goscript
            test_js_script: ''
          - name: e2e
            build_script: ''
            check_script: ''
            lint_go_script: lint:go:e2e
            lint_js_script: ''
            test_go_script: ''
            test_js_script: ''
          - name: db
            build_script: ''
            check_script: check:go:startup-trace
            lint_go_script: lint:go:db
            lint_js_script: lint:js:db
            test_go_script: test:go:db
            test_js_script: test:js:db
          - name: identity
            build_script: ''
            check_script: ''
            lint_go_script: lint:go:identity
            lint_js_script: lint:js:identity
            test_go_script: test:go:identity
            test_js_script: test:js:identity

    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@v2

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Cache aptre tools
        uses: actions/cache@v6
        with:
          path: ./.tools
          key: ${{ runner.os }}-${{ runner.arch }}-aptre-tools-${{ hashFiles('go.mod', 'go.sum', '.custom-gcl.yml') }}

      - name: Setup aptre tools and vendor
        run: bun run prepare

      - name: Build Javascript
        if: ${{ matrix.member.build_script != '' }}
        run: bun run ${{ matrix.member.build_script }}

      - name: Run member checks
        if: ${{ matrix.member.check_script != '' }}
        run: bun run ${{ matrix.member.check_script }}

      - name: Test Go
        if: ${{ matrix.member.test_go_script != '' }}
        run: bun run ${{ matrix.member.test_go_script }}

      - name: Test Js
        if: ${{ matrix.member.test_js_script != '' }}
        run: bun run ${{ matrix.member.test_js_script }}

      - name: Lint Js
        if: ${{ matrix.member.lint_js_script != '' }}
        run: bun run ${{ matrix.member.lint_js_script }}

      - name: Lint Go
        if: ${{ matrix.member.lint_go_script != '' }}
        run: bun run ${{ matrix.member.lint_go_script }}

  licenses:
    name: Licenses
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@v2

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Cache aptre tools
        uses: actions/cache@v6
        with:
          path: ./.tools
          key: ${{ runner.os }}-${{ runner.arch }}-aptre-tools-${{ hashFiles('go.mod', 'go.sum', '.custom-gcl.yml') }}

      - name: Setup aptre tools and vendor
        run: bun run prepare

      - name: Snapshot committed dependencies
        run: |
          mkdir -p .tmp
          jq '[.entries[] | {name, source}] | unique' \
            app/licenses/licenses.json > .tmp/committed-tuples.json

      - name: Generate licenses
        run: bun run licenses

      - name: Validate SPDX allowlist
        run: |
          allowed='["0bsd","apache-2.0","apache-2.0 or mit","bsd-2-clause","bsd-3-clause","cc0-1.0","isc","mit","mpl-2.0"]'
          unknown=$(jq --argjson allowed "$allowed" -r \
            '[.entries[].spdx | ascii_downcase] | unique - $allowed | .[]' \
            app/licenses/licenses.json)
          if [ -n "$unknown" ]; then
            echo "Disallowed SPDX licenses found in app/licenses/licenses.json:"
            echo "$unknown"
            echo
            echo "Allowed list (update .github/workflows/ci.yml if intentional):"
            echo "$allowed" | jq -r '.[]'
            exit 1
          fi

      - name: Validate no new dependencies
        run: |
          jq '[.entries[] | {name, source}] | unique' \
            app/licenses/licenses.json > .tmp/generated-tuples.json
          additions=$(jq -r --slurpfile c .tmp/committed-tuples.json \
            '. - $c[0] | .[] | "  \(.source)/\(.name)"' \
            .tmp/generated-tuples.json)
          if [ -n "$additions" ]; then
            echo "New dependencies present in generated app/licenses/licenses.json but not in the committed file:"
            echo "$additions"
            echo
            echo "Run 'bun run licenses' locally and commit the updated app/licenses/."
            exit 1
          fi
          if ! git diff --quiet -- app/licenses/; then
            echo "app/licenses/ is dirty after 'bun run licenses' but no new dependencies were added."
            echo "The licenses-update job on master will reconcile removals."
          fi

  e2e-go:
    name: E2E (${{ matrix.suite.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: cli
            script: test:go:e2e:cli
            needs_playwright: false
            playwright_browsers: ''
            timeout_minutes: 10
          - name: bldr-comms
            script: test:go:e2e:bldr-comms
            needs_playwright: true
            playwright_browsers: chromium firefox webkit
            timeout_minutes: 10
          - name: alpha-core
            script: test:go:e2e:core
            needs_playwright: false
            playwright_browsers: ''
            timeout_minutes: 40
          - name: alpha-browser
            script: test:go:e2e:browser
            needs_playwright: true
            playwright_browsers: chromium
            timeout_minutes: 20
          - name: opfs-chrome-smoke
            script: test:go:db:opfs:chrome:smoke
            needs_playwright: true
            playwright_browsers: chromium
            timeout_minutes: 10
          - name: trace-service
            script: test:go:e2e:trace
            needs_playwright: false
            playwright_browsers: ''
            timeout_minutes: 20
    timeout-minutes: ${{ matrix.suite.timeout_minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@v2

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install Playwright browsers for Go tests
        if: ${{ matrix.suite.needs_playwright && matrix.suite.name != 'alpha-browser' }}
        run: go run github.com/mxschmitt/playwright-go/cmd/playwright install --with-deps ${{ matrix.suite.playwright_browsers }}

      - name: Install Playwright browsers for Vitest
        if: ${{ matrix.suite.name == 'alpha-browser' }}
        run: bunx playwright install --with-deps ${{ matrix.suite.playwright_browsers }}

      - name: Cache aptre tools
        uses: actions/cache@v6
        with:
          path: ./.tools
          key: ${{ runner.os }}-${{ runner.arch }}-aptre-tools-${{ hashFiles('go.mod', 'go.sum', '.custom-gcl.yml') }}

      - name: Setup aptre tools and vendor
        run: bun run prepare

      - name: Run E2E suite
        run: bun run ${{ matrix.suite.script }}

  e2e-wasm:
    name: E2E (wasm / ${{ matrix.slice.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        slice:
          - name: support
            run: '^(TestE2ECloudAuthConfigEndpoint|TestStableE2ECloudAuthConfigAddr|TestApplyE2ECloudAuthConfigEndpoint|TestCompileTestScripts|TestCrashReportClassifiesGoFatalAndExitedGoLoop|TestDrainCrashReportDoesNotWaitForFutureMessages|TestTrace(CaptureBytes|CaptureWritesFile|PathDerivation|WindowControl|PolicyBehavior)|Test(Enable(TinyGo|GoScript)ForManifest|ResolveE2EWasmCompiler(RejectsInvalid|RejectsLegacyTinyGoEnv)?|Configure(TinyGoForManifest(RemovesDebugTrace|RemovesSessionHarnessWebRTC|DeterministicConfig)|GoScriptForManifestRemovesSeedRuntimeConfig)|StartupBuildCacheDefaultsToTinyGo|WorkerMode(DefaultsToDedicated|SelectsSharedWorker)|ApplyE2EWasmTinyGoCompilerEnv(DefaultsToFastProfile|CopiesExplicitDebugKnobs)|ClearHarnessStateRoot(PreservesStartupBuildCache|RemovesStartupBuildCache)|BrowserPeerErrorClassification|PeerWatcher(ReturnsNewestObservation|ObservationAfterSkipsStalePeers)|ResourceConnectionTimingSnapshot))$'
            timeout_minutes: 20
          - name: harness
            package: scenario
            tags: first-use
            run: '^TestScenarios$'
            timeout_minutes: 40
          - name: wasm-harness-retained
            run: '^(TestWasmHarness(Boot|PackageLifecycle|Readiness|Teardown)|TestBrowserSessionIsolation|TestMultiSessionPeerDiscovery|Test(RootResourceMount|SessionMount|SpaceMountAfterQuickstart))$'
            timeout_minutes: 30
          - name: drive
            package: scenario
            tags: drive
            run: '^TestScenarios$'
            timeout_minutes: 40
          - name: drive-retained
            run: '^(TestQuickstartDriveVideoPreview|TestExistingDriveOpenMeasurement|TestDriveNavigationBurstTrace|TestGoScriptDriveBrowserPreviewRenameUIParity)$'
            timeout_minutes: 40
          - name: forge-blog
            run: '^(TestQuickstartForge(Route|Trace)|TestForge(ScenarioSequence|WorkerExecution)|TestBlog(CoexistenceScenario|QuickstartSetupProbe|QuickstartRetainedStateRegistrationProbe))$'
            timeout_minutes: 20
          - name: session-sync
            run: '^(TestLocalOnboardingScenario|TestMultiSessionScenario|TestNoCloud(AnonymousParticipantSync|PairingDirect)|TestRecreatedPageSharedObjectHealthGuard|TestRetainedStatePagePeerProbe)$'
            timeout_minutes: 30
          - name: web-lifecycle-host
            run: '^(TestDedicatedWorkerHostMultiTab|TestWebDocumentLivenessLockReleaseNoDeletion)$'
            timeout_minutes: 40
          - name: web-lifecycle-session
            run: '^(TestBackgroundThrottledLifecycle|TestNeverFocusedBackgroundTabLoads|TestServiceWorkerRestartRecoversBldrWebHarness)$'
            timeout_minutes: 40
    timeout-minutes: ${{ matrix.slice.timeout_minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@v2

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Resolve Playwright Go version
        id: playwright-go-version
        run: echo "version=$(go list -m -f '{{.Version}}' github.com/mxschmitt/playwright-go)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-browser-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/ms-playwright-go
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-go-driver-${{ steps.playwright-go-version.outputs.version }}

      - name: Install Playwright browser OS dependencies
        if: ${{ steps.playwright-browser-cache.outputs.cache-hit == 'true' }}
        run: go run github.com/mxschmitt/playwright-go/cmd/playwright install-deps chromium

      - name: Install Playwright browsers for Go tests
        if: ${{ steps.playwright-browser-cache.outputs.cache-hit != 'true' }}
        run: go run github.com/mxschmitt/playwright-go/cmd/playwright install --with-deps chromium

      - name: Cache aptre tools
        uses: actions/cache@v6
        with:
          path: ./.tools
          key: ${{ runner.os }}-${{ runner.arch }}-aptre-tools-${{ hashFiles('go.mod', 'go.sum', '.custom-gcl.yml') }}

      - name: Setup aptre tools and vendor
        run: bun run prepare

      - name: Run wasm E2E slice
        env:
          ENABLE_E2E_WASM: 'true'
          E2E_WASM_STARTUP_BUILD_CACHE: 'false'
          E2E_SCENARIO_TAGS: ${{ matrix.slice.tags }}
          GO_TEST_REPORT_TITLE: E2E (wasm / ${{ matrix.slice.name }})
          WASM_TEST_RUN: ${{ matrix.slice.run }}
        run: |
          if [ "${{ matrix.slice.package }}" = "scenario" ]; then
            bun scripts/go-test-report.ts -- go test -json -count=1 -tags e2e_scenario -timeout=${{ matrix.slice.timeout_minutes }}m -run "$WASM_TEST_RUN" ./e2e/scenario
          else
            bun scripts/go-test-report.ts -- go test -json -count=1 -timeout=${{ matrix.slice.timeout_minutes }}m -run "$WASM_TEST_RUN" ./e2e/wasm
          fi

  e2e-wasm-complete:
    name: E2E (wasm)
    runs-on: ubuntu-latest
    needs: e2e-wasm
    if: ${{ always() }}
    timeout-minutes: 5
    steps:
      - name: Check wasm E2E slices
        run: |
          if [ "${{ needs.e2e-wasm.result }}" != "success" ]; then
            echo "wasm E2E slices completed with result: ${{ needs.e2e-wasm.result }}"
            exit 1
          fi
          echo "wasm E2E slices passed"

  e2e-playwright:
    name: E2E (${{ matrix.suite.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: bldr-web
            script: bldr:test:e2e
            playwright_browsers: chromium firefox
            timeout_minutes: 15
    timeout-minutes: ${{ matrix.suite.timeout_minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@v2

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps ${{ matrix.suite.playwright_browsers }}

      - name: Cache aptre tools
        uses: actions/cache@v6
        with:
          path: ./.tools
          key: ${{ runner.os }}-${{ runner.arch }}-aptre-tools-${{ hashFiles('go.mod', 'go.sum', '.custom-gcl.yml') }}

      - name: Setup aptre tools and vendor
        run: bun run prepare

      - name: Run Playwright E2E suite
        run: bun run ${{ matrix.suite.script }}
