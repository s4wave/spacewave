name: Nightly E2E

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  TINYGO_VERSION: 0.41.1
  BINARYEN_VERSION: 129
  # Binaryen's static Linux release binaries can segfault in pthreaded
  # wasm-opt on deep optimization recursion. Keep TinyGo's optimization level
  # unchanged, but force wasm-opt to avoid pthread workers on GitHub Linux.
  BINARYEN_CORES: 1

jobs:
  e2e-go-nightly:
    name: Nightly E2E (${{ matrix.suite.name }})
    runs-on: ubuntu-latest
    env:
      BLDR_WASM_OPT_DIAGNOSTICS_DIR: ${{ github.workspace }}/.tmp/wasm-opt-diagnostics
      BLDR_GO_WASM_OPTIMIZE: ${{ matrix.suite.go_wasm_optimize }}
      BLDR_ELECTRON_NO_SANDBOX: ${{ matrix.suite.electron_no_sandbox }}
      E2E_ELECTRON_CDP_READY_TIMEOUT: ${{ matrix.suite.electron_cdp_ready_timeout }}
      E2E_RELEASE_WASM_BUILD_SCRIPT: ${{ matrix.suite.release_wasm_build_script }}
    strategy:
      fail-fast: false
      matrix:
        # core/e2e/onboarding requires SPACEWAVE_CLOUD_DIR, so it stays out of
        # this public nightly matrix until CI has a cloud checkout available.
        suite:
          - name: electron
            script: test:go:e2e:electron
            release_wasm_build_script: ''
            needs_playwright: true
            playwright_browsers: chromium
            use_xvfb: true
            electron_no_sandbox: true
            needs_tinygo: false
            electron_cdp_ready_timeout: 20m
            go_wasm_optimize: ''
          - name: release-wasm
            script: test:go:e2e:release-wasm
            release_wasm_build_script: build:release:web:e2e:ci
            needs_playwright: true
            playwright_browsers: chromium
            use_xvfb: false
            electron_no_sandbox: false
            needs_tinygo: true
            electron_cdp_ready_timeout: ''
            go_wasm_optimize: 'false'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 25.x

      - uses: oven-sh/setup-bun@v2

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install Playwright browsers
        if: ${{ matrix.suite.needs_playwright }}
        run: go run github.com/playwright-community/playwright-go/cmd/playwright install --with-deps ${{ matrix.suite.playwright_browsers }}

      - name: Install Binaryen
        if: ${{ matrix.suite.needs_tinygo }}
        shell: bash
        run: |
          set -euo pipefail
          binaryen_tar="binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          binaryen_url="https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}"
          wget --quiet "${binaryen_url}/${binaryen_tar}"
          wget --quiet "${binaryen_url}/${binaryen_tar}.sha256"
          sha256sum --check "${binaryen_tar}.sha256"
          mkdir -p "${RUNNER_TEMP}/binaryen"
          tar -xzf "${binaryen_tar}" -C "${RUNNER_TEMP}/binaryen" --strip-components=1
          echo "${RUNNER_TEMP}/binaryen/bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/binaryen/bin/wasm-opt" --version

      - name: Install TinyGo
        if: ${{ matrix.suite.needs_tinygo }}
        shell: bash
        run: |
          set -euo pipefail
          tinygo_deb="tinygo_${TINYGO_VERSION}_amd64.deb"
          wget --quiet "https://github.com/tinygo-org/tinygo/releases/download/v${TINYGO_VERSION}/${tinygo_deb}"
          sudo dpkg -i "${tinygo_deb}"
          sudo sed -i 's/return t[.]roundTrip(req)/return roundTrip(req)/' /usr/local/lib/tinygo/src/net/http/roundtrip_js.go
          grep -q 'return roundTrip(req)' /usr/local/lib/tinygo/src/net/http/roundtrip_js.go
          tinygo version

      - name: Cache aptre tools
        uses: actions/cache@v5
        with:
          path: ./.tools
          key: ${{ runner.os }}-aptre-tools-${{ hashFiles('**/go.sum') }}

      - name: Setup aptre tools and vendor
        run: bun run prepare

      - name: Run Nightly E2E suite
        if: ${{ !matrix.suite.use_xvfb }}
        run: bun run ${{ matrix.suite.script }}

      - name: Run Nightly E2E suite with xvfb
        if: ${{ matrix.suite.use_xvfb }}
        run: xvfb-run --auto-servernum --server-args='-screen 0 1280x720x24' bun run ${{ matrix.suite.script }}

      - name: Upload wasm-opt diagnostics
        if: failure() && matrix.suite.needs_tinygo
        uses: actions/upload-artifact@v7
        with:
          name: nightly-wasm-opt-diagnostics-${{ github.run_id }}
          path: .tmp/wasm-opt-diagnostics
          include-hidden-files: true
          if-no-files-found: warn
