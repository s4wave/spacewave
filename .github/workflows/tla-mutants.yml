name: TLA+ mutants

# The CI spec jobs check each model's configs and judge no mutant, because the
# mutants take hours and those jobs gate a landing. This workflow judges every
# mutant of the specs CI checks, nightly on master: each spec's Foo.mutants.json
# and each testdata config mutant. scripts/ci-affected.ts mutants lists the
# jobs, splitting the specs whose mutants take hours into one job per source.
on:
  schedule:
    - cron: '43 10 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  select:
    name: Select
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mutants: ${{ steps.select.outputs.mutants }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@v2

      - name: List the mutant jobs
        id: select
        run: bun scripts/ci-affected.ts mutants

  mutants:
    name: TLA+ mutants (${{ matrix.name }})
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.mutants) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@v2

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Judge mutants
        env:
          TARGETS: ${{ matrix.targets }}
          # tla-ts keeps the whole state space in the Node heap.
          NODE_OPTIONS: --max-old-space-size=12288
        run: |
          read -ra targets <<<"$TARGETS"
          bun run check:tla:mutants -workers 1 "${targets[@]}"
