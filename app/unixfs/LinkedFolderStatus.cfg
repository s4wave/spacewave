\* The charted config: one version, and Alice's laptop may sleep, so Bob's
\* row reaches Unavailable and the chart stays within its state budget.
CONSTANTS
  MaxVer = 1
  CloudBacked = FALSE
  Readers = {"member"}
  RowPresence = FALSE
  Faults = {"lapSleeps"}
INIT Init
NEXT StatusNext
INVARIANT TypeOK EveryShownActionWorks NobodyIsStuck LinkerOnly OpenOnlyPublished HoldNamed HintTruthful PresentIsPublished FetchesPublished PublishedFromDisk CloudFromPublished NothingBeforePublish
