syntax = "proto3";
package bldr.desktop.control;

import "github.com/s4wave/spacewave/bldr/web/plugin/plugin.proto";

option go_package = "github.com/s4wave/spacewave/bldr/desktop/control;desktop_control";

// DesktopControlService opens and ends the desktop owned by the daemon serving the Resource socket.
service DesktopControlService {
  // OpenOrFocusDesktop opens or focuses the daemon's selected desktop.
  rpc OpenOrFocusDesktop(OpenOrFocusDesktopRequest) returns (OpenOrFocusDesktopResponse);
  // QuitDesktop records explicit Quit for the current shell and reports work that will retain the daemon.
  rpc QuitDesktop(QuitDesktopRequest) returns (QuitDesktopResponse);
  // WatchDesktopStatus sends current desktop status and subsequent changes without owning the shell.
  rpc WatchDesktopStatus(WatchDesktopStatusRequest) returns (stream WatchDesktopStatusResponse);
}

// OpenOrFocusDesktopRequest selects the initial route in the desktop.
message OpenOrFocusDesktopRequest {
  // Route is the optional application route to open.
  string route = 1;
  // InstalledApp is the application bundle that requested the desktop.
  // Desktop app updates replace this bundle; empty when not launched from one.
  string installed_app = 2;
}

// OpenOrFocusDesktopResponse identifies the daemon and UI artifact that opened.
message OpenOrFocusDesktopResponse {
  // DaemonPid identifies the running daemon process.
  int64 daemon_pid = 1;
  // DaemonExecutable is the running daemon's executable path.
  string daemon_executable = 2;
  // DaemonRelease is the application release embedded in the running executable.
  string daemon_release = 3;
  // UiManifestRef identifies the selected web plugin artifact.
  string ui_manifest_ref = 4;
}

// QuitDesktopRequest asks the daemon to stop after this desktop shell exits if unused.
message QuitDesktopRequest {
}

// QuitDesktopResponse reports demand outside this shell and the requesting connection.
message QuitDesktopResponse {
  // OtherWork names the Resource clients and persistent services apart from
  // the requester and this desktop shell, sorted, with a count suffix on a
  // repeated name.
  repeated string other_work = 1;
}

// WatchDesktopStatusRequest subscribes to the daemon's desktop observation.
message WatchDesktopStatusRequest {
}

// WatchDesktopStatusResponse survives launcher disconnection and is replayed to new subscribers.
message WatchDesktopStatusResponse {
  // Generation identifies the shell in the selected web plugin; zero means none has opened.
  uint64 generation = 1;
  // Presence is the Electron owner's last observation, absent until confirmed.
  // ACTIVE confirms open readiness; ENDED confirms exit, with Error distinguishing failure.
  .bldr.web.plugin.WatchDesktopPresenceResponse presence = 2;
  // Failure reports an operation, observation, or busy Quit outcome, not proof of shell exit.
  // An observation failure preserves Presence and the daemon's service demand.
  string failure = 3;
}
