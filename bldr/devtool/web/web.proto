syntax = "proto3";
package devtool.web;

import "github.com/s4wave/spacewave/bldr/plugin/host/scheduler/config.proto";
import "github.com/s4wave/spacewave/db/volume/volume.proto";

// DevtoolInitBrowser is the message initializing the browser from the devtool.
message DevtoolInitBrowser {
  // AppId is the application id for browser storage.
  string app_id = 1;
  // DevtoolPeerId is the peer id to use for the devtool link.
  string devtool_peer_id = 2;
  // DevtoolVolumeInfo is the information for the devtool Volume.
  // The volume is exposed with a ProxyVolume.
  .volume.VolumeInfo devtool_volume_info = 3;
  // StartPlugins is a list of plugins to LoadPlugin at startup.
  repeated string start_plugins = 4;
  // ForceDedicatedWorkers overrides the default SharedWorker mode to use
  // dedicated Workers for plugins. Useful for testing with Playwright
  // which can capture console output from dedicated workers but not shared
  // workers.
  bool force_dedicated_workers = 5;
  // PlatformSelectionPolicies bind project-owned startup plugins to the
  // platform selected by the active development compiler.
  repeated .plugin.host.scheduler.PlatformSelectionPolicy platform_selection_policies = 6;
  // AdmissionPluginId identifies the plugin that owns this device's plugin
  // approvals. The host builds its root admission controller asking that
  // plugin in code at startup. An empty AdmissionPluginId leaves admission to
  // the trusted roots.
  string admission_plugin_id = 7;
}
