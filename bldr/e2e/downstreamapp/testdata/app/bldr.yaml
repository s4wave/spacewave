id: bldr-downstream-e2e

start:
  plugins:
    - web
    - downstream-core
    - downstream-web
  loadWebStartup: web/startup.tsx

manifests:
  web:
    builder:
      id: bldr/web/plugin/compiler
      config: {}

  downstream-core:
    rev: 1
    builder:
      id: bldr/plugin/compiler/go
      rev: 1
      config:
        webPluginId: web
        goPkgs:
          - ./core
          - github.com/s4wave/spacewave/bldr/plugin/load
          - github.com/s4wave/spacewave/bldr/web/plugin/handle-rpc
          - github.com/s4wave/spacewave/core/resource/root/controller
        disableRpcFetch: true
        configSet:
          downstream-core-root:
            id: downstream-app/core
            rev: 1
          resource-root:
            id: resource/root
            rev: 1
          load-web:
            id: bldr/plugin/load
            rev: 1
            config:
              pluginId: web
          handle-rpc:
            id: bldr/web/plugin/handle-rpc
            rev: 1
            config:
              webPluginId: web
              handlePluginId: downstream-core
              serverIdRe: web-view/.*

  downstream-web:
    rev: 1
    builder:
      id: bldr/plugin/compiler/js
      rev: 1
      config:
        webPluginId: web
        viteConfigPaths:
          - ./vite.config.ts
        modules:
          - kind: JS_MODULE_KIND_FRONTEND
            path: ./web/App.tsx
            entrypoint: true
            webViewParentId:
              empty: true
        webPkgs:
          - id: '@aptre/bldr-react'
          - id: '@aptre/bldr-sdk'
            entrypoints:
              - path: ./resource
            imports:
              - resource/resource_srpc.pb.ts
          - id: sonner
          - id: '@s4wave/web'
            entrypoints:
              - path: ./sdk/app/viewer-catalog
              - path: ./sdk/app/lifecycle
              - path: ./object/ObjectViewerContent
              - path: ./object/object
              - path: ./object/object.pb
              - path: ./object/ObjectViewerLoadingState
              - path: ./style/utils
              - path: ./ui/button
              - path: ./ui/toaster
              - path: ./ui/loading/LoadingCard
              - path: ./ui/loading/ProgressBar
              - path: ./ui/loading/Spinner
              - path: ./ui/loading/types
          - id: non-index-root-pkg
            entrypoints:
              - path: ./examples/extra

build:
  web:
    manifests:
      - web
      - downstream-core
      - downstream-web
    targets:
      - browser
