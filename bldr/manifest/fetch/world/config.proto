syntax = "proto3";
package manifest.fetch.world;

// Config configures a controller to fetch manifests via a world engine.
// Searches for <manifest> linked manifests to the object key.
// Resolves the FetchManifest directive.
message Config {
  // EngineId is the world engine id to attach to.
  string engine_id = 1;
  // ObjectKeys is the list of object keys to search from for manifests.
  // Searches for <manifest> linked manifests.
  repeated string object_keys = 2;
  // FetchManifestIdRe is the regex of manifest IDs to fetch with this controller.
  // If empty, will lookup for any FetchManifest directive.
  string fetch_manifest_id_re = 3;
  // DisableWatch disables watching the world for changes for FetchManifest.
  bool disable_watch = 4;
  // OverrideManifestRev overrides the manifest revision in the returned metadata.
  // Ignored if unset or zero.
  uint64 override_manifest_rev = 5;
  // CdnSpaceId optionally mounts a read-only CDN Release World under EngineId.
  // When set, CdnBaseUrl is required and the controller resolves EngineId
  // without needing a separate World engine controller.
  string cdn_space_id = 6;
  // CdnBaseUrl is the public CDN base URL for CdnSpaceId.
  string cdn_base_url = 7;
  // PointerTtlDur is the cached CDN root pointer TTL.
  // Empty uses the CDN block store default. Negative disables expiry.
  string pointer_ttl_dur = 8;
  // ReleaseMetadataChannelKey reads ReleaseMetadata.ManifestRefs for this
  // channel when ordinary manifest graph links are absent. Empty disables the
  // release-metadata fallback.
  string release_metadata_channel_key = 9;
}
