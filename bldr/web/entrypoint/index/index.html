<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="darkreader-lock" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #0a0a0a;
      }

      #bldr-root {
        display: flex;
        position: fixed;
        inset: 0;
      }

      .sw-initial-shell {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100%;
        width: 100%;
        background: #0a0a0a;
        color: #fafafa;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }

      .sw-initial-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
        text-align: center;
      }

      .sw-initial-logo {
        display: flex;
        height: 5rem;
        width: 5rem;
        align-items: center;
        justify-content: center;
        border-radius: 1rem;
        background: color-mix(in srgb, #4f8cff 10%, transparent);
        box-shadow: 0 0 42px color-mix(in srgb, #4f8cff 22%, transparent);
      }

      .sw-initial-logo-mark {
        display: flex;
        height: 2.75rem;
        width: 2.75rem;
        align-items: center;
        justify-content: center;
        border-radius: 0.75rem;
        background: #4f8cff;
        color: #fff;
        font-weight: 700;
        letter-spacing: -0.04em;
      }

      .sw-initial-title {
        margin: 0;
        font-size: 1.5rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        line-height: 1.2;
      }

      .sw-initial-spinner {
        height: 0.875rem;
        width: 0.875rem;
        border: 2px solid color-mix(in srgb, #4f8cff 25%, transparent);
        border-top-color: #4f8cff;
        border-radius: 9999px;
        animation: sw-initial-spin 0.7s linear infinite;
      }

      @keyframes sw-initial-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .sw-initial-spinner {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app. </noscript>
    <script>
      // Bldr inline boot recorder: bounded synchronous enqueue buffer for the
      // earliest startup marks. This script runs before any module and before
      // manifest lookup; it loads no TypeScript and touches no storage. The
      // BootReportStore module drains this buffer into IndexedDB once it
      // opens, and overflow past the bound is counted, never silent.
      ;(function () {
        var limit = 4096
        window.__swStartupMarks = window.__swStartupMarks || []
        window.__swStartupMarkOverflows = 0
        window.__swStartupMarkPush = function (mark) {
          if (window.__swStartupMarks.length >= limit) {
            window.__swStartupMarkOverflows += 1
            return
          }
          window.__swStartupMarks.push(mark)
        }
        window.__swStartupMarkPush({
          name: 'spacewave.startup.boot.started',
          label: 'boot.started',
          sequence: 1,
          detail: { source: 'browser' },
        })
      })()
    </script>
    <script type="importmap">
      {{ .ImportMap.String }}
    </script>
    <script type="module" src="{{ .EntrypointPath }}"></script>
    <div id="bldr-root" role="main">
      <div
        id="bldr-initial-loading-shell"
        class="sw-initial-shell"
        role="status"
        aria-label="Loading Spacewave"
      >
        <div class="sw-initial-card">
          <div class="sw-initial-logo" aria-hidden="true">
            <div class="sw-initial-logo-mark">S</div>
          </div>
          <h1 class="sw-initial-title">Spacewave</h1>
          <div class="sw-initial-spinner" aria-hidden="true"></div>
        </div>
      </div>
    </div>
  </body>
</html>
