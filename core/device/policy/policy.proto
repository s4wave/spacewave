syntax = "proto3";
package s4wave.device.policy;

import "github.com/s4wave/spacewave/sdk/device/device.proto";

option go_package = "github.com/s4wave/spacewave/core/device/policy;device_policy";

// DevicePolicy is the daemon-local policy that controls Device capabilities.
message DevicePolicy {
  // Revision increments on every policy mutation.
  uint64 revision = 1;
  // RemoteShell controls remote-shell OPEN authorization.
  RemoteShellPolicy remote_shell = 2;
  // CheckoutRoot declares locally available checkout roots.
  repeated CheckoutRootPolicy checkout_root = 3;
  // ForgeWorker declares the local Forge Worker capacity envelope. Absent
  // means this daemon exposes no Forge Worker execution capacity.
  ForgeWorkerPolicy forge_worker = 4;
}

// ForgeWorkerPolicy declares the capacity envelope of the local Forge Worker.
message ForgeWorkerPolicy {
  // WorkerObjectKey is the Forge Worker object key this daemon hosts.
  string worker_object_key = 1;
  // MilliCpu is the declared total CPU in milli-cores.
  uint64 milli_cpu = 2;
  // MemoryBytes is the declared total memory in bytes.
  uint64 memory_bytes = 3;
  // Backends lists the runtime backends the Worker supports.
  repeated string backends = 4;
}

// RemoteShellPolicy controls whether remote shell OPEN frames may start a PTY.
message RemoteShellPolicy {
  // Enabled allows remote shell OPEN frames when true.
  bool enabled = 1;
  // Detail is an operator-visible policy note.
  string detail = 2;
}

// CheckoutRootPolicy declares one local checkout root exposed by this Device.
message CheckoutRootPolicy {
  // Name is the stable checkout-root selector.
  string name = 1;
  // LocalPath is the daemon-local filesystem path.
  string local_path = 2;
  // Access is the read/write mode exposed by the Device.
  .s4wave.device.DeviceCheckoutRootAccess access = 3;
}
