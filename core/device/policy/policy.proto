syntax = "proto3";
package s4wave.device.policy;

option go_package = "github.com/s4wave/spacewave/core/device/policy;device_policy";

// DevicePolicy is the daemon-local policy that controls Device capabilities.
//
// It lives in the Device's state root and is edited only through that
// Device's CLI, so no Space writer can grant itself a capability here.
message DevicePolicy {
  // Revision increments on every policy mutation.
  uint64 revision = 1;
  // NodeTypeId is the allow list of Flowgraph node type IDs this Device runs.
  // A node whose type is absent from the list is rejected.
  repeated string node_type_id = 2;
  // LaunchApproval lists, per Space, the execution profiles this Device may
  // launch for that Space's work. A Space with no entry gets only the isolated
  // launcher and no additional child models.
  repeated LaunchApproval launch_approval = 3;
}

// LaunchApproval is the local operator's grant of execution profiles to one
// Space's work on this Device.
message LaunchApproval {
  // SpaceId is the Space whose work this approval covers.
  string space_id = 1;
  // HostExecution permits the ordinary host launcher, which runs work directly
  // on this Device with no process sandbox.
  bool host_execution = 2;
  // AllowedChildModels are the additional model selectors an agent launched
  // for this Space may grant its children.
  repeated string allowed_child_models = 3;
  // SecretPluginIds are the plugins this Device lets read, create and write
  // this Space's Secrets when the Space itself loads them. The core root
  // refuses those methods to every other plugin.
  repeated string secret_plugin_ids = 4;
}

// DevicePolicyService serves the Device policy to local clients of the daemon
// socket. It is registered only on that socket, never on a Space's Resource
// tree, so a plugin loaded from a Space cannot reach it.
service DevicePolicyService {
  // Reload rereads the policy file and wakes every watcher.
  rpc Reload(ReloadDevicePolicyRequest) returns (ReloadDevicePolicyResponse);
  // WatchDevicePolicy sends the current policy, then each changed policy.
  rpc WatchDevicePolicy(WatchDevicePolicyRequest) returns (stream DevicePolicy);
}

// ReloadDevicePolicyRequest requests a reload of the policy file.
message ReloadDevicePolicyRequest {}

// ReloadDevicePolicyResponse acknowledges a completed reload.
message ReloadDevicePolicyResponse {}

// WatchDevicePolicyRequest requests the policy stream.
message WatchDevicePolicyRequest {}
