syntax = "proto3";
package display.gstencoder;

option go_package = "github.com/s4wave/spacewave/core/display/gstencoder;gstencoder";

// Command controls the helper. Its stdout carries frametrack.FramePacket.
// Both pipes frame each protobuf with its little-endian uint32 byte count.
message Command {
  // RequestKeyframe asks the encoder for an IDR at the next input picture.
  bool request_keyframe = 1;
}
