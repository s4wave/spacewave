syntax = "proto3";
package s4wave.frametrack;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/s4wave/spacewave/core/frametrack;frametrack";

// Subscription is the viewer's first message on the track's control stream.
message Subscription {
  // SubscriptionId is the viewer-assigned identifier echoed by each group.
  string subscription_id = 1;
}

// Codec identifies the encoding of every frame in a group.
enum Codec {
  // CODEC_UNKNOWN indicates that the encoding was omitted.
  CODEC_UNKNOWN = 0;
  // CODEC_JPEG carries a complete JPEG image in every frame.
  CODEC_JPEG = 1;
  // CODEC_H264_AVC carries H.264 access units with length-prefixed NAL units.
  CODEC_H264_AVC = 2;
}

// GroupHeader is the first message on a reliable group stream.
message GroupHeader {
  // SubscriptionId identifies the control stream's subscription.
  string subscription_id = 1;
  // GroupSequence starts at one and increases with each group the sender opens.
  uint64 group_sequence = 2;
  // Codec identifies the encoding of the frames that follow.
  Codec codec = 3;
  // Width is the coded frame width in pixels.
  uint32 width = 4;
  // Height is the coded frame height in pixels.
  uint32 height = 5;
  // DecoderDescription is the AVCDecoderConfigurationRecord for H.264 AVC.
  // JPEG groups leave it empty.
  bytes decoder_description = 6;
}

// Frame carries one coded picture in the group's decode order.
message Frame {
  // CapturedAt is the source's capture time for this picture.
  .google.protobuf.Timestamp captured_at = 1;
  // Keyframe marks an independently decodable picture given the group header.
  bool keyframe = 2;
  // Data is the coded picture in the group's codec.
  bytes data = 3;
}

// Input is one event sent on an admitted display's subscription stream.
message Input {
  // Event is the pointer or key event in delivery order.
  oneof event {
    // Pointer reports the current pointer position and buttons.
    PointerInput pointer = 1;
    // Key reports a pressed or released key.
    KeyInput key = 2;
  }
}

// PointerInput describes a position and button state in the displayed picture.
message PointerInput {
  // X is the horizontal position, from the left (0) to the right (1).
  float x = 1;
  // Y is the vertical position, from the top (0) to the bottom (1).
  float y = 2;
  // Buttons is the set of pressed buttons, in the DOM PointerEvent bit order.
  uint32 buttons = 3;
}

// KeyInput describes one key transition.
message KeyInput {
  // Code identifies the physical key using KeyboardEvent.code.
  string code = 1;
  // Key identifies the logical key using KeyboardEvent.key.
  string key = 2;
  // Pressed is true for a key down and false for a key up.
  bool pressed = 3;
  // Repeat is true for an autorepeated key down.
  bool repeat = 4;
}

// FrameEvent relays an open subscription and its pictures to a viewer.
message FrameEvent {
  // State reports the accepted subscription or the next coded picture.
  oneof state {
    // Opened reports that the Device accepted the subscription.
    FrameTrackOpened opened = 1;
    // Frame carries one access unit in decode order.
    FramePacket frame = 2;
  }
}

// FrameTrackOpened acknowledges an admitted subscription on the control stream.
message FrameTrackOpened {
}

// FramePacket carries one coded picture from the current group.
message FramePacket {
  // Header describes the group on its opening keyframe. Deltas omit it.
  GroupHeader header = 1;
  // Frame carries the picture in group decode order.
  Frame frame = 2;
}
