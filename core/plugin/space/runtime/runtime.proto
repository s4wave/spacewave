syntax = "proto3";
package plugin.space.runtime;

import "github.com/s4wave/spacewave/core/plugin/space/config.proto";

// Config configures the shared plugin runtime of one Space.
// Contents mounts with equal configs share one runtime.
message Config {
  // Space configures the plugin/space controller inside the runtime.
  .plugin.space.Config space = 1;
  // AppPluginIds declares plugins supplied by this application on the parent bus.
  repeated string app_plugin_ids = 2;
}
