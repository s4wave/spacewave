\* Two stores sharing a budget of three bytes, three blocks, one worker
\* slot and two queued fills per store: the budget, not the queue, is what
\* refuses the third block across both stores.
CONSTANTS
  NStores = 2
  NBlocks = 3
  Slots = 1
  QueueMax = 2
  Budget = 3
SPECIFICATION Spec
INVARIANT TypeOK BudgetBound NoDuplicate QueueHasWorker Bounded NoFillAfterEnd
PROPERTY FillsLeave EndedStops
CHECK_DEADLOCK FALSE
