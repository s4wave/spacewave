\* Three commits, one dropped connection, one lost frame and one snapshot: enough for a gap,
\* an overflow of a two-entry run, and a change committed while the socket is
\* down.
CONSTANTS
  MaxHead = 3
  MaxRun = 2
  MaxSnaps = 1
  MaxDrops = 1
  MaxLosses = 1
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT TypeOK
INVARIANT Prefix
INVARIANT RunContiguous
INVARIANT Converged
INVARIANT TerminalKept
