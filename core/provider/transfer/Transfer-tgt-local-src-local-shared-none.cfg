\* One of sixteen configs that split the model by the target's and the
\* source's kind and by which Spaces the source holds as shared, all chosen
\* at Init and never changed. Each fixes one value of each, so the union of
\* the sixteen reachable sets equals that of the unsplit model, which sets
\* every constant to BOOLEAN. These check the invariants at MaxTouches 2;
\* the Transfer-live-* configs check Finishes.
SPECIFICATION Spec
CONSTANTS TgtCloud = {FALSE} SrcCloud = {FALSE} SharedA = {FALSE} SharedB = {FALSE} MaxTouches = 2
INVARIANT NoEditOverwritten CleanupAtHead NotMovedJustified NotMovedKeepsSource StateHeld ArrivingUntouched MembersKeepShared SharedNotCopied MigrateKeepsKey NewSpaceKept NoKeyMinted TargetChosen NoVolumeRecreated VolumeListed
