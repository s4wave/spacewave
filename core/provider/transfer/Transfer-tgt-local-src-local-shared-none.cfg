\* One of sixteen configs that split the model by the target's and the
\* source's kind and by which Spaces the source holds as shared, all chosen
\* at Init and never changed. Each fixes one value of each, so the union of
\* the sixteen reachable sets equals that of the unsplit model, which sets
\* every constant to BOOLEAN; no symmetry is assumed, since Finishes is a
\* liveness property.
SPECIFICATION Spec
CONSTANTS TgtCloud = {FALSE} SrcCloud = {FALSE} SharedA = {FALSE} SharedB = {FALSE}
INVARIANT NoEditOverwritten CleanupAtHead NotMovedJustified NotMovedKeepsSource StateHeld ArrivingUntouched MembersKeepShared SharedNotCopied MigrateKeepsKey
PROPERTY Finishes
