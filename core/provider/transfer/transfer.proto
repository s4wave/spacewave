syntax = "proto3";
package provider.transfer;

import "github.com/s4wave/spacewave/core/sobject/sobject.proto";

// TransferMode defines the type of transfer operation.
enum TransferMode {
  // TransferMode_UNKNOWN is the zero value.
  TransferMode_UNKNOWN = 0;
  // TransferMode_MERGE moves all spaces from source to target and deletes source.
  TransferMode_MERGE = 1;
  // TransferMode_MIGRATE moves all spaces between providers (cloud/local).
  TransferMode_MIGRATE = 2;
  // TransferMode_MIRROR copies spaces from source to target without deleting source.
  TransferMode_MIRROR = 3;
}

// TransferPhase defines the current phase of a transfer operation.
enum TransferPhase {
  // TransferPhase_IDLE is the initial state before transfer starts.
  TransferPhase_IDLE = 0;
  // TransferPhase_SCANNING enumerates source shared objects.
  TransferPhase_SCANNING = 1;
  // TransferPhase_COPYING_BLOCKS copies block data from source to target.
  TransferPhase_COPYING_BLOCKS = 2;
  // TransferPhase_COPYING_SO copies shared object state from source to target.
  TransferPhase_COPYING_SO = 3;
  // TransferPhase_CLEANUP removes source data after successful transfer.
  TransferPhase_CLEANUP = 4;
  // TransferPhase_COMPLETE indicates the transfer finished successfully.
  TransferPhase_COMPLETE = 5;
  // TransferPhase_FAILED indicates the transfer encountered an unrecoverable error.
  TransferPhase_FAILED = 6;
  // TransferPhase_NOT_MOVED marks a Space the transfer left where it is, for
  // the reason its state gives, and a transfer that finished with at least
  // one such Space. Such a transfer cleans up nothing.
  TransferPhase_NOT_MOVED = 7;
}

// SpaceTransferState tracks the transfer progress for a single shared object.
message SpaceTransferState {
  // SharedObjectId is the source shared object identifier.
  string shared_object_id = 1;
  // Phase is the current transfer phase for this space.
  TransferPhase phase = 2;
  // BlocksCopied is the number of blocks of the Space's World copied so far.
  // The copy walks the World's graph, so no total is known before it ends.
  uint64 blocks_copied = 3;
  // ErrorMessage contains the error if phase is FAILED.
  string error_message = 5;
  // Meta is the shared object metadata from the source.
  .sobject.SharedObjectMeta meta = 6;
  // NotMovedReason says why the Space was not moved, if phase is NOT_MOVED.
  string not_moved_reason = 7;
}

// TransferState tracks the overall transfer operation state.
message TransferState {
  // Mode is the transfer mode (merge, migrate, mirror).
  TransferMode mode = 1;
  // Phase is the overall transfer phase.
  TransferPhase phase = 2;
  // SourceSessionIndex is the source session index.
  uint32 source_session_index = 3;
  // TargetSessionIndex is the target session index.
  uint32 target_session_index = 4;
  // Spaces is the per-space transfer progress.
  repeated SpaceTransferState spaces = 5;
  // ErrorMessage contains the error if phase is FAILED.
  string error_message = 6;
}

// TransferCheckpoint records a transfer the person started, on its source,
// so the wizard resumes it after a restart. It records no progress: on every
// run the target's TransferOrigin of each Space decides what the run does.
message TransferCheckpoint {
  // State is the transfer state when the run started.
  TransferState state = 1;
  // SpaceIds is the selection the run was started with, empty for every
  // Space.
  repeated string space_ids = 2;
}

// TransferOrigin records, on the target, the source a transfer moved a Space
// from and the World it copied. The target stores it with the Space when the
// transfer lists it and replaces it when the transfer writes the Space's
// state, so a later transfer can tell a Space it moved, unchanged since, from
// any other Space the target holds.
message TransferOrigin {
  // SourceProviderId is the provider of the source account.
  string source_provider_id = 1;
  // SourceAccountId is the provider account the Space was moved from.
  string source_account_id = 2;
  // SourceHead is the SHA-256 of the encoded World the source replayed for
  // the copy, empty until the transfer writes the Space's state.
  bytes source_head = 3;
}
