\* One writer whose second operation builds on its first, so the stable point
\* follows a chain and an operation lands above a checkpoint.
CONSTANTS Writers = {w1}
          Joiner = j
          MaxOps = 2
          MinStable = 1
          CheckStale = TRUE
SPECIFICATION FairSpec
INVARIANT TypeOK Ordered CoveredOnce HeldClosed
PROPERTY Checkpoints
