syntax = "proto3";
package sobject;

import "github.com/s4wave/spacewave/net/peer/peer.proto";
import "github.com/s4wave/spacewave/core/provider/provider.proto";
import "github.com/s4wave/spacewave/db/block/transform/transform.proto";
import "google/protobuf/timestamp.proto";

// SharedObjectRef is a reference to a shared object managed by a provider.
message SharedObjectRef {
  // ProviderResourceRef is the reference to the resource on the provider.
  .provider.ProviderResourceRef provider_resource_ref = 1;

  // BlockStoreId is the identifier of the block store.
  // The block store must exist on the same provider + account id.
  string block_store_id = 2;
}

// SharedObjectList is the list of objects in the provider account.
message SharedObjectList {
  // SharedObjects is the list of shared objects.
  repeated SharedObjectListEntry shared_objects = 1;
}

// SharedObjectListEntry is an entry in the SharedObjectList.
message SharedObjectListEntry {
  // Ref is the reference to the shared object.
  SharedObjectRef ref = 1;
  // Meta is the metadata for the shared object.
  SharedObjectMeta meta = 2;
  // Source indicates how the shared object was acquired.
  // Known values: "created" (owner-created), "shared" (invite-received or org-enrolled).
  string source = 3;
}

// SharedObjectMeta is the contents of the provider_feature_meta field for a SharedObject.
message SharedObjectMeta {
  // BodyType is the type of object in the body of the shared object.
  // Known types: "space"
  string body_type = 1;
  // BodyMeta is additional metadata about the shared object body.
  bytes body_meta = 2;
  // AccountPrivate marks a shared object as private to one account and not
  // eligible for transfer, merge, or ownership-migration flows.
  bool account_private = 3;
}

// SharedObjectHealthStatus describes the lifecycle status of a SharedObject mount.
enum SharedObjectHealthStatus {
  // SHARED_OBJECT_HEALTH_STATUS_UNKNOWN is the zero / invalid value.
  SHARED_OBJECT_HEALTH_STATUS_UNKNOWN = 0;

  // SHARED_OBJECT_HEALTH_STATUS_LOADING indicates the object is still mounting.
  SHARED_OBJECT_HEALTH_STATUS_LOADING = 1;

  // SHARED_OBJECT_HEALTH_STATUS_READY indicates the object is mounted and usable.
  SHARED_OBJECT_HEALTH_STATUS_READY = 2;

  // SHARED_OBJECT_HEALTH_STATUS_DEGRADED indicates the object is usable with a known problem.
  SHARED_OBJECT_HEALTH_STATUS_DEGRADED = 3;

  // SHARED_OBJECT_HEALTH_STATUS_CLOSED indicates the mount cannot proceed without remediation.
  SHARED_OBJECT_HEALTH_STATUS_CLOSED = 4;
}

// SharedObjectHealthLayer identifies where the current issue is happening.
enum SharedObjectHealthLayer {
  // SHARED_OBJECT_HEALTH_LAYER_UNKNOWN is the zero / invalid value.
  SHARED_OBJECT_HEALTH_LAYER_UNKNOWN = 0;

  // SHARED_OBJECT_HEALTH_LAYER_SHARED_OBJECT indicates the failure happened while mounting or syncing the SharedObject itself.
  SHARED_OBJECT_HEALTH_LAYER_SHARED_OBJECT = 1;

  // SHARED_OBJECT_HEALTH_LAYER_BODY indicates the failure happened while mounting or decoding the body.
  SHARED_OBJECT_HEALTH_LAYER_BODY = 2;
}

// SharedObjectHealthCommonReason identifies a stable cross-provider reason when one is known.
enum SharedObjectHealthCommonReason {
  // SHARED_OBJECT_HEALTH_COMMON_REASON_UNKNOWN is the zero / invalid value.
  SHARED_OBJECT_HEALTH_COMMON_REASON_UNKNOWN = 0;

  // SHARED_OBJECT_HEALTH_COMMON_REASON_NOT_FOUND indicates the SharedObject or required body data could not be found.
  SHARED_OBJECT_HEALTH_COMMON_REASON_NOT_FOUND = 1;

  // SHARED_OBJECT_HEALTH_COMMON_REASON_ACCESS_REVOKED indicates access to the SharedObject was removed.
  SHARED_OBJECT_HEALTH_COMMON_REASON_ACCESS_REVOKED = 2;

  // SHARED_OBJECT_HEALTH_COMMON_REASON_INITIAL_STATE_REJECTED indicates the initial SharedObject state failed verification.
  SHARED_OBJECT_HEALTH_COMMON_REASON_INITIAL_STATE_REJECTED = 3;

  // SHARED_OBJECT_HEALTH_COMMON_REASON_BLOCK_NOT_FOUND indicates a required block is missing.
  SHARED_OBJECT_HEALTH_COMMON_REASON_BLOCK_NOT_FOUND = 4;

  // SHARED_OBJECT_HEALTH_COMMON_REASON_TRANSFORM_CONFIG_DECODE_FAILED indicates the transform configuration could not be decoded.
  SHARED_OBJECT_HEALTH_COMMON_REASON_TRANSFORM_CONFIG_DECODE_FAILED = 5;

  // SHARED_OBJECT_HEALTH_COMMON_REASON_BODY_CONFIG_DECODE_FAILED indicates the body configuration could not be decoded.
  SHARED_OBJECT_HEALTH_COMMON_REASON_BODY_CONFIG_DECODE_FAILED = 6;
}

// SharedObjectHealthRemediationHint suggests a next step for the caller or UI.
enum SharedObjectHealthRemediationHint {
  // SHARED_OBJECT_HEALTH_REMEDIATION_HINT_UNKNOWN is the zero / invalid value.
  SHARED_OBJECT_HEALTH_REMEDIATION_HINT_UNKNOWN = 0;

  // SHARED_OBJECT_HEALTH_REMEDIATION_HINT_NONE indicates no explicit action is suggested.
  SHARED_OBJECT_HEALTH_REMEDIATION_HINT_NONE = 1;

  // SHARED_OBJECT_HEALTH_REMEDIATION_HINT_RETRY indicates retrying the operation may succeed.
  SHARED_OBJECT_HEALTH_REMEDIATION_HINT_RETRY = 2;

  // SHARED_OBJECT_HEALTH_REMEDIATION_HINT_REQUEST_ACCESS indicates the user should request access again.
  SHARED_OBJECT_HEALTH_REMEDIATION_HINT_REQUEST_ACCESS = 3;

  // SHARED_OBJECT_HEALTH_REMEDIATION_HINT_CONTACT_OWNER indicates the user should contact the owner or operator.
  SHARED_OBJECT_HEALTH_REMEDIATION_HINT_CONTACT_OWNER = 4;

  // SHARED_OBJECT_HEALTH_REMEDIATION_HINT_REPAIR_SOURCE_DATA indicates the backing SharedObject or body data must be repaired.
  SHARED_OBJECT_HEALTH_REMEDIATION_HINT_REPAIR_SOURCE_DATA = 5;
}

// SharedObjectHealth describes the current lifecycle and failure state of a SharedObject.
// This payload is shared across local, spacewave, and CDN providers.
message SharedObjectHealth {
  // Status is the lifecycle status for the SharedObject.
  SharedObjectHealthStatus status = 1;

  // Layer identifies whether the issue is on the SharedObject or body layer.
  SharedObjectHealthLayer layer = 2;

  // CommonReason identifies a stable cross-provider reason when known.
  SharedObjectHealthCommonReason common_reason = 3;

  // RemediationHint suggests the next action to present to the user.
  SharedObjectHealthRemediationHint remediation_hint = 4;

  // Error preserves provider-specific or body-specific detail when needed.
  string error = 5;

  // Metadata reserves an opaque slot for future provider-specific or body-specific remediation data.
  // Empty in v1. Callers must treat the contents as opaque.
  bytes metadata = 6;
}

// SOParticipantRole defines the general role of a shared object participant.
// In order of least permissive to most permissive.
enum SOParticipantRole {
  // SOParticipantRole_UNKNOWN is the zero / invalid / unknown type.
  SOParticipantRole_UNKNOWN = 0;

  // SOParticipantRole_READER can read the value of the shared object only.
  SOParticipantRole_READER = 1;

  // SOParticipantRole_WRITER can submit transactions to apply.
  SOParticipantRole_WRITER = 2;

  // SOParticipantRole_VALIDATOR can validate and apply transactions.
  SOParticipantRole_VALIDATOR = 3;

  // SOParticipantRole_OWNER can modify config and manage participants.
  SOParticipantRole_OWNER = 4;
}

// SOConsensusMode defines the consensus mechanism for validating root state updates.
enum SOConsensusMode {
  // SO_CONSENSUS_MODE_SINGLE_VALIDATOR requires at least one valid validator signature.
  // This is the default mode and matches the existing behavior.
  SO_CONSENSUS_MODE_SINGLE_VALIDATOR = 0;
  // Reserved for future consensus modes.
  // SO_CONSENSUS_MODE_OWNER_QUORUM = 1;
  // SO_CONSENSUS_MODE_SNOWMAN = 2;
}

// SharedObjectConfig configures the SharedObject.
message SharedObjectConfig {
  // Participants is the list of shared object participants.
  repeated SOParticipantConfig participants = 1;
  // ConsensusMode is the consensus mechanism for validating root state updates.
  // Default (zero value) is SINGLE_VALIDATOR.
  SOConsensusMode consensus_mode = 2;

  // ConfigChainHash is the hash of the latest SOConfigChange entry.
  bytes config_chain_hash = 10;
  // ConfigChainSeqno is the sequence number of the latest SOConfigChange entry.
  // The next entry must have config_seqno == config_chain_seqno + 1.
  // Zero means no config changes have been applied yet (genesis state).
  uint64 config_chain_seqno = 11;
}

// SOConfigChangeType describes the kind of mutation in a config chain entry.
enum SOConfigChangeType {
  // SO_CONFIG_CHANGE_TYPE_UNKNOWN is the zero value.
  SO_CONFIG_CHANGE_TYPE_UNKNOWN = 0;
  // SO_CONFIG_CHANGE_TYPE_GENESIS is the initial config chain entry.
  SO_CONFIG_CHANGE_TYPE_GENESIS = 1;
  // SO_CONFIG_CHANGE_TYPE_ADD_PARTICIPANT adds a participant to the config.
  SO_CONFIG_CHANGE_TYPE_ADD_PARTICIPANT = 2;
  // SO_CONFIG_CHANGE_TYPE_REMOVE_PARTICIPANT removes a participant from the config.
  SO_CONFIG_CHANGE_TYPE_REMOVE_PARTICIPANT = 3;
  // SO_CONFIG_CHANGE_TYPE_ADD_INVITE creates a new invite.
  SO_CONFIG_CHANGE_TYPE_ADD_INVITE = 4;
  // SO_CONFIG_CHANGE_TYPE_REVOKE_INVITE revokes an existing invite.
  SO_CONFIG_CHANGE_TYPE_REVOKE_INVITE = 5;
  // SO_CONFIG_CHANGE_TYPE_INCREMENT_INVITE_USES records an invite usage.
  SO_CONFIG_CHANGE_TYPE_INCREMENT_INVITE_USES = 6;
  // SO_CONFIG_CHANGE_TYPE_SELF_ENROLL_PEER lets a same-entity session add itself.
  SO_CONFIG_CHANGE_TYPE_SELF_ENROLL_PEER = 7;
}

// SORevocationReason describes why a participant was removed.
enum SORevocationReason {
  // SO_REVOCATION_REASON_UNKNOWN is the zero value.
  SO_REVOCATION_REASON_UNKNOWN = 0;
  // SO_REVOCATION_REASON_SESSION_REVOKED indicates the participant's session was revoked.
  SO_REVOCATION_REASON_SESSION_REVOKED = 1;
  // SO_REVOCATION_REASON_ORG_REMOVED indicates the participant was removed from the org.
  SO_REVOCATION_REASON_ORG_REMOVED = 2;
  // SO_REVOCATION_REASON_OWNER_REMOVED indicates the owner manually removed the participant.
  SO_REVOCATION_REASON_OWNER_REMOVED = 3;
  // SO_REVOCATION_REASON_INVITE_REVOKED indicates the participant's invite was revoked.
  SO_REVOCATION_REASON_INVITE_REVOKED = 4;
}

// SORevocationInfo contains metadata about why a participant was removed.
message SORevocationInfo {
  // Reason is the reason for the revocation.
  SORevocationReason reason = 1;
  // Timestamp is when the revocation occurred.
  .google.protobuf.Timestamp timestamp = 2;
  // Nonce is a unique value to prevent replay of revocation entries.
  uint64 nonce = 3;
}

// SOConfigChange represents a signed config change in the config chain.
message SOConfigChange {
  // ConfigSeqno is the sequence number of this config change.
  uint64 config_seqno = 1;
  // Config is the new config after this change.
  SharedObjectConfig config = 2;
  // Deprecated: was string change_type. Use change_type (field 7) instead.
  reserved 3;
  // SignedBy is the peer_id of the OWNER who signed this change.
  bytes signed_by = 4;
  // Signature is the signature over the serialized SOConfigChange (without this field).
  .peer.Signature signature = 5;
  // PreviousHash is the hash of the previous SOConfigChange entry in the chain.
  bytes previous_hash = 6;
  // ChangeType describes the kind of mutation in this config chain entry.
  SOConfigChangeType change_type = 7;
  // RevocationInfo contains metadata about why a participant was removed.
  // Only populated when change_type is REMOVE_PARTICIPANT.
  SORevocationInfo revocation_info = 8;
}

// SOParticipantConfig contains a listing of an entity associated with a shared object.
// Each entity may only appear one time in the list.
message SOParticipantConfig {
  // PeerId is the string representation of this participant's peer id.
  string peer_id = 1;

  // Role is the general role of the participant.
  //
  // - READER: can read the value of the shared object only.
  // - WRITER: can submit transactions to apply.
  // - VALIDATOR: can validate and apply transactions.
  SOParticipantRole role = 2;

  // EntityId is the account ID of the entity that owns this participant's session.
  // Set when an owner adds a cloud participant. Empty for local-only participants.
  string entity_id = 3;
}

// SORoot is the signed root state on a SharedObject.
message SORoot {
  // Inner is the encoded and encrypted SORootInner.
  bytes inner = 1;

  // InnerSeqno is the sequence number of the SORootInner.
  // Must match inner.seqno.
  uint64 inner_seqno = 2;

  // AccountNonces contains the current nonce for each account.
  // The accounts are sorted lexicographically by peer_id.
  repeated SOAccountNonce account_nonces = 3;

  // ValidatorSignatures contains the set of signatures of []byte(inner + account_nonces).
  // The signature public key must match a peer id of a validator.
  repeated .peer.Signature validator_signatures = 4;
}

// SOAccountNonce contains the current nonce for an account.
// The accounts are sorted lexicographically by peer_id.
message SOAccountNonce {
  // PeerId is the identifier of the account.
  string peer_id = 1;

  // Nonce is the current nonce for the account.
  uint64 nonce = 2;
}

// SORootInner is the inner signed message on SORoot.
message SORootInner {
  // Seqno is the sequence number of the root state.
  uint64 seqno = 1;

  // StateData is the root state data for the shared object.
  bytes state_data = 2;
}

// SOOperation represents an individual operation submitted by a participant.
message SOOperation {
  // Inner is the encoded SOOperationInner object.
  bytes inner = 1;

  // Signature is the signature of inner.
  // The signature public key must match the participant's peer_id.
  .peer.Signature signature = 2;
}

// SOOperationInner is the inner message of SOOperation.
message SOOperationInner {
  // PeerId is the identifier of the participant submitting the operation.
  string peer_id = 1;

  // LocalId is the locally-assigned ulid for the operation.
  // Must be a valid ulid.
  // Must be lower-case.
  string local_id = 2;

  // Nonce is the nonce for the operation; must increment from the previous.
  uint64 nonce = 3;

  // OpData is the operation data, transformed with the same transform config as root.
  bytes op_data = 4;
}

// SOOperationRef is a reference to an operation that was queued.
message SOOperationRef {
  // PeerId is the identifier of the participant submitting the operation.
  string peer_id = 1;

  // Nonce is the nonce for the operation.
  uint64 nonce = 2;
}

// SOOperationResult is the result of applying an operation.
message SOOperationResult {
  // OpRef is the operation reference.
  SOOperationRef op_ref = 1;
  // Body is the body of the result.
  oneof body {
    // Success indicates the op was successful.
    bool success = 2;
    // ErrorDetails contains the rejection error details.
    .sobject.SOOperationRejectionErrorDetails error_details = 3;
  }
}

// SOOperationRejection represents the rejection of an operation by a validator.
// This tracks rejected operations until the participant acknowledges them.
message SOOperationRejection {
  // Inner is the encoded SOOperationRejectionInner object.
  bytes inner = 1;

  // Signature is the signature of inner by the validator.
  // The pub key must match the peer id of a valid validator.
  .peer.Signature signature = 2;
}

// SOOperationRejectionInner is the inner message of SOOperationRejection.
message SOOperationRejectionInner {
  // PeerId is the identifier of the participant that submitted the operation.
  string peer_id = 1;

  // OpNonce is the nonce of the operation for the peer.
  uint64 op_nonce = 2;

  // LocalId is the locally-assigned ulid for the operation.
  // Must be a valid ulid.
  // Must be lower-case.
  string local_id = 3;

  // ErrorDetails contains details about the rejection encoded to the peer id.
  // May be empty if there are no details.
  bytes error_details = 4;
}

// SOOperationRejectionErrorDetails contains error details.
message SOOperationRejectionErrorDetails {
  // ErrorMsg is the error message.
  string error_msg = 1;
}

// SOGrant is a grant of a transform configuration to a peer.
message SOGrant {
  // PeerId is the peer id of the target of the grant.
  // Must match a peer id of a participant on the shared object.
  string peer_id = 1;

  // InnerData is the inner SOGrantInner encrypted to the peer id.
  bytes inner_data = 2;

  // Signature is the signature of inner_data by the peer that issued the grant.
  .peer.Signature signature = 3;
}

// SOGrantInner is the inner encrypted body of the SOGrant.
message SOGrantInner {
  // TransformConf is the transform config within the grant.
  // Usually contains a crypto key.
  .block.transform.Config transform_conf = 1;
}

// SOEntityRecoveryEnvelope stores recovery material for one entity on an SO.
message SOEntityRecoveryEnvelope {
  // EntityId is the stable entity identifier the envelope is for.
  string entity_id = 1;
  // KeyEpoch is the current readable key epoch for this envelope.
  uint64 key_epoch = 2;
  // ConfigChainSeqno is the config-chain seqno the envelope matches.
  uint64 config_chain_seqno = 3;
  // ConfigChainHash is the config-chain hash the envelope matches.
  bytes config_chain_hash = 4;
  // EnvelopeData is a bifrost/envelope payload encrypted to entity keypairs.
  bytes envelope_data = 5;
}

// SOEntityRecoveryMaterial is the decrypted recovery material for one entity.
message SOEntityRecoveryMaterial {
  // EntityId is the stable entity identifier this material is for.
  string entity_id = 1;
  // Role is the maximum role the entity may self-rejoin with.
  SOParticipantRole role = 2;
  // GrantInner is the current grant material used to mint a peer grant.
  SOGrantInner grant_inner = 3;
}

// SOInvite is a pending invite on a SharedObject.
// Stored in plaintext on SOState (not in encrypted SORoot).
message SOInvite {
  // InviteId is the unique identifier for this invite.
  string invite_id = 1;
  // TokenHash is the SHA256 hash of the invite token.
  // The raw token is never stored on-chain.
  bytes token_hash = 2;
  // Role is the role granted to the invitee on acceptance.
  SOParticipantRole role = 3;
  // TargetPeerId is the optional peer ID of the intended invitee.
  // Empty means open invite (anyone with the token can join).
  string target_peer_id = 4;
  // MaxUses is the maximum number of times the invite can be used.
  // 0 means unlimited.
  uint32 max_uses = 5;
  // Uses is the current number of times the invite has been used.
  uint32 uses = 6;
  // ExpiresAt is the time after which the invite is invalid.
  // Unset means no expiry.
  .google.protobuf.Timestamp expires_at = 7;
  // Revoked indicates the invite has been revoked by the owner.
  bool revoked = 8;
  // TargetAccountId is the optional provider account id required to submit a
  // targeted invitation proof for this invite. Empty means bearer invite.
  string target_account_id = 9;
}

// SOState contains the state of the shared object.
// Some implementations may drop or obscure some fields for some peers.
message SOState {
  // Config is the shared object config.
  SharedObjectConfig config = 1;

  // Root is the current shared object root state.
  SORoot root = 2;

  // RootGrants are grants to each of the participants.
  // Each grant contains the transform config for the SORoot.
  // Each grant must be signed by one of the validators.
  // Each grant must be signed with the correct shared object id.
  repeated SOGrant root_grants = 3;

  // Ops are the list of pending operations.
  // Validators can choose how many ops to apply.
  // Each op must have a unique (peer_id, nonce) pair.
  repeated SOOperation ops = 4;

  // OpRejections contains the rejections of operations by validators for each peer.
  // These are kept until the participant acknowledges them.
  // The list is sorted by peer_id.
  repeated SOPeerOpRejections op_rejections = 5;

  // QueuedAccountNonces tracks the highest queued nonce for each account.
  // These nonces are not signed and are only used for local state tracking.
  // The accounts are sorted lexicographically by peer_id.
  repeated SOAccountNonce queued_account_nonces = 6;

  // Invites is the list of pending invites on this shared object.
  // Stored in plaintext so both providers and cloud can verify invite validity.
  repeated SOInvite invites = 7;
}

// SOPeerOpRejections contains all rejections for a specific peer.
message SOPeerOpRejections {
  // PeerId is the identifier of the participant.
  string peer_id = 1;

  // Rejections is the list of rejections for this peer.
  repeated SOOperationRejection rejections = 2;
}

// SOClearOperationResult represents a request to clear a rejected operation result.
message SOClearOperationResult {
  // Inner is the encoded SOClearOperationResultInner object.
  bytes inner = 1;

  // Signature is the signature of inner by the operation submitter.
  // The pub key must match the peer id that submitted the original operation.
  .peer.Signature signature = 2;
}

// SOClearOperationResultInner is the inner message of SOClearOperationResult.
message SOClearOperationResultInner {
  // PeerId is the identifier of the participant that submitted the operation.
  string peer_id = 1;

  // LocalId is the locally-assigned ulid for the operation.
  // Must be a valid ulid.
  // Must be lower-case.
  string local_id = 2;
}

// SOKeyEpoch represents a key epoch with grants for that period.
message SOKeyEpoch {
  // Epoch is the epoch number (0-based, increments on rotation).
  uint64 epoch = 1;
  // SeqnoStart is the first root seqno this key covers.
  uint64 seqno_start = 2;
  // SeqnoEnd is the last root seqno this key covers (0 = current/open).
  uint64 seqno_end = 3;
  // Grants are the encrypted transform key grants for this epoch.
  repeated SOGrant grants = 4;
}

// SOConfigChainResponse is returned by GET /sobject/{id}/config-chain.
message SOConfigChainResponse {
  // ConfigChanges is the full config change chain from genesis.
  repeated SOConfigChange config_changes = 1;
  // KeyEpochs are the key epochs with grants for each period.
  repeated SOKeyEpoch key_epochs = 2;
}

// QueuedSOOperation is a queued SOOperation which does not yet have an nonce.
message QueuedSOOperation {
  // LocalId is the local operation id, must be a valid ulid.
  string local_id = 1;

  // OpData is the operation data, not transformed.
  bytes op_data = 2;
}

// SOInviteMessage is a signed invite distributed out-of-band to an invitee.
// The raw token is included (unlike SOInvite which stores only the hash).
message SOInviteMessage {
  // InviteId is the unique identifier for this invite.
  string invite_id = 1;
  // SharedObjectId is the ID of the shared object being shared.
  string shared_object_id = 2;
  // OwnerPeerId is the peer ID of the invite creator (b58).
  string owner_peer_id = 3;
  // ProviderId is the provider to use for signaling (not a raw URL).
  string provider_id = 4;
  // Token is the raw invite token. The SHA256 hash is stored on-chain.
  bytes token = 5;
  // Role is the role granted to the invitee on acceptance.
  SOParticipantRole role = 6;
  // TargetPeerId is the optional peer ID of the intended invitee (b58).
  // Empty means open invite.
  string target_peer_id = 7;
  // ExpiresAt is the time after which the invite is invalid.
  // Unset means no expiry.
  .google.protobuf.Timestamp expires_at = 8;
  // MaxUses is the maximum number of times the invite can be used.
  // 0 means unlimited.
  uint32 max_uses = 9;
  // Signature is the owner's signature over this message (without this field).
  .peer.Signature signature = 10;
}

// SOJoinResponse is a signed response from an invitee requesting to join.
message SOJoinResponse {
  // InviteId is the invite being accepted.
  string invite_id = 1;
  // ResponderPeerId is the peer ID of the responder (b58).
  string responder_peer_id = 2;
  // ResponderPubkey is the DER-encoded public key of the responder.
  bytes responder_pubkey = 3;
  // Signature is the responder's signature over this message (without this field).
  .peer.Signature signature = 4;
}
// SOJournalRecordKind identifies the durable event in a mutation journal.
enum SOJournalRecordKind {
  SO_JOURNAL_RECORD_KIND_UNSPECIFIED = 0;
  SO_JOURNAL_RECORD_KIND_INTENT = 1;
  SO_JOURNAL_RECORD_KIND_SIGNED_ENVELOPE = 2;
  SO_JOURNAL_RECORD_KIND_SENT = 3;
  SO_JOURNAL_RECORD_KIND_RECEIPT = 4;
  SO_JOURNAL_RECORD_KIND_ACKNOWLEDGEMENT = 5;
  SO_JOURNAL_RECORD_KIND_BODY_PROJECTION = 6;
  SO_JOURNAL_RECORD_KIND_STALE_TRANSFORM_EPOCH = 7;
  SO_JOURNAL_RECORD_KIND_RECOVERY_BLOCKED = 8;
  SO_JOURNAL_RECORD_KIND_LINEAGE_RECOVERY_BLOCKED = 9;
  SO_JOURNAL_RECORD_KIND_RECEIPT_LOOKUP = 10;
  SO_JOURNAL_RECORD_KIND_RESEND_AUTHORIZED = 11;
}

// SOJournalAttemptState identifies the attempt lifecycle state.
enum SOJournalAttemptState {
  SO_JOURNAL_ATTEMPT_STATE_UNSPECIFIED = 0;
  SO_JOURNAL_ATTEMPT_STATE_INTENT_DURABLE = 1;
  SO_JOURNAL_ATTEMPT_STATE_ENVELOPE_DURABLE = 2;
  SO_JOURNAL_ATTEMPT_STATE_SENT = 3;
  SO_JOURNAL_ATTEMPT_STATE_RECEIPT_DURABLE = 4;
  SO_JOURNAL_ATTEMPT_STATE_STALE_TRANSFORM_EPOCH = 5;
  SO_JOURNAL_ATTEMPT_STATE_RECOVERY_BLOCKED = 6;
}

// SOJournalOutcome identifies the authenticated terminal result of an attempt.
enum SOJournalOutcome {
  SO_JOURNAL_OUTCOME_UNSPECIFIED = 0;
  SO_JOURNAL_OUTCOME_ACCEPTED = 1;
  SO_JOURNAL_OUTCOME_REJECTED = 2;
}


// SOJournalReadiness identifies whether the body owner can supply dependencies.
enum SOJournalReadiness {
  SO_JOURNAL_READINESS_UNSPECIFIED = 0;
  SO_JOURNAL_READINESS_READY = 1;
  SO_JOURNAL_READINESS_MISSING = 2;
  SO_JOURNAL_READINESS_CORRUPT = 3;
  SO_JOURNAL_READINESS_OBSOLETE = 4;
}

// SOJournalRecoveryReason identifies a typed recovery stop.
enum SOJournalRecoveryReason {
  SO_JOURNAL_RECOVERY_REASON_UNSPECIFIED = 0;
  SO_JOURNAL_RECOVERY_REASON_STALE_TRANSFORM_EPOCH = 1;
  SO_JOURNAL_RECOVERY_REASON_KEY_UNAVAILABLE = 2;
  SO_JOURNAL_RECOVERY_REASON_AUTHORITY_FAILURE = 3;
  SO_JOURNAL_RECOVERY_REASON_BODY_MISSING = 4;
  SO_JOURNAL_RECOVERY_REASON_BODY_CORRUPT = 5;
  SO_JOURNAL_RECOVERY_REASON_BODY_OBSOLETE = 6;
}

// SOMutationKey identifies one immutable exact participant attempt.
message SOMutationKey {
  // OriginScopeId is the stable opaque account/store scope identifier.
  bytes origin_scope_id = 1;
  // SharedObjectId is the object identity within the origin scope.
  string shared_object_id = 2;
  // ParticipantPeerId is the submitting participant identity.
  string participant_peer_id = 3;
  // LocalId is allocated once for this exact attempt.
  string local_id = 4;
}

// SOJournalLineage links an immutable attempt to an optional predecessor.
message SOJournalLineage {
  // RootKey is the exact key carried by this lineage record.
  SOMutationKey root_key = 1;
  // Supersedes links a changed attempt to its predecessor.
  SOMutationKey supersedes = 2;
}

// SOJournalVersionTuple carries local and remote observations needed for replay.
message SOJournalVersionTuple {
  // LocalVersion is the local journal version at preparation.
  uint64 local_version = 1;
  // RemoteVersion is the authoritative remote version observed at preparation.
  uint64 remote_version = 2;
  // TransformEpoch is the verified transform epoch used by the envelope.
  uint64 transform_epoch = 3;
  // ConfigChainDigest identifies the verified configuration chain.
  bytes config_chain_digest = 4;
}

// SOJournalIntent is the canonical body-neutral operation before signing.
message SOJournalIntent {
  // Key identifies the exact operation attempt.
  SOMutationKey key = 1;
  // Lineage records the immutable predecessor relation.
  SOJournalLineage lineage = 2;
  // Version records the observations used to construct the operation.
  SOJournalVersionTuple version = 3;
  // CanonicalOperation contains operation input without body-specific metadata.
  bytes canonical_operation = 4;
}

// SOJournalEncryptedPayload contains authenticated ciphertext and its nonce.
message SOJournalEncryptedPayload {
  // Nonce is unique within the derived journal key domain.
  bytes nonce = 1;
  // Ciphertext contains the encrypted staged payload and authentication tag.
  bytes ciphertext = 2;
}

// SOJournalLookup records one serialized exact-key receipt lookup.
message SOJournalLookup {
  // Key identifies the exact lookup attempt.
  SOMutationKey key = 1;
  // State is the authoritative lookup result.
  SOReceiptState state = 2;
  // Receipt carries terminal evidence when state is accepted or rejected.
  SOJournalReceipt receipt = 3;
  // Response contains the opaque authenticated lookup response bytes.
  bytes response = 4;
  // ResponseDigest binds the retained response bytes.
  bytes response_digest = 5;
  // ConfigChainDigest identifies the verified lookup configuration.
  bytes config_chain_digest = 6;
}

// SOJournalReceipt records terminal evidence without making projection implicit.
message SOJournalReceipt {
  // Key identifies the exact terminal attempt.
  SOMutationKey key = 1;
  // EnvelopeDigest binds the receipt to the immutable signed envelope.
  bytes envelope_digest = 2;
  // Outcome is the authenticated terminal result.
  SOJournalOutcome outcome = 3;
  // TerminalReceipt contains the verified signed remote receipt.
  bytes terminal_receipt = 4;
  // TerminalReceiptDigest identifies the durable receipt bytes.
  bytes terminal_receipt_digest = 5;
  // AuthoritativeRootSeqno is the root sequence named by the receipt.
  uint64 authoritative_root_seqno = 6;
  // AuthoritativeRootDigest is the root identity named by the receipt.
  bytes authoritative_root_digest = 7;
  // ConfigChainDigest identifies the verified historical configuration.
  bytes config_chain_digest = 8;
  // TerminalUnixMillis is the remote terminal timestamp.
  uint64 terminal_unix_millis = 9;
  // Supersedes links this receipt to a predecessor when applicable.
  SOMutationKey supersedes = 10;
}

// SOJournalAcknowledgement records remote receipt acknowledgement.
message SOJournalAcknowledgement {
  // Key identifies the exact acknowledged attempt.
  SOMutationKey key = 1;
  // ReceiptDigest binds acknowledgement to one terminal receipt.
  bytes receipt_digest = 2;
  // AcknowledgedUnixMillis records when acknowledgement became durable.
  uint64 acknowledged_unix_millis = 3;
}

// SOJournalProjection records the body's exact authoritative-root observation.
message SOJournalProjection {
  // Key identifies the projected attempt.
  SOMutationKey key = 1;
  // ReceiptDigest binds projection to the terminal receipt.
  bytes receipt_digest = 2;
  // AuthoritativeRootSeqno is the exact root sequence projected by the body.
  uint64 authoritative_root_seqno = 3;
  // AuthoritativeRootDigest is the exact root identity projected by the body.
  bytes authoritative_root_digest = 4;
}

// SOJournalRecord is the generated body-neutral durable journal payload.
message SOJournalRecord {
  // FormatVersion identifies the journal payload schema.
  uint32 format_version = 1;
  // Sequence is the strictly increasing journal record sequence.
  uint64 sequence = 2;
  // Kind identifies which durable transition this record represents.
  SOJournalRecordKind kind = 3;
  // Key is the immutable exact mutation identity.
  SOMutationKey key = 4;
  // Lineage carries the immutable supersession relation.
  SOJournalLineage lineage = 5;
  // Version carries local/remote and transform observations.
  SOJournalVersionTuple version = 6;
  // Intent is encrypted canonical intent for an intent record.
  SOJournalEncryptedPayload intent = 7;
  // Envelope is encrypted immutable signed bytes for an envelope record.
  SOJournalEncryptedPayload envelope = 8;
  // Receipt is terminal evidence for a receipt record.
  SOJournalReceipt receipt = 9;
  // Acknowledgement is remote receipt acknowledgement.
  SOJournalAcknowledgement acknowledgement = 10;
  // Projection is the body owner's exact-root observation.
  SOJournalProjection projection = 11;
  // Readiness is the body-owned preparation result.
  SOJournalReadiness readiness = 12;
  // RecoveryReason carries a typed recovery stop.
  SOJournalRecoveryReason recovery_reason = 13;
  // AttemptState records the legal lifecycle state after this transition.
  SOJournalAttemptState attempt_state = 14;
  // EnvelopeDigest identifies the immutable signed-envelope plaintext.
  bytes envelope_digest = 15;
  // Lookup is the serialized exact-key receipt observation.
  SOJournalLookup lookup = 16;
}

// SOJournalCheckpointAttempt is the bounded reducer state for one exact key.
message SOJournalCheckpointAttempt {
  // Key identifies the exact checkpointed mutation attempt.
  SOMutationKey key = 1;
  // Lineage carries the immutable supersession relation.
  SOJournalLineage lineage = 2;
  // Version carries local/remote and transform observations.
  SOJournalVersionTuple version = 3;
  // State is the legal lifecycle state at checkpoint publication.
  SOJournalAttemptState state = 4;
  // Readiness records body-owned preparation status.
  SOJournalReadiness readiness = 5;
  // Intent is the retained encrypted canonical operation.
  SOJournalEncryptedPayload intent = 6;
  // Envelope is the retained encrypted immutable signed bytes.
  SOJournalEncryptedPayload envelope = 7;
  // EnvelopeDigest binds the retained envelope plaintext.
  bytes envelope_digest = 8;
  // Receipt is terminal remote evidence kept separate from projection.
  SOJournalReceipt receipt = 9;
  // Acknowledgement records remote acknowledgement of the receipt.
  SOJournalAcknowledgement acknowledgement = 10;
  // Projection records the body's exact authoritative-root observation.
  SOJournalProjection projection = 11;
  // Lookup records the retained exact-key receipt lookup.
  SOJournalLookup lookup = 12;
  // SendAttempted records that transport crossed the durable send boundary.
  bool send_attempted = 13;
  // ResendAuthorized records authoritative no-record resend permission.
  bool resend_authorized = 14;
  // LineageRecoveryBlocked records that successor recovery is blocked.
  bool lineage_recovery_blocked = 15;
  // IntentSequence is the exact journal sequence used by the retained intent ciphertext.
  uint64 intent_sequence = 16;
  // EnvelopeSequence is the exact journal sequence used by the retained envelope ciphertext.
  uint64 envelope_sequence = 17;
  // CheckpointEligible is the derived receipt-plus-projection eligibility bit.
  bool checkpoint_eligible = 18;
}

// SOJournalCheckpoint is a deterministic compact reducer snapshot.
message SOJournalCheckpoint {
  // JournalIdentity is the stable identity of the journal storage.
  bytes journal_identity = 1;
  // Generation identifies this compact snapshot publication.
  uint64 generation = 2;
  // NextSequence is the first sequence expected in the append tail.
  uint64 next_sequence = 3;
  // Attempts contains one bounded state snapshot per exact mutation key.
  repeated SOJournalCheckpointAttempt attempts = 4;
}

// SOReceiptState identifies the authoritative state of one exact mutation key.
enum SOReceiptState {
  // SO_RECEIPT_STATE_UNSPECIFIED is the zero value.
  SO_RECEIPT_STATE_UNSPECIFIED = 0;
  // SO_RECEIPT_STATE_NO_RECORD means no pending or terminal record exists at the lookup linearization point.
  SO_RECEIPT_STATE_NO_RECORD = 1;
  // SO_RECEIPT_STATE_PENDING means the exact mutation has been durably admitted but not terminalized.
  SO_RECEIPT_STATE_PENDING = 2;
  // SO_RECEIPT_STATE_ACCEPTED means the exact mutation has an accepted terminal receipt.
  SO_RECEIPT_STATE_ACCEPTED = 3;
  // SO_RECEIPT_STATE_REJECTED means the exact mutation has a rejected terminal receipt.
  SO_RECEIPT_STATE_REJECTED = 4;
}

// SOTerminalReceiptAccepted marks an accepted terminal mutation outcome.
message SOTerminalReceiptAccepted {}

// SOTerminalReceiptInner is the deterministic signed evidence for one terminal mutation outcome.
message SOTerminalReceiptInner {
  // Key identifies the exact immutable participant attempt.
  SOMutationKey key = 1;
  // EnvelopeDigest binds the receipt to the exact serialized signed envelope admitted for Key.
  bytes envelope_digest = 2;
  // Outcome distinguishes acceptance from the existing signed rejection payload.
  oneof outcome {
    // Accepted indicates that the mutation was applied by the authoritative root.
    SOTerminalReceiptAccepted accepted = 3;
    // SignedRejection is the existing validator-signed rejection for this mutation.
    SOOperationRejection signed_rejection = 4;
  }
  // AuthoritativeRootSeqno is the sequence number of the authoritative root terminalizing this mutation.
  uint64 authoritative_root_seqno = 5;
  // AuthoritativeRootDigest identifies the authoritative root terminalizing this mutation.
  bytes authoritative_root_digest = 6;
  // ConfigChainDigest identifies the historical configuration used to verify this receipt.
  bytes config_chain_digest = 7;
  // ConsensusMode records the signature-set rule required for this receipt.
  SOConsensusMode consensus_mode = 8;
  // ValidatorSetDigest identifies the validator set used to verify this receipt.
  bytes validator_set_digest = 9;
  // TerminalUnixMillis is the authoritative terminalization time in Unix milliseconds.
  uint64 terminal_unix_millis = 10;
  // Supersedes links this mutation to an optional predecessor attempt.
  SOMutationKey supersedes = 11;
}

// SOTerminalReceipt is the signed terminal evidence for one exact mutation outcome.
message SOTerminalReceipt {
  // Inner is the deterministic serialized SOTerminalReceiptInner covered by every validator signature.
  bytes inner = 1;
  // ValidatorSignatures are signatures by validators over the deterministic Inner bytes.
  // Signers must belong to the validator set identified by Inner.validator_set_digest and satisfy Inner.consensus_mode.
  repeated .peer.Signature validator_signatures = 2;
}
