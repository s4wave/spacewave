syntax = "proto3";
package sobject.statestore;

// Head is the stored head of a SharedObject state: the key every state write
// compares and sets. A state's other parts are stored under their own keys
// beside it, and a write sets only the keys it changes.
message Head {
  // Revision counts the committed writes of the state's lineage.
  uint64 revision = 1;
  // Digest is the SHA-256 of the previous head's digest and the write's
  // changed keys and values. Two heads are equal only when they hold the same
  // state, so a writer compares heads to learn whether storage still holds the
  // state it read, or holds the write it attempted.
  bytes digest = 2;
}
