\* Two peers, each able to end its stream twice and lose its last link once:
\* the smallest model in which one peer's failure can meet another peer's
\* running stream, and a renewal can meet its peer's departure and return.
CONSTANTS
  Peers = {p1, p2}
  MaxEnds = 2
  MaxDrops = 1
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT TypeOK
INVARIANT NoCrossPeerRestart
INVARIANT Joined
PROPERTY RecoverableReopens
PROPERTY LiftedReopens
PROPERTY RenewalNeedsLink
PROPERTY RelinkReopens
PROPERTY ShutdownCompletes
