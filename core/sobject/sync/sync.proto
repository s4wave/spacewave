syntax = "proto3";
package sobject.sync;

import "github.com/s4wave/spacewave/net/peer/peer.proto";
import "github.com/s4wave/spacewave/core/sobject/sobject.proto";

option go_package = "github.com/s4wave/spacewave/core/sobject/sync;sobject_sync";

// SOSyncMessage is the bidirectional message on the solicit stream.
message SOSyncMessage {
  reserved 2;

  // Body is the message body.
  oneof body {
    // Snapshot is a full SOState snapshot exchanged after mutual authentication.
    SOSyncSnapshot snapshot = 1;
    // Ack releases a pinned advertisement.
    SOSyncAck ack = 3;
    // Challenge begins authentication without disclosing object state.
    SOSyncChallenge challenge = 4;
    // Proof binds the participant signing key to this transport exchange.
    peer.Signature proof = 5;
    // Authorization reports acceptance without revealing configuration data.
    SOSyncAuthorization authorization = 6;
    // Head advertises a pinned state after authentication.
    SOSyncHead head = 7;
    // HistoryRequest asks for a suffix from the receiver's held checkpoint.
    SOSyncHistoryRequest history_request = 8;
    // HistoryPage carries one bounded contiguous suffix page.
    SOSyncHistoryPage history_page = 9;
    // RecoveryRequired reports that trusted recovery must replace this exchange.
    SOSyncRecoveryRequired recovery_required = 10;
    // Branch reports that history pages start after an earlier common head.
    SOSyncBranch branch = 11;
    // ConfigSuffix carries config history to a participant that refused this
    // sender's admission.
    SOSyncConfigSuffix config_suffix = 12;
  }
}

// SOSyncSnapshot is the advertised SOState exchanged after mutual
// authentication, less the records the request said the receiver holds. The
// receiver puts each held record back, checks the result against the
// advertised digest, and merges its checkpoint, key epochs and operations into
// the state it holds.
message SOSyncSnapshot {
  // SoState is the SOState proto bytes (MarshalVT) without the held records.
  bytes so_state = 1;
  // Revision binds this snapshot to the requested, pinned advertisement.
  uint64 revision = 2;
  // BaseHash is the trusted checkpoint named by the request.
  bytes base_hash = 3;
  // Restore puts back the held records omitted from so_state.
  SOSyncRestore restore = 4;
}

// SOSyncHeld names the records of a receiver's state by record hash: SHA-256
// of the record's encoding.
message SOSyncHeld {
  // Config is the record hash of the config.
  bytes config = 1;
  // Checkpoint is the record hash of the checkpoint.
  bytes checkpoint = 2;
  // KeyEpochs are the record hashes of the key epochs, in state order.
  repeated bytes key_epochs = 3;
  // Ops are the record hashes of the operations, in state order.
  repeated bytes ops = 4;
  // Sequence are the record hashes of the positions, in state order.
  repeated bytes sequence = 5;
  // ControlMessages are the record hashes of the control messages, in state
  // order.
  repeated bytes control_messages = 6;
}

// SOSyncRestore says where the held records a snapshot omits go back.
message SOSyncRestore {
  // Config puts back the held config.
  bool config = 1;
  // Checkpoint puts back the held checkpoint.
  bool checkpoint = 2;
  // KeyEpochs puts back held key epochs.
  repeated SOSyncHeldRun key_epochs = 3;
  // Ops puts back held operations.
  repeated SOSyncHeldRun ops = 4;
  // Sequence puts back held positions.
  repeated SOSyncHeldRun sequence = 5;
  // ControlMessages puts back held control messages.
  repeated SOSyncHeldRun control_messages = 6;
}

// SOSyncHeldRun places count consecutive held records, starting at offer in
// the request's list, at count consecutive indexes of the advertised list,
// starting at index. Runs of one list are ordered and do not overlap.
message SOSyncHeldRun {
  // Index is the first index in the advertised list.
  uint32 index = 1;
  // Offer is the first position in the request's list.
  uint32 offer = 2;
  // Count is the number of records the run places.
  uint32 count = 3;
}

// SOSyncAck releases a pinned advertisement.
message SOSyncAck {
  // Revision releases the sender's pinned advertisement after receipt or decline.
  uint64 revision = 1;
}

// SOSyncChallenge provides fresh entropy for one stream authentication.
message SOSyncChallenge {
  // Nonce is exactly 32 random bytes, newly generated for this stream.
  bytes nonce = 1;
}

// SOSyncAuthorization reports the receiver's current admission decision.
message SOSyncAuthorization {
  // Accepted permits this authenticated participant to proceed to data exchange.
  bool accepted = 1;
}

// SOSyncAuthTranscript is the canonical signed binding for one direction.
message SOSyncAuthTranscript {
  // SharedObjectId binds the proof to one object.
  string shared_object_id = 1;
  // SenderTransport is the authenticated transport identity producing the proof.
  bytes sender_transport = 2;
  // ReceiverTransport is the authenticated transport identity receiving the proof.
  bytes receiver_transport = 3;
  // SenderNonce is the challenge produced by the signing endpoint.
  bytes sender_nonce = 4;
  // ReceiverNonce is the challenge produced by the verifying endpoint.
  bytes receiver_nonce = 5;
}

// SOSyncHead remains pinned until its revision is acknowledged.
message SOSyncHead {
  // Revision increases for each advertised state on this stream.
  uint64 revision = 1;
  // ConfigHash identifies the advertised configuration head.
  bytes config_hash = 2;
  // ConfigSeqno is the configuration-chain sequence at ConfigHash.
  uint64 config_seqno = 3;
  // StateHash is SHA-256 of the serialized transferable snapshot; it grants no authority.
  bytes state_hash = 4;
}

// SOSyncHistoryRequest requests one complete candidate rooted in held trust.
message SOSyncHistoryRequest {
  // Revision identifies the peer's pinned advertisement.
  uint64 revision = 1;
  // BaseHash identifies the receiver's exact trusted checkpoint.
  bytes base_hash = 2;
  // FloorSeqno is the config sequence of the receiver's held checkpoint. A
  // sender that does not hold base_hash sends its branch above it instead.
  uint64 floor_seqno = 3;
  // Held names the records the receiver holds, which the snapshot omits.
  // It is empty when the names would not fit in one frame.
  SOSyncHeld held = 4;
}

// SOSyncBranch precedes the history pages when the sender does not hold the
// requested base, so the two config chains diverged. The pages start after
// cursor, the sender's record at the requested floor, and the receiver merges
// the branches.
message SOSyncBranch {
  // Revision identifies the pinned target advertisement.
  uint64 revision = 1;
  // Cursor is the hash immediately before the first page's first entry.
  bytes cursor = 2;
}

// SOSyncHistoryPage advances the request's cursor without adopting any state.
message SOSyncHistoryPage {
  // Revision identifies the pinned target advertisement.
  uint64 revision = 1;
  // Cursor is the hash immediately before this page's first entry.
  bytes cursor = 2;
  // Changes are contiguous, oldest-first signed transitions.
  repeated .sobject.SOConfigChange changes = 3;
}

// SOSyncConfigSuffix carries the sender's newest retained config changes after
// the receiver refused admission that the sender granted. The receiver adopts
// the changes that follow its held head, each authorized by the config before
// it, so a participant whose config predates the sender's key can admit it on
// the next stream. Neither side discloses state, and the refusing receiver
// discloses nothing.
message SOSyncConfigSuffix {
  // Changes are contiguous, oldest-first signed transitions ending at the
  // sender's held head.
  repeated .sobject.SOConfigChange changes = 1;
}

// SOSyncRecoveryRequired ends catch-up without changing receiver-held state.
message SOSyncRecoveryRequired {
  // Revision identifies the advertisement whose history could not be supplied.
  uint64 revision = 1;
}
