syntax = "proto3";
package sobject.world.engine;

import "github.com/s4wave/spacewave/core/sobject/sobject.proto";
import "github.com/s4wave/spacewave/db/world/block/tx/tx.proto";
import "github.com/s4wave/spacewave/db/block/transform/transform.proto";
import "github.com/s4wave/spacewave/db/bucket/bucket.proto";
import "github.com/aperturerobotics/util/backoff/backoff.proto";

// Config configures a World Graph engine bound to a block graph and controlled by a Shared Object.
// Uses MountSharedObject to mount and access the shared object and block store.
// Stores the HEAD reference in the Shared Object.
message Config {
  // EngineId is the identifier used to look up the world on the bus.
  // Used to match & resolve WorldEngine directives.
  // If empty, LookupWorldEngine will not be processed.
  string engine_id = 1;
  // Ref is the shared object ref.
  .sobject.SharedObjectRef ref = 2;
  // InitWorldOp overrides the contents of the InitWorldOp when initializing the world.
  // Only used if the shared object is empty.
  InitWorldOp init_world_op = 3;

  // DisableLookup disables looking up anything on the bus via directives.
  // Implies both DisableApplyWorldOp and DisableApplyObjectOp.
  bool disable_lookup = 4;
  // DisableApplyWorldOp disables calling the ApplyWorldOp directive.
  bool disable_apply_world_op = 5;
  // DisableApplyObjectOp disables calling the ApplyObjectOp directive.
  bool disable_apply_object_op = 6;

  // Verbose logs all operation results as debug messages.
  bool verbose = 7;

  // ProcessOpsBackoff is the backoff for processing ops as a validator.
  // Defaults to reasonable defaults if unset.
  .backoff.Backoff process_ops_backoff = 8;

  // GcSweepIdleWindowDur is the idle window duration after the last write
  // before a GC sweep is triggered if garbage exists.
  // Duration in nanoseconds. If zero, defaults to 5 seconds.
  uint64 gc_sweep_idle_window_dur = 9;
  // GcSweepBackstopIntervalDur is the periodic backstop interval for GC sweeps.
  // Duration in nanoseconds. If zero, defaults to 5 minutes.
  uint64 gc_sweep_backstop_interval_dur = 10;
}

// InnerState contains the inner state object for the SharedObject.
// Note that the SharedObject inner state thas a very small size limit.
message InnerState {
  // HeadRef is the most recent reference to the world state.
  // Includes the in-line transform config w/ crypto key.
  // The bucket ID will be overridden when loaded.
  // The bucket ID should be set to empty.
  // The object referenced is a .world.block.World block.
  .bucket.ObjectRef head_ref = 1;
}

// SOWorldOp is the outer wrapper for a shared object operation against a world InnerState.
message SOWorldOp {
  // Body is the body of the operation.
  oneof body {
    // InitWorld is the init world operation.
    InitWorldOp init_world = 1;
    // ApplyTxOp applies a world transaction.
    ApplyTxOp apply_tx_op = 2;
  }
}

// InitWorldOp is the operation to initialize the inner state.
message InitWorldOp {
  // LastChangeDisable indicates the changelog is disabled for this world.
  // If set, last_change will be empty, except for the seqno field.
  // NOTE: the seqno field will not be empty on LastChange.
  bool last_change_disable = 1;
  // TransformConf is the transform configuration to use for the world.
  // If unset, a default transform config with a random key will be generated.
  .block.transform.Config transform_conf = 2;
}

// ApplyTxOp is the operation to apply a world transaction.
message ApplyTxOp {
  // tx is the tx or tx batch to apply
  .world.block.tx.Tx tx = 1;
}

// SpaceWorldFinalizationPacket is submitted by a follower after it has produced
// candidate World content but before any SharedObject root is finalized.
message SpaceWorldFinalizationPacket {
  // BaseSharedObjectRoot is the SharedObject root observed before candidate work.
  .sobject.SORoot base_shared_object_root = 1;
  // BaseWorldRoot is the World root observed before candidate work.
  .bucket.ObjectRef base_world_root = 2;
  // CandidateWorldRoot is the follower-produced candidate World root.
  .bucket.ObjectRef candidate_world_root = 3;
  // CandidateContentId identifies the candidate content/op payload being finalized.
  bytes candidate_content_id = 4;
  // StorageGeneration is the storage coordinator generation observed by the follower.
  uint64 storage_generation = 5;
  // AuthorityEpoch identifies the leader/daemon authority epoch observed by the follower.
  uint64 authority_epoch = 6;
  // BlocksAvailable is true when the follower believes candidate blocks are readable by the authority owner.
  bool blocks_available = 7;
  // Op is the SharedObject World operation that produced the candidate root.
  SOWorldOp op = 8;
  // FollowerParticipantId identifies the submitting follower.
  string follower_participant_id = 9;
  // LocalOperationId lets the follower correlate accepted/rejected decisions.
  string local_operation_id = 10;
}

// SpaceWorldFinalizationStatus is the authority owner's decision for a packet.
enum SpaceWorldFinalizationStatus {
  // SPACE_WORLD_FINALIZATION_STATUS_UNKNOWN is invalid.
  SPACE_WORLD_FINALIZATION_STATUS_UNKNOWN = 0;
  // SPACE_WORLD_FINALIZATION_STATUS_ACCEPTED means the SharedObject root was finalized.
  SPACE_WORLD_FINALIZATION_STATUS_ACCEPTED = 1;
  // SPACE_WORLD_FINALIZATION_STATUS_REJECTED means the candidate is not accepted and should be retained follower-side only.
  SPACE_WORLD_FINALIZATION_STATUS_REJECTED = 2;
  // SPACE_WORLD_FINALIZATION_STATUS_STALE_BASE means the candidate was based on stale SharedObject or World state.
  SPACE_WORLD_FINALIZATION_STATUS_STALE_BASE = 3;
  // SPACE_WORLD_FINALIZATION_STATUS_MISSING_BLOCK means the authority owner could not read candidate blocks.
  SPACE_WORLD_FINALIZATION_STATUS_MISSING_BLOCK = 4;
  // SPACE_WORLD_FINALIZATION_STATUS_LOST_AUTHORITY means the contacted owner no longer holds finalization authority.
  SPACE_WORLD_FINALIZATION_STATUS_LOST_AUTHORITY = 5;
}

// SpaceWorldFinalizationDecision is returned by the leader or Spacewave daemon.
message SpaceWorldFinalizationDecision {
  // Status is the accept/reject/fence result.
  SpaceWorldFinalizationStatus status = 1;
  // AcceptedSharedObjectRoot is set only when status is ACCEPTED.
  .sobject.SORoot accepted_shared_object_root = 2;
  // AcceptedWorldRoot is set only when status is ACCEPTED.
  .bucket.ObjectRef accepted_world_root = 3;
  // Error explains rejected or retryable decisions.
  string error = 4;
  // Retryable indicates the follower may refresh and resubmit a new packet.
  bool retryable = 5;
  // LocalOperationId echoes the packet local id for follower correlation.
  string local_operation_id = 6;
}

// SpaceWorldRejectedCandidate records follower-local retention bookkeeping for
// a candidate that authority did not accept. The record does not grant any
// leader-side block deletion authority.
message SpaceWorldRejectedCandidate {
  // Packet is the candidate submission that was not accepted.
  SpaceWorldFinalizationPacket packet = 1;
  // Decision is the non-accepted authority outcome.
  SpaceWorldFinalizationDecision decision = 2;
  // RetainedUnixNano records when the follower retained cleanup bookkeeping.
  uint64 retained_unix_nano = 3;
}
