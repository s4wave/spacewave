syntax = "proto3";
package space.world.ops;

import "github.com/s4wave/spacewave/core/space/world/world.proto";
import "github.com/s4wave/spacewave/sdk/canvas/canvas.proto";
import "github.com/s4wave/spacewave/sdk/command/command.proto";
import "google/protobuf/timestamp.proto";
import "github.com/aperturerobotics/common/typeid/typeid.proto";

// Config configures the LookupWorldOp controller for common space world ops.
message Config {
  // EngineId restricts the LookupWorldOp resolver to a specific engine id.
  // If unset, the resolver resolves the ops for all engines.
  string engine_id = 1;
}

// SetSpaceSettingsOp is an operation to set the space settings.
// SetSpaceSettingsOp can be applied as either an object op or a world op.
message SetSpaceSettingsOp {
  option (typeid.id) = "space/world/set-settings";

  // ObjectKey is the object key for the settings.
  // If empty, ObjectKey defaults to "settings".
  string object_key = 1;
  // Settings contains the space settings to set.
  .space.world.SpaceSettings settings = 2;
  // Overwrite indicates to overwrite any existing object.
  bool overwrite = 3;
  // Timestamp is the modification time.
  .google.protobuf.Timestamp timestamp = 4;
  // ExpectedKeybindingOverrides enables per-surface conflict detection for keybinding-only writes.
  .s4wave.command.KeybindingOverrideSet expected_keybinding_overrides = 5;
}

// SetSpaceIndexPathOp changes the default object while preserving other settings.
message SetSpaceIndexPathOp {
  option (typeid.id) = "space/world/set-index-path";

  // IndexPath is the new default object path, or empty to clear it.
  string index_path = 1;
  // Timestamp is the modification time.
  .google.protobuf.Timestamp timestamp = 2;
  // ExpectedIndexPath makes automatic repair conditional on the current path.
  // A different current path leaves the settings unchanged.
  optional string expected_index_path = 3;
}

// AddSpacePluginsOp adds plugin manifest IDs to the Space settings while
// preserving every other setting and every plugin already listed.
message AddSpacePluginsOp {
  option (typeid.id) = "space/world/add-plugins";

  // PluginIds are the plugin manifest IDs to add, in order.
  // IDs already listed keep their position.
  repeated string plugin_ids = 1;
  // Timestamp is the modification time.
  .google.protobuf.Timestamp timestamp = 2;
}

// InitUnixFSOp is an operation to initialize an empty UnixFS filesystem.
message InitUnixFSOp {
  option (typeid.id) = "space/world/init-unixfs";

  // ObjectKey is the object key for the UnixFS filesystem.
  // ObjectKey must be set.
  string object_key = 1;
  // Timestamp is the modification time.
  .google.protobuf.Timestamp timestamp = 2;
}

// InitObjectLayoutOp is an operation to initialize an ObjectLayout with starter
// content. The operation creates an ObjectLayout with a simple tabset
// containing one tab.
message InitObjectLayoutOp {
  option (typeid.id) = "space/world/init-object-layout";

  // ObjectKey is the object key for the ObjectLayout.
  string object_key = 1;
  // Timestamp is the modification time.
  .google.protobuf.Timestamp timestamp = 2;
}

// InitCanvasDemoOp is an operation to initialize a Canvas with demo content.
// The operation creates a canvas object and populates it with a git repo node.
message InitCanvasDemoOp {
  option (typeid.id) = "space/world/init-canvas-demo";

  // ObjectKey is the object key for the Canvas.
  // ObjectKey must be set.
  string object_key = 1;
  // Timestamp is the modification time.
  .google.protobuf.Timestamp timestamp = 2;
}

// CanvasInitOp is an operation to initialize a blank canvas.
// CanvasInitOp creates an empty CanvasState and sets the object type to
// "canvas".
message CanvasInitOp {
  option (typeid.id) = "space/world/init-canvas";

  // ObjectKey is the object key for the Canvas.
  string object_key = 1;
  // Timestamp is the modification time.
  .google.protobuf.Timestamp timestamp = 2;
}

// CanvasAddNodeOp is an operation to add a node to a canvas.
message CanvasAddNodeOp {
  option (typeid.id) = "space/world/canvas-add-node";

  // ObjectKey is the canvas object key.
  string object_key = 1;
  // Node is the full node to add.
  .s4wave.canvas.CanvasNode node = 2;
}

// CanvasRemoveNodeOp is an operation to remove nodes from a canvas.
message CanvasRemoveNodeOp {
  option (typeid.id) = "space/world/canvas-remove-node";

  // ObjectKey is the canvas object key.
  string object_key = 1;
  // NodeIds is the list of node IDs to remove.
  repeated string node_ids = 2;
}

// CanvasSetNodeOp is an operation to replace a node in a canvas.
// The full node is provided and replaces the existing node with the same ID.
message CanvasSetNodeOp {
  option (typeid.id) = "space/world/canvas-set-node";

  // ObjectKey is the canvas object key.
  string object_key = 1;
  // Node is the full replacement node.
  .s4wave.canvas.CanvasNode node = 2;
}

// CanvasAddEdgeOp is an operation to add an edge to a canvas.
message CanvasAddEdgeOp {
  option (typeid.id) = "space/world/canvas-add-edge";

  // ObjectKey is the canvas object key.
  string object_key = 1;
  // Edge is the edge to add.
  .s4wave.canvas.CanvasEdge edge = 2;
}

// CanvasRemoveEdgeOp is an operation to remove edges from a canvas.
message CanvasRemoveEdgeOp {
  option (typeid.id) = "space/world/canvas-remove-edge";

  // ObjectKey is the canvas object key.
  string object_key = 1;
  // EdgeIds is the list of edge IDs to remove.
  repeated string edge_ids = 2;
}
