syntax = "proto3";
package block;

import "github.com/s4wave/spacewave/net/hash/hash.proto";

// BlockRef is a block content ID reference.
//
//protobuf-go-lite:disable-json
message BlockRef {
  // Hash is the hash of the object.
  .hash.Hash hash = 1;
}

// BlockObject is a block's bytes with its outgoing refs, as stored by
// backends that keep blocks as opaque objects.
message BlockObject {
  // Data is the encoded block.
  bytes data = 1;
  // Refs are the block's outgoing refs. Empty means a leaf.
  repeated BlockRef refs = 2;
}

// AccessLog lists the blocks an operation read, once each, in the order of
// first use.
message AccessLog {
  // Accesses are the first reads of each block.
  repeated Access accesses = 1;
}

// Access is the first read of one block.
message Access {
  // Ref is the block read.
  BlockRef ref = 1;
  // Size is the stored size of the block in bytes.
  uint32 size = 2;
  // ElapsedUs is the time from the start of the log to the read, in
  // microseconds.
  uint64 elapsed_us = 3;
}

// PutOpts are options that can be passed to PutBlock.
message PutOpts {
  // HashType is the hash type to use.
  // If unset (0 value) will use default for the store.
  .hash.HashType hash_type = 1;
  // ForceBlockRef forces the block ref to equal the given ref.
  // Can be unset to indicate none (allow any).
  //
  // If the generated BlockRef does not match, the storage operation is aborted
  // and returns block.ErrBlockRefMismatch.
  BlockRef force_block_ref = 2;
  // Refs are outgoing block references recorded with this write.
  // GC-aware stores consume these refs as part of the put. Stores that do not
  // participate in GC ignore this field.
  repeated BlockRef refs = 3;
  // Sync requests a durability fence before PutBlock returns. When false, the
  // store may enqueue the write and make it immediately readable through its
  // read-through path without waiting for durability. When true, PutBlock
  // enqueues the write, then calls the store Sync barrier so this write and all
  // prior buffered writes for the store are durable before return.
  bool sync = 4;
  // CacheFill marks a copy of a block read from another store. A GC-aware
  // store records its outgoing refs but gives it no owner: a new block is
  // staged as a garbage candidate, and an existing block keeps its edges. The
  // copy then lives only while a retained root reaches it.
  bool cache_fill = 5;
  // RefsKnown declares refs complete: the writer decoded the block and refs
  // lists every block it references, so empty refs mean a leaf. A GC-aware
  // store then records the child list of a block it already held without one.
  // Unset, refs may be partial, and an existing block keeps its list.
  bool refs_known = 6;
}

// StoreFeature is a bitmask of native block store capabilities.
// Each non-zero enum value is a single bit and values are combined with
// bitwise OR. The values are intentionally not sequential.
enum StoreFeature {
  // STORE_FEATURE_UNKNOWN indicates no native capabilities are reported.
  STORE_FEATURE_UNKNOWN = 0;
  // STORE_FEATURE_NATIVE_BATCH_PUT means PutBlockBatch is implemented natively.
  STORE_FEATURE_NATIVE_BATCH_PUT = 1;
  // STORE_FEATURE_NATIVE_BATCH_EXISTS means GetBlockExistsBatch is implemented natively.
  STORE_FEATURE_NATIVE_BATCH_EXISTS = 2;
  reserved 4, 8, 16;
  reserved "STORE_FEATURE_NATIVE_BACKGROUND_PUT", "STORE_FEATURE_NATIVE_FLUSH", "STORE_FEATURE_NATIVE_DEFER_FLUSH";
  // STORE_FEATURE_SELF_BUFFERED means the store has its own read-through
  // pending buffer, so the world block engine must not wrap it in a
  // BufferedStore. Volume.Sync remains the durability barrier for
  // volume-backed stores.
  STORE_FEATURE_SELF_BUFFERED = 32;
}

// OverlayMode controls the mode for the block store overlay.
enum OverlayMode {
  // UPPER_ONLY uses the upper store only for reads and writes.
  // reads go to the upper store only.
  // writes go to the upper store only.
  // removes go to the upper store only.
  // the lower store is not used.
  UPPER_ONLY = 0;
  // LOWER_ONLY uses the lower store only for reads and writes.
  // reads go to the lower store only.
  // writes go to the lower store only.
  // removes go to the lower store only.
  // the upper store is not used.
  LOWER_ONLY = 1;
  // UPPER_CACHE uses the upper store as a cache for the lower store.
  // reads go to the upper store first, then the lower store.
  // writes go to both stores.
  // removes go to both stores.
  // reads from lower are written back to upper.
  UPPER_CACHE = 2;
  // LOWER_CACHE uses the lower store as a cache for the upper store.
  // reads go to the lower store first, then the upper store.
  // writes go to both stores.
  // removes go to both stores.
  // reads from upper are written back to lower.
  LOWER_CACHE = 3;
  // UPPER_READ_CACHE uses the upper store as a cache for the lower store.
  // reads go to the upper store first, then the lower store.
  // writes go to the lower store only.
  // removes go to the lower store only.
  // reads from lower are not written back to upper.
  UPPER_READ_CACHE = 4;
  // LOWER_READ_CACHE uses the lower store as a cache for the upper store.
  // reads go to the lower store first, then the upper store.
  // writes go to the upper store only.
  // removes go to both stores.
  // reads from upper are not written back to lower.
  LOWER_READ_CACHE = 5;
  // UPPER_WRITE_CACHE uses the upper store as a write cache for the lower store.
  // reads go to the upper store first, then the lower store.
  // writes go to the upper store only.
  // removes go to both stores.
  // reads from lower are not written back to upper.
  UPPER_WRITE_CACHE = 6;
  // LOWER_WRITE_CACHE uses the lower store as a write cache for the upper store.
  // reads go to the lower store first, then the upper store.
  // writes go to the lower store only.
  // removes go to both stores.
  // reads from upper are not written back to lower.
  LOWER_WRITE_CACHE = 7;
  // UPPER_READBACK_CACHE treats the lower store as read-only and immutable
  // (e.g. remote packfiles) while caching reads back into the upper store.
  // reads go to the upper store first, then the lower store.
  // reads from lower are written back to upper.
  // writes go to the upper store only.
  // removes go to the upper store only (lower lifecycle is external, e.g.
  // packfile garbage collection / repack).
  UPPER_READBACK_CACHE = 8;
}

// Deadlist is one block of the record of what died between two named Worlds
// of one engine. A header holds metadata and Parts; indexes hold only Parts;
// list leaves hold historical fields. Each block declares its distinct Parts
// and Found as ordinary child refs. From and other historical pages are values,
// so they do not become mark roots.
//
//protobuf-go-lite:disable-json
message Deadlist {
  // Seq orders the engine's records. The record is named deadlist/<seq>
  // while pending and deadlist-due/<seq> once due.
  uint64 seq = 1;
  // From is the root of the named World the interval starts at.
  BlockRef from = 2;
  // To is the root of the named World the interval ends at.
  BlockRef to = 3;
  // Replaced are dead pages whose own children are accounted for here.
  repeated BlockRef replaced = 4;
  // Removed are the roots of dead stored subtrees.
  repeated BlockRef removed = 5;
  // Kept are live pages that stop the expansion of Removed.
  repeated BlockRef kept = 6;
  // Parts are bounded children of a header or index. List leaves have none;
  // repeated occurrences preserve list multiplicity despite physical reuse.
  repeated BlockRef parts = 7;
  // Held are live stored pages that may have gained a holder, each listed
  // once per new parent. A small record with a current complete basis adds
  // one shared count per entry at naming; large records request recount.
  repeated BlockRef held = 8;
  // Existed are live pages whose edge from the new tree was counted already:
  // a put found them stored, or only pages that existed name them. The old
  // root is among them when an existing page still names it.
  repeated BlockRef existed = 9;
  // Dropped are dead pages the interval stored afresh and dropped, whose
  // edges to their children no put counted.
  repeated BlockRef dropped = 10;
  // Found are the pages an interval's puts found stored, listed once per
  // put. Puts add provisional scalar holders; bucket/stage owners retain bytes.
  // A leaf declares distinct Found as ordinary child refs, separately funded
  // when that physical leaf is fresh. Precise application returns provisional
  // multiplicity only with an unchanged complete basis; uncertainty skips it.
  repeated BlockRef found = 11;
  // CountingGeneration is the Volume-wide count generation of every put.
  // It is trustworthy only with counts_complete and a matching current basis.
  uint64 counting_generation = 12;
  // CountsComplete certifies that every successful interval put used the
  // same complete, non-doubtful counting generation, including From's first
  // lineage receipt. Missing or mixed bases are uncertain.
  bool counts_complete = 13;
  // FallbackHeld counts fresh-parent edges from all successful puts, including
  // discarded pages. It replaces Held for a small uncertain record; large
  // records request recount from the graph instead of replaying this list.
  repeated BlockRef fallback_held = 14;
}

