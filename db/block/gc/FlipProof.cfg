\* One key, two queue positions, and enough revisions and adoptions for a
\* writer to land between the proof's snapshot and the flip, and again
\* between the holes-clear check and its write.
CONSTANTS
  Keys = {"a"}
  Positions = {1, 2}
  MaxRev = 3
  MaxAdopt = 2
  Skip = "none"
  Stamp = TRUE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK ClearSound NoUnsafeFlip
