\* Journal-adopt-cut.cfg with main committing only N, one half of that
\* config split by main's target with Journal-adopt-cut-r2.cfg: the cut child
\* list under both adoption races at once, the staged write and the
\* superseded run. Neither half checks a behavior where main commits both R2
\* and N; the whole config does not finish within 6 GiB of memory.
\*
\* Journal-adopt.cfg over lists a store format before 7 left, one of them
\* cut: C's child list lacks F, which C names. Adoption counts from the
\* lists, so F has no holder but main, through R1 and C, still reaches it.
\* While the lists are unverified the free takes only blocks Land gave birth
\* to since the upgrade, so F stays.
