\* Journal-adopt-cut.cfg with one adoption run and no reopen: the cut child
\* list with the staged write racing the adoption, but no superseded run
\* racing its replacement. Journal-adopt-cut-nostage.cfg checks that race
\* instead; neither checks both at once, as the full config does, which
\* outgrows 4,000 MiB.
\* Journal-adopt.cfg over lists a store format before 7 left, one of them
\* cut: C's child list lacks F, which C names. Adoption counts from the
\* lists, so F has no holder but main, through R1 and C, still reaches it.
\* While the lists are unverified the free takes only blocks Land gave birth
\* to since the upgrade, so F stays.
CONSTANTS
  Writers = {a}
  MaxTxns = 2
  Grace = 1
  Window = 0
  Lease = 0
  MaxHoles = 0
  MainRoots = {"R2", "N"}
  StageRoots = {"R3"}
  Reader = FALSE
  Ripe = TRUE
  Revive = TRUE
  HoldMark = TRUE
  Reripen = TRUE
  Held = TRUE
  HoleStop = TRUE
  Reput = FALSE
  CAS = TRUE
  PutPair = TRUE
  Runs = {A}
  MaxOpens = 0
  RunCheck = TRUE
  Claim = TRUE
  BornMark = TRUE
  RootMark = TRUE
  Stage = FALSE
  Rehold = TRUE
  StageCAS = TRUE
  Sessions = FALSE
  SessionGrace = TRUE
  Skips = FALSE
  BornDown = TRUE
  Staged = FALSE
  ReleaseUnlisted = TRUE
  FillBlocks = {}
  FillUps = TRUE
  Holds = FALSE
  FillBorn = TRUE
  FillEager = TRUE
  CutList = TRUE
  Gen = TRUE
  RewriteFlag = TRUE
  Recount = TRUE
  ChildRipe = FALSE
  HoldToFree = TRUE
SPECIFICATION Spec
SYMMETRY RunPerms
INVARIANT NoFreedRead ReaderWindow NoUnderflow ZeroStored CountsCover CountsExact HoleKeeps NoLeak RewriteRecounted NoLiveListsFreed
