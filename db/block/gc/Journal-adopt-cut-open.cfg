\* Journal-adopt-cut.cfg with one run and an opening that resets the
\* adopting Volume, which Journal-adopt-cut.cfg leaves out to stay in the
\* checker's memory. Journal-adopt.cfg races an opening with two runs over
\* whole lists.
CONSTANTS
  Writers = {a}
  MaxTxns = 2
  Grace = 1
  Window = 0
  Lease = 0
  MaxHoles = 0
  MainRoots = {"R2", "N"}
  StageRoots = {"R3"}
  Reader = FALSE
  Ripe = TRUE
  Revive = TRUE
  HoldMark = TRUE
  Reripen = TRUE
  Held = TRUE
  HoleStop = TRUE
  Reput = FALSE
  CAS = TRUE
  PutPair = TRUE
  Runs = {A}
  MaxOpens = 1
  RunCheck = TRUE
  Claim = TRUE
  BornMark = TRUE
  RootMark = TRUE
  Stage = FALSE
  Rehold = TRUE
  StageCAS = TRUE
  Sessions = FALSE
  SessionGrace = TRUE
  Skips = FALSE
  BornDown = TRUE
  Staged = FALSE
  ReleaseUnlisted = TRUE
  FillBlocks = {}
  FillUps = TRUE
  Holds = FALSE
  FillBorn = TRUE
  FillEager = TRUE
  CutList = TRUE
  Gen = TRUE
  RewriteFlag = TRUE
  Recount = TRUE
  ClearMark = TRUE
  Suspect = TRUE
  SuspectLand = TRUE
  SuspectRecount = TRUE
  SuspectEarly = TRUE
SPECIFICATION Spec
SYMMETRY RunPerms
INVARIANT NoFreedRead ReaderWindow NoUnderflow ZeroStored CountsCover CountsExact HoleKeeps NoLeak
