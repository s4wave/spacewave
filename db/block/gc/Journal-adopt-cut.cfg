  Reripen = TRUE
  Held = TRUE
  HoleStop = TRUE
  Reput = FALSE
  CAS = TRUE
  PutPair = TRUE
  Runs = {A, B}
  MaxOpens = 0
  RunCheck = TRUE
  Claim = TRUE
  BornMark = TRUE
  RootMark = TRUE
  Stage = FALSE
  Rehold = TRUE
  StageCAS = TRUE
  Sessions = FALSE
  SessionGrace = TRUE
  Skips = FALSE
  BornDown = TRUE
  Staged = FALSE
  ReleaseUnlisted = TRUE
  FillBlocks = {}
  FillUps = TRUE
  Holds = FALSE
  FillBorn = TRUE
  FillEager = TRUE
  CutList = TRUE
  Gen = TRUE
  RewriteFlag = TRUE
  Recount = TRUE
  ClearMark = TRUE
  Suspect = TRUE
