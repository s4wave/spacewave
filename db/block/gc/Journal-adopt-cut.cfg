\* Journal-adopt.cfg over lists a store format before 7 left, one of them
\* cut: C's child list lacks F, which C names. Adoption counts from the
\* lists, so F has no holder but main, through R1 and C, still reaches it.
\* While the lists are unverified the free takes only blocks Land gave birth
\* to since the upgrade, so F stays.
\* Two runs and no opening: with both, the suspect steps take the checker
\* past 30 million states. Journal-adopt-cut-open.cfg opens with one run.
