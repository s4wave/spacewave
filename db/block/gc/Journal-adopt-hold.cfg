\* Journal-adopt-revive.cfg where main can also move back onto a stored tree
\* without putting it. Main commits R2, so Finish's walk reaches only R2, and
\* a hold moves main back onto the stored R1 before the suspect records: an
\* old hold. The clear sees it and walks again, which finds C's cut list
\* under main and waits for its rebuild. After the clear, a hold onto R1 is
\* refused by its suspect record, and a put of R1 promotes it only once C's
\* list is whole.
CONSTANTS
  Writers = {a}
  MaxTxns = 3
  Grace = 1
  Window = 0
  Lease = 0
  MaxHoles = 0
  MainRoots = {"R1", "R2"}
  StageRoots = {}
  Reader = FALSE
  Ripe = TRUE
  Revive = TRUE
  HoldMark = TRUE
  Reripen = TRUE
  Held = TRUE
  HoleStop = TRUE
  Reput = FALSE
  CAS = TRUE
  PutPair = TRUE
  Runs = {A}
  MaxOpens = 0
  RunCheck = TRUE
  Claim = TRUE
  BornMark = TRUE
  RootMark = TRUE
  Stage = FALSE
  Rehold = TRUE
  StageCAS = TRUE
  Sessions = FALSE
  SessionGrace = TRUE
  Skips = FALSE
  BornDown = TRUE
  Staged = FALSE
  ReleaseUnlisted = TRUE
  FillBlocks = {}
  FillUps = TRUE
  Holds = TRUE
  FillBorn = TRUE
  FillEager = TRUE
  CutList = TRUE
  Gen = TRUE
  RewriteFlag = TRUE
  Recount = TRUE
  PutRecount = TRUE
  LandCheck = TRUE
  FillBarrier = TRUE
  FillLanded = TRUE
  PunchGuard = TRUE
  AdoptDirty = TRUE
  FlipFills = TRUE
  RebirthDown = TRUE
  UnmarkedRefuse = TRUE
  Grey = TRUE
  Stop = TRUE
  ReplacedSkip = "off"
  CutInit = {"C"}
  HoleBlock = TRUE
  Accepts = FALSE
  WalkSkip = {}
  RootWalk = FALSE
  FrontPop = "free"
  HoldFound = TRUE
  FlipSettled = TRUE
  ParkAbsent = TRUE
