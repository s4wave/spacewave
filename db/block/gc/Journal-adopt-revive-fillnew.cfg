\* Journal-adopt-revive.cfg where a peer can serve R2 and C2, which the store
\* lacks, while the generation is open: a fill stores C2, which names the old
\* F, and main moves onto a filled R2 without putting its tree. The fill marks
\* C2 landed and pushes F onto the front, so the walk verifies F. Main reaches
\* F through C2 only once C2 is stored, so NoFreedStoredRead is the claim.
CONSTANTS
  Writers = {a}
  MaxTxns = 3
  Grace = 1
  Window = 0
  Lease = 0
  MaxHoles = 0
  MainRoots = {"R1", "R2"}
  StageRoots = {}
  Reader = FALSE
  Ripe = TRUE
  Revive = TRUE
  HoldMark = TRUE
  Reripen = TRUE
  Held = TRUE
  HoleStop = TRUE
  Reput = FALSE
  CAS = TRUE
  PutPair = TRUE
  Runs = {A}
  MaxOpens = 0
  RunCheck = TRUE
  Claim = TRUE
  BornMark = TRUE
  RootMark = TRUE
  Stage = FALSE
  Rehold = TRUE
  StageCAS = TRUE
  Sessions = FALSE
  SessionGrace = TRUE
  Skips = FALSE
  BornDown = TRUE
  Staged = FALSE
  ReleaseUnlisted = TRUE
  FillBlocks = {"R2", "C2"}
  FillUps = TRUE
  Holds = TRUE
  FillBorn = TRUE
  FillEager = TRUE
  CutList = TRUE
  Gen = TRUE
  RewriteFlag = TRUE
  Recount = TRUE
  PutRecount = TRUE
  LandCheck = TRUE
  FillBarrier = TRUE
  FillLanded = TRUE
  PunchGuard = TRUE
  AdoptDirty = TRUE
  FlipFills = TRUE
  RebirthDown = TRUE
  UnmarkedRefuse = TRUE
  Grey = TRUE
  Stop = TRUE
  ReplacedSkip = "off"
  CutInit = {"C"}
  HoleBlock = TRUE
  Accepts = FALSE
  WalkSkip = {}
  RootWalk = FALSE
  FrontPop = "free"
  HoldFound = TRUE
  FlipSettled = TRUE
  ParkAbsent = TRUE
  RunAtFlip = TRUE
  PopRecount = TRUE
  RunScan = "off"
  ScanOrder = "down"
  FlipReleased = TRUE
  HoldDue = TRUE
  FlipFront = TRUE
  ReholdFront = TRUE
  RecountFront = TRUE
  ParkPut = "repark"
  RunBlocks = {"R1", "R2", "R3", "C", "C2", "E", "F", "G", "N", "S", "T"}
SPECIFICATION Spec
SYMMETRY RunPerms
INVARIANT VouchMarked NoFreedStoredRead NoUnderflow ZeroStored CountsCover CountsExact HoleKeeps NoLeak RewriteRecounted OneFillRecord
