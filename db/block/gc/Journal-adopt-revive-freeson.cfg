\* Journal-adopt-revive.cfg where the collector's frees turn on mid-sweep, as
\* an open after one with them off does: FreesOn returns the Volume to
\* unadopted while the flip's unmarked blocks wait for the sweep, and the
\* recount runs while Sweeping. It reads each unmarked list for its
\* children outside the run and leaves each unmarked block off zero, so no
\* cascade names one.
CONSTANTS
  Writers = {a}
  MaxTxns = 3
  Grace = 1
  Window = 0
  Lease = 0
  MaxHoles = 0
  MainRoots = {"R1", "R2"}
  StageRoots = {}
  Reader = FALSE
  Ripe = TRUE
  Revive = TRUE
  HoldMark = TRUE
  Reripen = TRUE
  Held = TRUE
  HoleStop = TRUE
  Reput = FALSE
  CAS = TRUE
  PutPair = TRUE
  Runs = {A}
  MaxOpens = 1
  RunCheck = TRUE
  Claim = TRUE
  BornMark = TRUE
  RootMark = TRUE
  Stage = FALSE
  Rehold = TRUE
  StageCAS = TRUE
  Sessions = FALSE
  SessionGrace = TRUE
  Skips = FALSE
  BornDown = TRUE
  Staged = FALSE
  ReleaseUnlisted = TRUE
  FillBlocks = {}
  FillUps = TRUE
  Holds = FALSE
  FillBorn = TRUE
  FillEager = TRUE
  CutList = TRUE
  Gen = TRUE
  RewriteFlag = TRUE
  Recount = TRUE
  PutRecount = TRUE
  LandCheck = TRUE
  FillBarrier = TRUE
  FillLanded = TRUE
  PunchGuard = TRUE
  AdoptDirty = TRUE
  FlipFills = TRUE
  RebirthDown = TRUE
  UnmarkedRefuse = TRUE
  Grey = TRUE
  Stop = TRUE
  ReplacedSkip = "off"
  CutInit = {"C"}
  HoleBlock = TRUE
  Accepts = FALSE
  WalkSkip = {}
  RootWalk = FALSE
  FrontPop = "free"
  ChildRipe = FALSE
  RogueBlocks = {}
  TailCheck = TRUE
  HoldToFree = FALSE
  HoldFound = TRUE
  FlipSettled = TRUE
  ParkAbsent = TRUE
  RunAtFlip = TRUE
  PopRecount = TRUE
  RunScan = "off"
  ScanOrder = "down"
  FlipReleased = TRUE
  HoldDue = TRUE
  FlipFront = TRUE
  ReholdFront = TRUE
  RecountFront = TRUE
  ParkPut = "repark"
  RunBlocks = {"R1", "R2", "R3", "C", "C2", "E", "F", "G", "N", "S", "T"}
SPECIFICATION ReadoptSpec
INVARIANT VouchMarked NoFreedRead ReaderWindow NoUnderflow ZeroStored CountsCover CountsExact HoleKeeps NoLeak RewriteRecounted
PROPERTY Readopted
