\* Journal-adopt-revive.cfg with one hole: any block, an unverified old one
\* included, may be lost while the generation is open, and a later put may
\* refill it. With HoleBlock the walk records the hole it reaches and the flip
\* waits for the refill.
CONSTANTS
  Writers = {a}
  MaxTxns = 3
  Grace = 1
  Window = 0
  Lease = 0
  MaxHoles = 1
  MainRoots = {"R1", "R2"}
  StageRoots = {}
  Reader = FALSE
  Ripe = TRUE
  Revive = TRUE
  HoldMark = TRUE
  Reripen = TRUE
  Held = TRUE
  HoleStop = TRUE
  Reput = TRUE
  CAS = TRUE
  PutPair = TRUE
  Runs = {A}
  MaxOpens = 0
  RunCheck = TRUE
  Claim = TRUE
  BornMark = TRUE
  RootMark = TRUE
  Stage = FALSE
  Rehold = TRUE
  StageCAS = TRUE
  Sessions = FALSE
  SessionGrace = TRUE
  Skips = FALSE
  BornDown = TRUE
  Staged = FALSE
  ReleaseUnlisted = TRUE
  FillBlocks = {}
  FillUps = TRUE
  Holds = FALSE
  FillBorn = TRUE
  FillEager = TRUE
  CutList = TRUE
  Gen = TRUE
  RewriteFlag = TRUE
  Recount = TRUE
  PutRecount = TRUE
  LandCheck = TRUE
  FillBarrier = TRUE
  FillLanded = TRUE
  PunchGuard = FALSE
  AdoptDirty = TRUE
  FlipFills = TRUE
  RebirthDown = TRUE
  UnmarkedRefuse = TRUE
  Grey = TRUE
  Stop = TRUE
  ReplacedSkip = "off"
  CutInit = {"C"}
  HoleBlock = TRUE
  Accepts = FALSE
  WalkSkip = {}
  RootWalk = FALSE
  FrontPop = "free"
SPECIFICATION ReadoptSpec
INVARIANT HoleKeeps NoLeak NoFreedStoredRead NoFreedRead CountsCover NoUnderflow ZeroStored
PROPERTY HoleHolds
