SPECIFICATION Spec
SYMMETRY RunPerms
PROPERTY AdoptMarkFixed
INVARIANT VouchMarked NoFreedRead ReaderWindow NoUnderflow ZeroStored CountsCover CountsExact HoleKeeps NoLeak RewriteRecounted
