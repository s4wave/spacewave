\* Journal-adopt-revive.cfg with a reader that sees a head and pins it
\* within Window. An adoption may mark between the sight and the pin, after
\* main moved off the head, and settle the head at zero; the marker record the
\* mark starts the journal with keeps the head unfreed, and the adoption mark
\* keeps the flip from unmarking it, until it is Grace old, so the pin lands
\* on a whole tree. AdoptMarkFixed shows that no write moves the flip's mark.
\* Two writes, main to R2 and back to R1, are the fewest that reach the
\* adoption between a reader's sight and its pin; with three the check passed
\* 7.9 million states in 75 minutes unfinished.
CONSTANTS
  Writers = {a}
  MaxTxns = 2
  Grace = 1
  Window = 0
  Lease = 0
  MaxHoles = 0
  MainRoots = {"R1", "R2"}
  StageRoots = {}
  Reader = TRUE
  Ripe = TRUE
  Revive = TRUE
  HoldMark = TRUE
  Reripen = TRUE
  Held = TRUE
  HoleStop = TRUE
  Reput = FALSE
  CAS = TRUE
  PutPair = TRUE
  Runs = {A}
  MaxOpens = 0
  RunCheck = TRUE
  Claim = TRUE
  BornMark = TRUE
  RootMark = TRUE
  Stage = FALSE
  Rehold = TRUE
  StageCAS = TRUE
  Sessions = FALSE
  SessionGrace = TRUE
  Skips = FALSE
  BornDown = TRUE
  Staged = FALSE
  ReleaseUnlisted = TRUE
  FillBlocks = {}
  FillUps = TRUE
  Holds = FALSE
  FillBorn = TRUE
  FillEager = TRUE
  CutList = TRUE
  Gen = TRUE
  RewriteFlag = TRUE
  Recount = TRUE
  PutRecount = TRUE
  LandCheck = TRUE
  FillBarrier = TRUE
  FillLanded = TRUE
  PunchGuard = TRUE
  AdoptDirty = TRUE
  FlipFills = TRUE
  RebirthDown = TRUE
  UnmarkedRefuse = TRUE
  Grey = TRUE
  Stop = TRUE
  ReplacedSkip = "off"
  CutInit = {"C"}
  HoleBlock = TRUE
  Accepts = FALSE
  WalkSkip = {}
  RootWalk = FALSE
  FrontPop = "free"
  ChildRipe = FALSE
  RogueBlocks = {}
  TailCheck = TRUE
  HoldToFree = FALSE
  HoldFound = TRUE
  FlipSettled = TRUE
  ParkAbsent = TRUE
