\* Journal-adopt-cut.cfg where main can return to R1. Main moves to R2, so
\* nothing reaches C, Finish clears the mark with C's list still cut, and a
\* commit back to R1 puts C again over its stored list, which lacks F. C's
\* suspect record has that put write C's whole list and return the Volume to
\* unadopted, so F is not freed under R1 and C, and the pass that put asks
\* for adopts the Volume again.
CONSTANTS
  Writers = {a}
  MaxTxns = 3
  Grace = 1
  Window = 0
  Lease = 0
  MaxHoles = 0
  MainRoots = {"R1", "R2"}
  StageRoots = {}
  Reader = FALSE
  Ripe = TRUE
  Revive = TRUE
  HoldMark = TRUE
  Reripen = TRUE
  Held = TRUE
  HoleStop = TRUE
  Reput = FALSE
  CAS = TRUE
  PutPair = TRUE
  Runs = {A}
  MaxOpens = 0
  RunCheck = TRUE
  Claim = TRUE
  BornMark = TRUE
  RootMark = TRUE
  Stage = FALSE
  Rehold = TRUE
  StageCAS = TRUE
  Sessions = FALSE
  SessionGrace = TRUE
  Skips = FALSE
  BornDown = TRUE
  Staged = FALSE
  ReleaseUnlisted = TRUE
  FillBlocks = {}
  FillUps = TRUE
  Holds = FALSE
  FillBorn = TRUE
  FillEager = TRUE
  CutList = TRUE
  Gen = TRUE
  RewriteFlag = TRUE
  Recount = TRUE
  PutRecount = TRUE
  LandCheck = TRUE
  FillBarrier = TRUE
  FillLanded = TRUE
  PunchGuard = TRUE
  AdoptDirty = TRUE
  FlipFills = TRUE
  RebirthDown = TRUE
  UnmarkedRefuse = TRUE
  Grey = TRUE
  Stop = TRUE
  ReplacedSkip = "off"
  CutInit = {"C"}
  HoleBlock = TRUE
  Accepts = FALSE
  WalkSkip = {}
