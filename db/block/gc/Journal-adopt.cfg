\* An unadopted Volume, main on R1 and a stage on R3 that predate the journal,
\* with a stale count and queue entry. Two adoption runs overlap, either may
\* crash at any step and one opening resets an adopting Volume, while a World
\* writer commits R2 or N, adopts the stage onto main, and the collector
\* sweeps the stage's lapsed lease. Once adopted, the counts are exact.
CONSTANTS
  Writers = {a}
  MaxTxns = 2
  MaxNow = 2
  Grace = 1
  Window = 0
  Lease = 0
  MaxHoles = 0
  MainRoots = {"R2", "N"}
  StageRoots = {"R3"}
  Reader = FALSE
  TailCheck = TRUE
  Held = TRUE
  HoleStop = TRUE
  Reput = FALSE
  CAS = TRUE
  PutPair = TRUE
  Runs = {A, B}
  MaxOpens = 1
  RunCheck = TRUE
  Claim = TRUE
  BornMark = TRUE
  RootMark = TRUE
  Stage = FALSE
  Rehold = TRUE
  StageCAS = TRUE
  Sessions = FALSE
  SessionGrace = TRUE
  Skips = FALSE
SPECIFICATION Spec
SYMMETRY RunPerms
INVARIANT NoFreedRead ReaderWindow NoUnderflow ZeroStored CountsCover CountsExact HoleKeeps NoLeak
