\* Liveness: with fair netting and deletion, every block no root reaches is
\* freed in the end, but those below a hole.
CONSTANTS
  Writers = {a}
  MaxTxns = 2
  MaxNow = 2
  Grace = 1
  Window = 0
  Lease = 0
  MaxHoles = 1
  MainRoots = {"R2", "N"}
  StageRoots = {"R2"}
  Reader = FALSE
  TailCheck = TRUE
  Held = TRUE
  Refuse = TRUE
  HoleStop = TRUE
  Reput = FALSE
  CAS = TRUE
SPECIFICATION Spec
INVARIANT NoFreedRead ReaderWindow NoUnderflow ZeroStored CountsCover CountsExact HoleKeeps NoLeak
PROPERTY Collected
