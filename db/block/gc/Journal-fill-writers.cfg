\* Unstaged sessions over R1 while reads fill R2 and C2: a session's batch
\* may name a filled block, put it again, or put a parent before a fill of
\* its child lands.
CONSTANTS
  Writers = {a}
  MaxTxns = 4
  Grace = 1
  Window = 0
  Lease = 0
  MaxHoles = 0
  MainRoots = {"R2"}
  StageRoots = {}
  Reader = FALSE
  Ripe = TRUE
  Revive = TRUE
  HoldMark = TRUE
  Reripen = TRUE
  Held = TRUE
  HoleStop = TRUE
  Reput = FALSE
  CAS = TRUE
  PutPair = TRUE
  Runs = {}
  MaxOpens = 0
  RunCheck = TRUE
  Claim = TRUE
  BornMark = TRUE
  RootMark = TRUE
  Stage = FALSE
  Rehold = TRUE
  StageCAS = TRUE
  Sessions = TRUE
  SessionGrace = TRUE
  Skips = FALSE
  BornDown = TRUE
  Staged = FALSE
  ReleaseUnlisted = TRUE
  FillBlocks = {"R2", "C2"}
  FillUps = TRUE
  Holds = FALSE
  FillBorn = TRUE
  FillEager = TRUE
SPECIFICATION Spec
INVARIANT NoFreedStoredRead ReaderWindow NoUnderflow ZeroStored CountsCover CountsExact HoleKeeps NoLeak OneFillRecord
