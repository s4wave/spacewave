\* Reads fill R2, which names C2, and C2, which names F, at any time: before
\* or after main moves onto R2 by a commit that puts its tree, a stage, or a
\* hold that puts nothing. The collector nets the fill records and the main
\* journal in any order, and frees what stops being held.
CONSTANTS
  Writers = {a}
  MaxTxns = 3
  MaxNow = 2
  Grace = 1
  Window = 0
  Lease = 0
  MaxHoles = 0
  MainRoots = {"R2"}
  StageRoots = {"R2"}
  Reader = FALSE
  TailCheck = TRUE
  Held = TRUE
  HoleStop = TRUE
  Reput = FALSE
  CAS = TRUE
  PutPair = TRUE
  Runs = {}
  MaxOpens = 0
  RunCheck = TRUE
  Claim = TRUE
  BornMark = TRUE
  RootMark = TRUE
  Stage = FALSE
  Rehold = TRUE
  StageCAS = TRUE
  Sessions = FALSE
  SessionGrace = TRUE
  Skips = FALSE
  BornDown = TRUE
  Staged = FALSE
  ReleaseUnlisted = TRUE
  FillBlocks = {"R2", "C2"}
  FillUps = TRUE
  Holds = TRUE
  FillBorn = TRUE
SPECIFICATION Spec
INVARIANT NoFreedStoredRead ReaderWindow NoUnderflow ZeroStored CountsCover CountsExact HoleKeeps NoLeak OneFillRecord
PROPERTY Collected
