\* Journal-hole.cfg with reads that fill R2 and C2: the store loses one
\* block while fill records for blocks it lacked net with the journal.
CONSTANTS
  Writers = {a}
  MaxTxns = 3
  Grace = 1
  Window = 0
  Lease = 0
  MaxHoles = 1
  MainRoots = {"R2", "R3", "N"}
  StageRoots = {"R2"}
  Reader = FALSE
  Ripe = TRUE
  Revive = TRUE
  HoldMark = TRUE
  Reripen = TRUE
  Held = TRUE
  HoleStop = TRUE
  Reput = FALSE
  CAS = TRUE
  PutPair = TRUE
  Runs = {}
  MaxOpens = 0
  RunCheck = TRUE
  Claim = TRUE
  BornMark = TRUE
  RootMark = TRUE
  Stage = FALSE
  Rehold = TRUE
  StageCAS = TRUE
  Sessions = FALSE
  SessionGrace = TRUE
  Skips = FALSE
  BornDown = TRUE
  Staged = FALSE
  ReleaseUnlisted = TRUE
  FillBlocks = {"R2", "C2"}
  FillUps = TRUE
  Holds = FALSE
  FillBorn = TRUE
  FillEager = TRUE
  CutList = FALSE
  Gen = TRUE
  RewriteFlag = TRUE
  Recount = TRUE
  ClearMark = TRUE
  Suspect = TRUE
  SuspectLand = TRUE
  SuspectRecount = TRUE
  SuspectEarly = TRUE
SPECIFICATION Spec
INVARIANT NoFreedStoredRead ReaderWindow NoUnderflow ZeroStored CountsCover CountsExact NoLeak OneFillRecord
