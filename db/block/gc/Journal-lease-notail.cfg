\* Journal-lease.cfg with TailCheck FALSE, so a mutant of a guard the tail check
\* also covers (Ripe, ChildRipe, HoldMark) still shows that guard is needed.
CONSTANTS
  Writers = {a}
  MaxTxns = 3
  Grace = 2
  Window = 1
  Lease = 0
  MaxHoles = 0
  MainRoots = {"R2", "R3", "N"}
  StageRoots = {"R2", "C"}
  Reader = TRUE
  Ripe = TRUE
  Revive = TRUE
  HoldMark = TRUE
  Reripen = TRUE
  Held = TRUE
  HoleStop = TRUE
  Reput = FALSE
  CAS = TRUE
  PutPair = TRUE
  Runs = {}
  MaxOpens = 0
  RunCheck = TRUE
  Claim = TRUE
  BornMark = TRUE
  RootMark = TRUE
  Stage = FALSE
  Rehold = TRUE
  StageCAS = TRUE
  Sessions = FALSE
  SessionGrace = TRUE
  Skips = FALSE
  BornDown = TRUE
  Staged = FALSE
  ReleaseUnlisted = TRUE
  FillBlocks = {}
  FillUps = TRUE
  Holds = FALSE
  FillBorn = TRUE
  FillEager = TRUE
  CutList = FALSE
  Gen = TRUE
  RewriteFlag = TRUE
  Recount = TRUE
  ChildRipe = FALSE
  RogueBlocks = {}
  TailCheck = FALSE
  HoldToFree = TRUE
SPECIFICATION Spec
INVARIANT NoFreedRead ReaderWindow NoUnderflow ZeroStored CountsCover CountsExact HoleKeeps NoLeak NoLiveListsFreed
