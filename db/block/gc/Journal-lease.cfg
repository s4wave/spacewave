  MaxNow = 3
  Grace = 2
  Window = 1
  Lease = 0
  MaxHoles = 0
  MainRoots = {"R2", "R3", "N"}
  StageRoots = {"R2", "C"}
  Reader = TRUE
  TailCheck = TRUE
  Held = TRUE
  HoleStop = TRUE
  Reput = FALSE
  CAS = TRUE
  PutPair = TRUE
  Runs = {}
  MaxOpens = 0
  RunCheck = TRUE
  Claim = TRUE
  BornMark = TRUE
  RootMark = TRUE
  Stage = FALSE
  Rehold = TRUE
  StageCAS = TRUE
  Sessions = FALSE
  SessionGrace = TRUE
  Skips = FALSE
  BornDown = TRUE
  Staged = FALSE
  ReleaseUnlisted = TRUE
SPECIFICATION Spec
INVARIANT NoFreedRead ReaderWindow NoUnderflow ZeroStored CountsCover CountsExact HoleKeeps NoLeak
