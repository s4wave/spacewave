\* A stage owner builds S over T under leased roots while its renewal may
\* stall for any time, any lapsed lease may be swept, and the World writer
\* publishes S onto main. Land refuses nothing it would not in Go: the stage's
\* writes rest on renewal holding a swept root again and on each release
\* carrying the owner's own record as its Previous.
CONSTANTS
  Writers = {a}
  MaxTxns = 5
  MaxNow = 6
  Grace = 2
  Window = 0
  Lease = 1
  MaxHoles = 0
  MainRoots = {"N"}
  StageRoots = {}
  Reader = FALSE
  TailCheck = TRUE
  Held = TRUE
  HoleStop = TRUE
  Reput = FALSE
  CAS = TRUE
  PutPair = TRUE
  Runs = {}
  MaxOpens = 0
  RunCheck = TRUE
  Claim = TRUE
  BornMark = TRUE
  RootMark = TRUE
  Stage = TRUE
  Rehold = TRUE
  StageCAS = TRUE
  Sessions = FALSE
  SessionGrace = TRUE
  Skips = FALSE
  BornDown = TRUE
  Staged = FALSE
  ReleaseUnlisted = TRUE
SPECIFICATION Spec
INVARIANT NoFreedRead ReaderWindow NoUnderflow ZeroStored CountsCover CountsExact HoleKeeps NoLeak StageKept
