\* The second writer. Journal-window.cfg with R3 -> C among main's roots:
\* main moves R1 -> R2, so R1 dies and C keeps R1's count, and once R1 is
\* Dead a commit moves main to R3, whose found pair onto C is journaled
\* while C still holds R1's count, so it raises no hold mark. R1's free
\* then releases C to zero with that up not netted yet. C must not free
\* before the up nets: with InheritRipe, C takes R1's passed sequence and
\* frees under R3. Early ups must pass this trace with the up cursor ahead.
CONSTANTS
  Writers = {a}
  MaxTxns = 2
  Grace = 1
  Window = 0
  Lease = 0
  MaxHoles = 0
  MainRoots = {"R1", "R2", "R3"}
  StageRoots = {}
  Reader = FALSE
  Ripe = TRUE
  Revive = TRUE
  HoldMark = TRUE
  Reripen = TRUE
  Held = TRUE
  HoleStop = TRUE
  Reput = FALSE
  CAS = TRUE
  PutPair = TRUE
  Runs = {}
  MaxOpens = 0
  RunCheck = TRUE
  Claim = TRUE
  BornMark = TRUE
  RootMark = TRUE
  Stage = FALSE
  Rehold = TRUE
  StageCAS = TRUE
  Sessions = FALSE
  SessionGrace = TRUE
  Skips = FALSE
  BornDown = TRUE
  Staged = FALSE
  ReleaseUnlisted = TRUE
  FillBlocks = {}
  FillUps = TRUE
  Holds = TRUE
  FillBorn = TRUE
  FillEager = TRUE
  CutList = TRUE
  Gen = TRUE
  RewriteFlag = TRUE
  Recount = TRUE
  PutRecount = TRUE
  LandCheck = TRUE
  FillBarrier = TRUE
  FillLanded = TRUE
  PunchGuard = TRUE
  AdoptDirty = TRUE
  FlipFills = TRUE
  RebirthDown = TRUE
  UnmarkedRefuse = TRUE
  Grey = TRUE
  Stop = TRUE
  WalkSkip = {}
  ReplacedSkip = "off"
  CutInit = {}
  HoleBlock = TRUE
  Accepts = FALSE
  RootWalk = TRUE
  FrontPop = "push"
  HoldFound = TRUE
  FlipSettled = TRUE
  ParkAbsent = TRUE
  RunAtFlip = TRUE
  PopRecount = TRUE
  RunScan = "off"
  FlipReleased = TRUE
  HoldDue = TRUE
  FlipFront = TRUE
  ScanOrder = "down"
  ReholdFront = TRUE
  ParkPut = "repark"
  RunBlocks = {"R1", "C", "E", "F", "G"}
  RecountFront = TRUE
  FlipDead = FALSE
  FlipHoldMark = TRUE
  DeadHide = "off"
  FreeRelease = TRUE
  InheritRipe = FALSE
  FreeWhole = TRUE
  FoundMark = TRUE
  FoundSkip = FALSE
SPECIFICATION Spec
INVARIANT NoFreedRead NoFreedStoredRead PoppedRipe VouchMarked FrontCovers ZeroStored NoUnderflow CountsExact HeldByLister
PROPERTY PoppedRipeFlip
