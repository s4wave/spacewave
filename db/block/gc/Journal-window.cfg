\* The window between the flip and a free. Adopted from the start over whole
\* lists, main on R1 -> C -> {E, F}, F -> G. The walk verifies R1 and pushes
\* C; a commit moves main to R2 -> C2 -> F, so R1, C and E die and the front
\* pops C and E; the flip takes them while R1, verified and Dead, stays
\* listed. HoldStored then moves main back onto R1. With FlipDead the flip
\* takes R1 too, so the move must put it again.
