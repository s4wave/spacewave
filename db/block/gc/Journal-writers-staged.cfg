\* Journal-writers.cfg with sessions that may outlast Grace, each written
\* under a stage: the stage pins the observed head, holds each put as it
\* lands, and is released when main moves onto the tree. A session the
\* transaction bound strands can take no step, which is not a deadlock of
\* the Volume. Main moves onto R2 and R3 only: with the empty tree N as
\* well, four transactions took 65 minutes on eight cores. Journal-writers.cfg
\* writes N.
CONSTANTS
  Writers = {a}
  MaxTxns = 4
  Grace = 1
  Window = 0
  Lease = 0
  MaxHoles = 0
  MainRoots = {"R2", "R3"}
  StageRoots = {}
  Reader = FALSE
  Ripe = TRUE
  Revive = TRUE
  HoldMark = TRUE
  Reripen = TRUE
  Held = TRUE
  HoleStop = TRUE
  Reput = FALSE
  CAS = TRUE
  PutPair = TRUE
  Runs = {}
  MaxOpens = 0
  RunCheck = TRUE
  Claim = TRUE
  BornMark = TRUE
  RootMark = TRUE
  Stage = FALSE
  Rehold = TRUE
  StageCAS = TRUE
  Sessions = TRUE
  SessionGrace = FALSE
  Skips = FALSE
  BornDown = TRUE
  Staged = TRUE
  ReleaseUnlisted = TRUE
  FillBlocks = {}
  FillUps = TRUE
  Holds = FALSE
  FillBorn = TRUE
  FillEager = TRUE
  CutList = FALSE
  Gen = TRUE
  RewriteFlag = TRUE
  Recount = TRUE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT NoFreedRead NoUnderflow ZeroStored CountsCover CountsExact HoleKeeps NoLeak
