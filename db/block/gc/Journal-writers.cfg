\* A World writer commits in one SetRoots, or writes a tree in a session of
\* several: batches in any order, a parent before its child, a block already
\* stored put again, and the root move last, within Grace of the start.
\* Land refuses no child, as the Go Land does not. A put with no holder in
\* its batch keeps its implied holder for good, so the counts may exceed
\* the holders, and CountsExact and NoLeak are not checked.
CONSTANTS
  Writers = {a}
  MaxTxns = 3
  MaxNow = 2
  Grace = 1
  Window = 0
  Lease = 0
  MaxHoles = 0
  MainRoots = {"R2", "R3", "N"}
  StageRoots = {}
  Reader = FALSE
  TailCheck = TRUE
  Held = TRUE
  HoleStop = TRUE
  Reput = FALSE
  CAS = TRUE
  PutPair = TRUE
  Runs = {}
  MaxOpens = 0
  RunCheck = TRUE
  Claim = TRUE
  BornMark = TRUE
  RootMark = TRUE
  Stage = FALSE
  Rehold = TRUE
  StageCAS = TRUE
  Sessions = TRUE
  SessionGrace = TRUE
  Skips = FALSE
SPECIFICATION Spec
INVARIANT NoFreedRead NoUnderflow ZeroStored CountsCover HoleKeeps
