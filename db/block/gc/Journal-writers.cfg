\* A World writer commits in one SetRoots, or writes a tree in a session of
\* several: batches in any order, a parent before its child, a block already
\* stored put again, and the root move last, within Grace of the start.
\* Land refuses no child, as the Go Land does not, and a block born with no
\* holder in its batch journals a down for its implied holder, so the counts
\* stay exact and an unheld put is collected once that down ages Grace.
\* Two transactions: three did not finish in 75 minutes on eight cores.
\* Each mutant of this config fails at two but the noreripen one, which
\* needs a third; Journal-fill-writers.cfg checks Reripen at four.
CONSTANTS
  Writers = {a}
  MaxTxns = 2
  Grace = 1
  Window = 0
  Lease = 0
  MaxHoles = 0
  MainRoots = {"R2", "R3", "N"}
  StageRoots = {}
  Reader = FALSE
  Ripe = TRUE
  Revive = TRUE
  HoldMark = TRUE
  Reripen = TRUE
  Held = TRUE
  HoleStop = TRUE
  Reput = FALSE
  CAS = TRUE
  PutPair = TRUE
  Runs = {}
  MaxOpens = 0
  RunCheck = TRUE
  Claim = TRUE
  BornMark = TRUE
  RootMark = TRUE
  Stage = FALSE
  Rehold = TRUE
  StageCAS = TRUE
  Sessions = TRUE
  SessionGrace = TRUE
  Skips = FALSE
  BornDown = TRUE
  Staged = FALSE
  ReleaseUnlisted = TRUE
  FillBlocks = {}
  FillUps = TRUE
  Holds = FALSE
  FillBorn = TRUE
  FillEager = TRUE
  CutList = FALSE
  Gen = TRUE
  RewriteFlag = TRUE
  Recount = TRUE
  ClearMark = TRUE
  Suspect = TRUE
  SuspectLand = TRUE
  SuspectRecount = TRUE
  SuspectEarly = TRUE
SPECIFICATION Spec
INVARIANT NoFreedRead NoUnderflow ZeroStored CountsCover CountsExact HoleKeeps NoLeak
