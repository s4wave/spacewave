\* Two World writers race to move main by compare and swap while one stages a
\* tree over the head it saw and the World writer adopts it, in four
\* transactions; the collector nets every split of the journal into
\* intervals. No reader and no hole.
CONSTANTS
  Writers = {a, b}
  MaxTxns = 4
  MaxNow = 3
  Grace = 1
  Window = 0
  Lease = 0
  MaxHoles = 0
  MainRoots = {"R1", "R2", "R3", "N"}
  StageRoots = {"R2"}
  Reader = FALSE
  TailCheck = TRUE
  Held = TRUE
  Refuse = TRUE
  HoleStop = TRUE
  Reput = FALSE
  CAS = TRUE
  Runs = {}
  MaxOpens = 0
  RunCheck = TRUE
  Claim = TRUE
  BornMark = TRUE
  RootMark = TRUE
  Stage = FALSE
  Rehold = TRUE
  StageCAS = TRUE
SPECIFICATION Spec
SYMMETRY Perms
INVARIANT NoFreedRead ReaderWindow NoUnderflow ZeroStored CountsCover CountsExact HoleKeeps NoLeak
