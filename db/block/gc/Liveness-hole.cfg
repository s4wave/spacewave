\* Review R4: a is stored and queued at zero and names the hole d. A batch may
\* put a again with d, which F1's held check takes as held by a, or with a
\* new block c that names a, and main or the stage may move onto a.
CONSTANTS
  Shape = "hole"
  Writers = {"main", "stg"}
  Reader = FALSE
  MaxTxns = 3
  Grace = 1
  Window = 0
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT NoFreedRead ReaderWindow HoldUntilFree CountsExact NoUnderflow NoLateNamer
PROPERTY FreesProgress EventuallyCollected
