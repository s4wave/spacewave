\* A reader that observes main and may pin it within Window while main moves
\* between the two versions, Window less than Grace.
CONSTANTS
  Shape = "share"
  Writers = {"main"}
  Reader = TRUE
  MaxTxns = 3
  Grace = 1
  Window = 0
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT NoFreedRead ReaderWindow HoldUntilFree CountsExact NoUnderflow NoLateNamer
PROPERTY FreesProgress EventuallyCollected
