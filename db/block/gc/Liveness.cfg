\* Two versions that share a two-deep subtree, a main root and a stage that
\* each move, and three transactions.
CONSTANTS
  Shape = "share"
  Writers = {"main", "stg"}
  Reader = FALSE
  MaxTxns = 3
  Grace = 1
  Window = 0
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT NoFreedRead ReaderWindow HoldUntilFree CountsExact NoUnderflow NoLateNamer
PROPERTY FreesProgress EventuallyCollected
