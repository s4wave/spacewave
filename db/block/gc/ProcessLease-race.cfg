\* One root, three leases and two renewers: the smallest model in which two
\* renewers starting together leave a held root to the collector. Only the
\* release check runs, so a mutant that drops the renew lock shows the data
\* loss itself and not the earlier LiveHolds break.
CONSTANTS
  Roots = {a}
  MaxLeases = 3
  Renewers = {w1, w2}
  NoRenewer = none
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT TypeOK NoReleaseUnderLiveProcess
