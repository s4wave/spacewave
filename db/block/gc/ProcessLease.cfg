\* Two roots, four leases and two renewers: enough for a recovery after a
\* partial release, another after it, and two renewers starting together.
CONSTANTS
  Roots = {a, b}
  MaxLeases = 4
  Renewers = {w1, w2}
  NoRenewer = none
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT TypeOK LiveHolds ReleasedLapsed IndexExact RootsOnRecords StoredAlive NoReleaseUnderLiveProcess InMemUnderOwnLease
