\* The Settle-reopen configs with g and n both, and with no read resolving h
\* or k once the Volume lacks them: a reopen whose copied list lacks a child
\* the sweep freed holds the flip on that child while anything holds it, so
\* only safety is checked.
CONSTANTS
  MaxTxns = 3
  Upgrade = FALSE
  Lost = {"h", "k"}
  WriteOffs = {}
  Extra = {"g", "n"}
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT SettledLive HeldPresent SelfRetiring
