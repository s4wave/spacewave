\* An old Volume whose root's subtree has a cut list and a block it lacks
\* above a stored one, an unreachable old block g with a cut list, a block n a
\* writer may write, and a writer that may put or move twice. The format
\* upgrade is checked in the Settle-upgrade configs, which bound g and n.
CONSTANTS
  MaxTxns = 2
  Upgrade = FALSE
  Lost = {}
  Extra = {"g", "n"}
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT LiveStored HeldPresent ReachedShown SelfRetiring
PROPERTY EventuallySettled
