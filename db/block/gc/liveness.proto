syntax = "proto3";
package block.gc;

// RootEntry is one named root in a Volume's root table: the block the name
// holds.
message RootEntry {
  // Ref is the block the name holds, as its hash type byte and digest.
  bytes ref = 1;
  // ExpiresUnixMilli is when the collector releases the root itself, in Unix
  // milliseconds. Zero holds the root until a writer releases it. A holder
  // renews a leased root by setting it again with a later expiry.
  int64 expires_unix_milli = 2;
}

// Adoption is whether a Volume's counts describe its blocks.
enum Adoption {
  // ADOPTION_UNADOPTED is a Volume written before its child lists were
  // complete. It keeps no logs and frees nothing.
  ADOPTION_UNADOPTED = 0;
  // ADOPTION_ADOPTING is a Volume whose counts an adoption is building. It
  // keeps the logs and frees nothing.
  ADOPTION_ADOPTING = 1;
  // ADOPTION_ADOPTED is a Volume whose counts and logs describe every
  // holder. Its collector frees when its switch is on.
  ADOPTION_ADOPTED = 2;
}

// Generation is how far a Volume has settled the blocks an older store
// format left, whose child lists may lack a child the block names. Each
// state is one value; nothing else of the settle remains once it is Settled.
enum Generation {
  // GENERATION_SETTLED is a Volume whose every stored list was written from
  // its block's content, or whose unwritten ones are gone. A Volume created
  // in this format starts here, and frees run here only.
  GENERATION_SETTLED = 0;
  // GENERATION_OPEN is a Volume holding old blocks. Nothing frees. Land and
  // fills push each unverified child they hold onto the front, and the
  // settle walk decodes old blocks and writes their lists from content.
  // The value is 1 so a store format 7 Volume's unverified lists mark,
  // the bool true field 7 held, reads as Open.
  GENERATION_OPEN = 1;
  // GENERATION_SWEEPING is a Volume whose flip unmarked every old block
  // still unverified: each unmarked block answers absent, and a background
  // slice deletes it and releases its children.
  GENERATION_SWEEPING = 2;
}

// LivenessState is the one record of a Volume's log positions and
// adoption.
//
// The up log ('u') holds pages of blocks that gained a holder beyond the
// one a stored block implies, one sequence each. The down log ('d') holds
// pages of blocks that lost one, keyed by sequence, each carrying its commit
// time. The collector nets the up log promptly and a down page once it is
// Grace old, only in a slice that drained the up log, so a down never lands
// before an up that preceded it.
message LivenessState {
  reserved 2, 3, 4, 5, 8, 9, 10, 12, 13, 14, 17;
  reserved "next_seq", "cursor", "net_offset", "legacy_graph", "hold_mark", "cascades", "hold_rule", "adopt_mark";
  // Adoption is whether the counts describe the Volume's blocks.
  Adoption adoption = 1;
  // AdoptionRun names the adoption that marked the Volume adopting, or the
  // one that abandoned it. Each transaction of an adoption refuses to write
  // unless the Volume is still in its run, so a run another superseded writes
  // nothing more.
  string adoption_run = 6;
  // Generation is how far the Volume has settled its old blocks. A Land,
  // fill or walk that writes a child list from content marks it so, as
  // Records describes, while the generation is not Settled.
  Generation generation = 7;
  // Release is the paged release in progress of the children of one freed
  // block, unset when none is.
  Release release = 11;
  // Frees is whether the collector's frees were on at the last writable
  // open, or at the birth of an empty Volume. The write that turns it on
  // also returns the Volume to unadopted, so an adoption counts every holder
  // again before the first free; a writable open with frees off clears it,
  // so the next switch-on counts again (SetFrees). It reads as off unless
  // frees_mark matches the record.
  bool frees = 15;
  // FreesMark is a hash of the record's other known fields, which every
  // write of this format computes. A build that predates it keeps it as an
  // unknown field and cannot recompute it, so any state write by such a
  // build leaves it stale, and the record then reads as frees off: the next
  // switch-on counts again after a writer that knew nothing of the switch.
  // It sees every write a recount would correct, because Land is the one
  // writer of holders: a Land that adds or drops a holder outside the blocks
  // its own batch stores first writes a log page and this record, while a
  // batch's new blocks carry exactly the counts any build's Land gives them.
  // An older build's open of an adopted Volume writes nothing. A later field
  // that is not zero changes the hash input, so a build that reads it as
  // unknown sees the mark stale and forces one more recount, which fails
  // safe.
  uint64 frees_mark = 16;
  // UpSeq is the sequence the next up page takes. A block that reaches zero
  // holders takes it as its ripe sequence.
  uint64 up_seq = 18;
  // UpCursor is the sequence of the oldest up page the collector has not
  // netted. A block at zero frees only once the cursor reaches its ripe
  // sequence, so every up written before it reached zero has netted.
  uint64 up_cursor = 19;
  // DownSeq is the sequence the next down page takes. It orders pages that
  // share a commit time and lets the adoption drop the pages before its
  // mark.
  uint64 down_seq = 20;
  // AdoptAtUnixMilli is the wall time of the last adoption's mark, in Unix
  // milliseconds. A block the adoption settles may be a head a reader saw
  // before the mark, whose move off it the dropped logs carried, so the
  // collector frees, pops and flips nothing until Grace has passed since
  // this time. Only Adopt's mark transaction writes it.
  int64 adopt_at_unix_milli = 21;
  // ObsoleteKinds are the record kinds under the liveness prefix that an
  // older store format wrote and this one neither writes nor reads, one
  // byte each, which a background sweep deletes in slices, dropping each
  // kind once none of its records remain. None is a block, a block's bytes
  // or a child list.
  bytes obsolete_kinds = 22;
  // AdoptCursor is how far the adoption in progress has counted, set only
  // while the Volume is adopting. Each slice of the count writes it in the
  // transaction that writes the slice's counts, so a run that takes the
  // Volume over continues strictly after the last key it names.
  AdoptCursor adopt_cursor = 23;
}

// AdoptPhase is the pass an adoption is in. The passes run in this order.
enum AdoptPhase {
  // ADOPT_PHASE_ROOTS counts each root at the block it held at the mark.
  ADOPT_PHASE_ROOTS = 0;
  // ADOPT_PHASE_CHILDREN counts the children of each block stored at the
  // mark.
  ADOPT_PHASE_CHILDREN = 1;
  // ADOPT_PHASE_SETTLE writes each stored block's holders, queuing a block
  // with none. Its last slice marks the Volume adopted.
  ADOPT_PHASE_SETTLE = 2;
}

// AdoptCursor is the position of an adoption and what it has counted so
// far, as AdoptResult reports it.
message AdoptCursor {
  // Phase is the pass in progress.
  AdoptPhase phase = 1;
  // After is the last key the pass finished: a root name in the roots pass,
  // a block key in the others. Empty starts the pass at its first key.
  bytes after = 2;
  // Blocks counts the stored blocks settled so far.
  uint64 blocks = 3;
  // Roots counts the named roots counted so far.
  uint64 roots = 4;
  // Counted counts the settled blocks with more than one holder.
  uint64 counted = 5;
  // Queued counts the settled blocks queued at zero.
  uint64 queued = 6;
  // Unknown counts the holders of blocks stored without a child list.
  uint64 unknown = 7;
  // Run is the adoption run that wrote the cursor. A run takes the cursor
  // over only when it names the run the state names in the same
  // transaction: a build without the cursor carries it through a claim of
  // its own as an unknown field, and its counts are not the cursor's.
  string run = 8;
}

// Release is the release of the children of a freed block whose child list
// is longer than one collector slice moves. The slice that frees the block
// moves the list to release pages; each later slice drops the next
// children's holders by one and moves Next in the same transaction, and the
// last deletes the pages and clears the release.
message Release {
  reserved 4;
  reserved "rehold";
  // Block is the block, as its hash type byte and digest.
  bytes block = 1;
  // Next is the index in the list of the first child not moved yet.
  uint64 next = 2;
  // Children is how many children the list names.
  uint64 children = 3;
}
