\* Journal-lease.cfg under HoldToFree with ChildRipe: a child a free's
\* release takes to zero is freed at its parent's ripe point. Expected to
\* fail NoFreedRead: a root that moved onto the child while its parent sat at
\* zero has not netted when the child is freed. TailCheck is FALSE: the tail
\* check alone keeps a child the unnetted root names.
CONSTANTS
  Writers = {a}
  MaxTxns = 3
  Grace = 2
  Window = 1
  Lease = 0
  MaxHoles = 0
  MainRoots = {"R2", "R3", "N"}
  StageRoots = {"R2", "C"}
  Reader = TRUE
  Ripe = TRUE
  Revive = TRUE
  HoldMark = TRUE
  Reripen = TRUE
  Held = TRUE
  HoleStop = TRUE
  Reput = FALSE
  CAS = TRUE
  PutPair = TRUE
  Runs = {}
  MaxOpens = 0
  RunCheck = TRUE
  Claim = TRUE
  BornMark = TRUE
  RootMark = TRUE
  Stage = FALSE
  Rehold = TRUE
  StageCAS = TRUE
  Sessions = FALSE
  SessionGrace = TRUE
  Skips = FALSE
  BornDown = TRUE
  Staged = FALSE
  ReleaseUnlisted = TRUE
  FillBlocks = {}
  FillUps = TRUE
  Holds = FALSE
  FillBorn = TRUE
  FillEager = TRUE
  CutList = FALSE
  Gen = TRUE
  RewriteFlag = TRUE
  Recount = TRUE
  ChildRipe = TRUE
  RogueBlocks = {}
  TailCheck = FALSE
  HoldToFree = TRUE
SPECIFICATION Spec
INVARIANT NoFreedRead
