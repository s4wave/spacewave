\* Journal.cfg with Revive FALSE: a released block that gains a holder
\* goes Live without re-holding its children, so a child's count misses
\* that holder: CountsCover fails. CountsExact is left out because it
\* fails first on the same defect.
CONSTANTS
  Writers = {a, b}
  MaxTxns = 4
  Grace = 1
  Window = 0
  Lease = 0
  MaxHoles = 0
  MainRoots = {"R1", "R2", "R3", "N"}
  StageRoots = {"R2"}
  Reader = FALSE
  Ripe = TRUE
  Revive = FALSE
  HoldMark = TRUE
  Reripen = TRUE
  Held = TRUE
  HoleStop = TRUE
  Reput = FALSE
  CAS = TRUE
  PutPair = TRUE
  Runs = {}
  MaxOpens = 0
  RunCheck = TRUE
  Claim = TRUE
  BornMark = TRUE
  RootMark = TRUE
  Stage = FALSE
  Rehold = TRUE
  StageCAS = TRUE
  Sessions = FALSE
  SessionGrace = TRUE
  Skips = FALSE
  BornDown = TRUE
  Staged = FALSE
  ReleaseUnlisted = TRUE
  FillBlocks = {}
  FillUps = TRUE
  Holds = FALSE
  FillBorn = TRUE
  FillEager = TRUE
SPECIFICATION Spec
SYMMETRY Perms
INVARIANT NoFreedRead ReaderWindow NoUnderflow ZeroStored CountsCover HoleKeeps NoLeak
