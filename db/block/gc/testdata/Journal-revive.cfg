\* Journal.cfg with one writer and a root move onto a stored block without a
\* put (Holds), under the collector as it stands (HoldToFree FALSE): R2 dies
\* under main's move back to R1, its release frees C2 before R2, main moves
\* onto R2 without putting its tree, and the re-hold leaves R2 Live over the
\* freed C2. NoLiveListsFreed fails; NoFreedRead is left out because it fails
\* at the move on the same defect.
CONSTANTS
  Writers = {a}
  MaxTxns = 3
  Grace = 1
  Window = 0
  Lease = 0
  MaxHoles = 0
  MainRoots = {"R1", "R2"}
  StageRoots = {}
  Reader = FALSE
  Ripe = TRUE
  Revive = TRUE
  HoldMark = TRUE
  Reripen = TRUE
  Held = TRUE
  HoleStop = TRUE
  Reput = FALSE
  CAS = TRUE
  PutPair = TRUE
  Runs = {}
  MaxOpens = 0
  RunCheck = TRUE
  Claim = TRUE
  BornMark = TRUE
  RootMark = TRUE
  Stage = FALSE
  Rehold = TRUE
  StageCAS = TRUE
  Sessions = FALSE
  SessionGrace = TRUE
  Skips = FALSE
  BornDown = TRUE
  Staged = FALSE
  ReleaseUnlisted = TRUE
  FillBlocks = {}
  FillUps = TRUE
  Holds = TRUE
  FillBorn = TRUE
  FillEager = TRUE
  CutList = FALSE
  Gen = TRUE
  RewriteFlag = TRUE
  Recount = TRUE
  ChildRipe = FALSE
  RogueBlocks = {}
  TailCheck = TRUE
  HoldToFree = FALSE
SPECIFICATION Spec
INVARIANT NoLiveListsFreed
