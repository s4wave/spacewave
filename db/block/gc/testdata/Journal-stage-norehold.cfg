  Held = TRUE
  Refuse = FALSE
  HoleStop = TRUE
  Reput = FALSE
  CAS = TRUE
  Runs = {}
  MaxOpens = 0
  RunCheck = TRUE
  Claim = TRUE
  BornMark = TRUE
  RootMark = TRUE
  Stage = TRUE
  Rehold = FALSE
  StageCAS = TRUE
SPECIFICATION Spec
INVARIANT StageKept
