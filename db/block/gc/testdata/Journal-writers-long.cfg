\* Journal-writers-staged.cfg with its sessions unstaged: a session that
\* outlasts Grace holds nothing. Fails NoFreedRead.
CONSTANTS
  Writers = {a}
  MaxTxns = 4
  MaxNow = 3
  Grace = 1
  Window = 0
  Lease = 0
  MaxHoles = 0
  MainRoots = {"R2", "R3", "N"}
  StageRoots = {}
  Reader = FALSE
  TailCheck = TRUE
  Held = TRUE
  HoleStop = TRUE
  Reput = FALSE
  CAS = TRUE
  PutPair = TRUE
  Runs = {}
  MaxOpens = 0
  RunCheck = TRUE
  Claim = TRUE
  BornMark = TRUE
  RootMark = TRUE
  Stage = FALSE
  Rehold = TRUE
  StageCAS = TRUE
  Sessions = TRUE
  SessionGrace = FALSE
  Skips = FALSE
  BornDown = TRUE
  Staged = FALSE
  ReleaseUnlisted = TRUE
SPECIFICATION Spec
INVARIANT NoFreedRead
