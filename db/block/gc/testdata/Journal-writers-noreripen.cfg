\* Journal-writers.cfg with main narrowed to R2 and Reripen FALSE: a put
\* again of a block that stays at zero keeps its first ripe sequence, and the
\* block is freed under the root move of the session that put it
\* (NoFreedRead).
CONSTANTS
  Writers = {a}
  MaxTxns = 3
  Grace = 1
  Window = 0
  Lease = 0
  MaxHoles = 0
  MainRoots = {"R2", "N"}
  StageRoots = {}
  Reader = FALSE
  Ripe = TRUE
  Revive = TRUE
  HoldMark = TRUE
  Reripen = FALSE
  Held = TRUE
  HoleStop = TRUE
  Reput = FALSE
  CAS = TRUE
  PutPair = TRUE
  Runs = {}
  MaxOpens = 0
  RunCheck = TRUE
  Claim = TRUE
  BornMark = TRUE
  RootMark = TRUE
  Stage = FALSE
  Rehold = TRUE
  StageCAS = TRUE
  Sessions = TRUE
  SessionGrace = TRUE
  Skips = FALSE
  BornDown = TRUE
  Staged = FALSE
  ReleaseUnlisted = TRUE
  FillBlocks = {}
  FillUps = TRUE
  Holds = FALSE
  FillBorn = TRUE
  FillEager = TRUE
  CutList = FALSE
  Gen = TRUE
  RewriteFlag = TRUE
  Recount = TRUE
  ClearMark = TRUE
  Suspect = TRUE
  SuspectLand = TRUE
  SuspectRecount = TRUE
  SuspectEarly = TRUE
SPECIFICATION Spec
INVARIANT NoFreedRead NoUnderflow ZeroStored CountsCover CountsExact HoleKeeps NoLeak
