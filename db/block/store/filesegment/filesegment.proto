syntax = "proto3";
package block.store.filesegment;

import "github.com/s4wave/spacewave/db/block/block.proto";

// Segment is a byte range of a file on this Device whose bytes, encoded with
// the Space's transform, were a block when the file was linked. It is the
// SegmentIndex value of one ref in one path.
message Segment {
  // Path is the file's absolute path on this Device.
  string path = 1;
  // Offset is the range's first byte in the file.
  int64 offset = 2;
  // Length is the range's length in bytes.
  int64 length = 3;
  // ModTime is the file's modification time when it was linked, in Unix
  // nanoseconds.
  int64 mod_time = 4;
  // Size is the file's size when it was linked.
  int64 size = 5;
  // BlockSize is the length of the range's encoded block, which a stat of the
  // block reports without reading the file.
  int64 block_size = 6;
}

// FolderVersion is the Drive version of one file of a two-way linked folder
// that the folder's node last published from the folder or applied to it, with
// the stat of the file on disk that held it then. A Drive file whose node
// differs from it changed in the Drive, and a folder file whose stat differs
// from it changed on disk.
message FolderVersion {
  // NodeRef is the reference of the file's node in the Drive.
  .block.BlockRef node_ref = 1;
  // Size is the file's size.
  int64 size = 2;
  // ModTime is the file's modification time, in Unix nanoseconds.
  int64 mod_time = 3;
  // Mode is the file's permission bits.
  uint32 mode = 4;
  // Digest is the SHA-256 of the file's bytes, empty when no read proved
  // them. Only a file with this digest holds the version.
  bytes digest = 5;
}

// PathRefs is the SegmentIndex value of one path: the refs its segments hold,
// so a changed path drops its entries in one write.
message PathRefs {
  // Refs are the distinct refs of the path's segments.
  repeated .block.BlockRef refs = 1;
}
