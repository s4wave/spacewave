syntax = "proto3";
package dex.solicit;

import "github.com/s4wave/spacewave/db/block/block.proto";

// DexMessage is a message sent over a DEX stream.
// Each message is a request, a response, a cancel or a prune. A request has a
// non-empty ref, or is a frontier request, and a zero-value response. A
// response has is_response and the response fields set. A cancel has cancel
// set and the request_id it withdraws. A prune has prune set, the request_id
// of a subtree request and the refs its requester holds.
//
// A response without more ends its request. A request with subtree_bytes set,
// for a ref the responder holds with its refs known, is answered by a stream:
// the response for ref with more set, then a response for each block under it
// the responder sends, each with its ref and more set, then a last response
// with neither, whose refs list, after a stop at the budget, the refs the
// walk left unsent. A frontier request has no ref, refs naming several roots and
// subtree_bytes set; it is answered by the same stream without the first
// response, walking the roots as if one block named them. Any other request
// is answered by one response.
message DexMessage {
  // RequestId is a unique ID for this request/response pair.
  // The requester picks a unique ID. The responder echoes it back.
  uint32 request_id = 1;
  // IsResponse indicates this is a response to a prior request.
  bool is_response = 2;
  // Ref is the block reference to look up (request only).
  .block.BlockRef ref = 3;
  // Found indicates whether the block was found (response only).
  bool found = 4;
  // Data is the block data (response only).
  bytes data = 5;
  // Error is an error message (response only).
  string error = 6;
  // RemainingHops limits forwarding to prevent loops.
  // When a node does not have the block locally and remaining_hops > 0,
  // it forwards the request to other connected peers with remaining_hops - 1.
  // Zero means no forwarding allowed (local lookup only).
  uint32 remaining_hops = 7;
  // Refs are the block's outgoing references when refs_known is set
  // (response). An empty list with refs_known set means a leaf. On a
  // frontier request they are the roots, on a stream's last response the
  // refs left at the budget, and on a prune the held refs.
  repeated .block.BlockRef refs = 8;
  // RefsKnown is false when the responder held the block without its
  // outgoing references (response only).
  bool refs_known = 9;
  // Cancel withdraws the request with request_id. The responder stops
  // handling it and sends no response. A cancel for a request that already
  // completed is ignored.
  bool cancel = 10;
  // LinkedOk lets the responder answer linked instead of sending the data of
  // a block that a linked file on its Device serves (request only). The
  // requester sets it only toward a peer whose linked answer it trusts.
  bool linked_ok = 11;
  // Linked answers a request with linked_ok: a linked file on the
  // responder's Device is its only copy there, so the response carries the
  // refs and no data (response only). It is never set on a forwarded lookup.
  bool linked = 12;
  // Denied answers a request whose requester lacks read access, with the
  // reason in error (response only). It says nothing of whether the
  // responder holds the block, so a grant makes the same request servable.
  bool denied = 13;
  // SubtreeBytes asks, besides the block at ref, for the blocks under it that
  // the responder holds with their refs known, depth first, up to this many
  // bytes of block data, which the responder may lower (request only). Zero
  // asks for the block alone.
  uint32 subtree_bytes = 14;
  // More marks a response that further responses to the same request follow
  // (response only).
  bool more = 15;
  // Prune lists, in refs, blocks under a subtree request's ref that its
  // requester holds, so the responder walks none of them (prune only).
  bool prune = 16;
}
