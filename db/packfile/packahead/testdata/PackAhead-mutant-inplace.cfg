\* PackAhead.cfg with SalvageOnOpen off: a restart in the same boot reads
\* the page cache, which shows batches a failed sync lost, and recovery
\* finalizes the old file in place. Its sync does not bring those pages back,
\* so a reboot loses blocks already receipted. Fails ReceiptedHeld. Check it
\* against ../PackAhead.tla.
CONSTANTS
  NBlocks = 3
  NPacks = 3
  Cap = 2
  MaxCrashes = 1
  DataCheck = TRUE
  RowAfterSync = TRUE
  EvictCheck = TRUE
  DurableSkip = TRUE
  PoisonCheck = TRUE
  SalvageOnOpen = FALSE
  PublishCheck = TRUE
  WriteFails = TRUE
  MaxRestarts = 1
SPECIFICATION Spec
INVARIANT TypeOK ReceiptedHeld RecoveredValid EvictedRegistered
CHECK_DEADLOCK FALSE
