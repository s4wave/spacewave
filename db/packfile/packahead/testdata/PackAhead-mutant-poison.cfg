\* PackAhead.cfg with PoisonCheck off: a pack whose sync failed is synced
\* and finalized again, and the later sync reports success for batches the
\* disk lost. Fails ReceiptedHeld. Check it against ../PackAhead.tla.
CONSTANTS
  NBlocks = 3
  NPacks = 3
  Cap = 2
  MaxCrashes = 1
  DataCheck = TRUE
  RowAfterSync = TRUE
  EvictCheck = TRUE
  DurableSkip = TRUE
  PoisonCheck = FALSE
  SalvageOnOpen = TRUE
  MaxRestarts = 1
SPECIFICATION Spec
INVARIANT TypeOK ReceiptedHeld RecoveredValid EvictedRegistered
CHECK_DEADLOCK FALSE
