\* PackAhead.cfg with PublishCheck off: a sync that ends after a write or
\* sync failed its pack still advances the mark and acks its batches, and
\* salvage reads the mark without waiting for it, so it drops batches whose
\* Appends then return nil. Fails ReceiptedHeld. Check it against
\* ../PackAhead.tla.
CONSTANTS
  NBlocks = 3
  NPacks = 3
  Cap = 2
  MaxCrashes = 1
  DataCheck = TRUE
  RowAfterSync = TRUE
  EvictCheck = TRUE
  DurableSkip = TRUE
  PoisonCheck = TRUE
  SalvageOnOpen = TRUE
  PublishCheck = FALSE
  WriteFails = TRUE
  MaxRestarts = 1
SPECIFICATION Spec
INVARIANT TypeOK ReceiptedHeld RecoveredValid EvictedRegistered
CHECK_DEADLOCK FALSE
