\* PackAhead.cfg with RetryCheck off: a finalize retried after a failed
\* directory sync recovers a failed pack from its renamed file again, which
\* truncates its index away. Fails ReceiptedHeld. Check it against
\* ../PackAhead.tla.
CONSTANTS
  NBlocks = 3
  NPacks = 3
  Cap = 2
  MaxCrashes = 1
  DataCheck = TRUE
  RowAfterSync = TRUE
  EvictCheck = TRUE
  DurableSkip = TRUE
  PoisonCheck = TRUE
  RetryCheck = FALSE
SPECIFICATION Spec
INVARIANT TypeOK ReceiptedHeld RecoveredValid EvictedRegistered
CHECK_DEADLOCK FALSE
