\* Commit resolves its keys under the writer lock in one batched descent,
\* after a restart with a cold cache, readers evicting pages and a saturated
\* overlay filter. The waits stay within bounds that do not grow with the
\* size of the big commit.
SPECIFICATION Spec
CONSTANT BigKeys = {1, 2, 3}
CONSTANT SmallKey = 3
CONSTANT CacheCap = 2
CONSTANT Pressure = TRUE
CONSTANT FalsePositive = TRUE
CONSTANT Mode = "batch"
CONSTANT CkptBound = 2
CONSTANT WriterBound = 4
INVARIANT Safety CheckpointWait WriterWait
PROPERTY Progress
