\* A background commit splits its keys into slices of one, each its own hold,
\* and queues again behind the waiters between slices. Under the lock it
\* reads one cold page per key, after a restart with a cold cache, readers
\* evicting pages and a saturated overlay filter. The waits stay within
\* bounds set by the slice, not by the size of the big commit.
SPECIFICATION Spec
CONSTANT BigKeys = {1, 2, 3}
CONSTANT SmallKey = 3
CONSTANT CacheCap = 2
CONSTANT Pressure = TRUE
CONSTANT FalsePositive = TRUE
CONSTANT Mode = "filter"
CONSTANT Slice = 1
CONSTANT CkptBound = 3
CONSTANT WriterBound = 5
INVARIANT Safety CheckpointWait WriterWait
PROPERTY Progress
