\* SuspectGate.cfg with Finish cancellable while it waits for assumers.
CONSTANTS
  Finishes = {f1, f2}
  Assumers = {a1, a2}
  Closers = {c1}
  Writers = {w1}
  Recheck = TRUE
  RunCheck = TRUE
  BumpFirst = TRUE
  DecFirst = TRUE
  Cancel = TRUE
SPECIFICATION Spec
INVARIANT ClosedClean AssumerSafe WriterSafe Counted
