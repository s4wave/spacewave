\* Two Finish calls, two optimistic fills, a closer and a writer holding
\* the store's writer, with no cancellation, so a lost wakeup deadlocks.
CONSTANTS
  Finishes = {f1, f2}
  Assumers = {a1, a2}
  Closers = {c1}
  Writers = {w1}
  Recheck = TRUE
  RunCheck = TRUE
  BumpFirst = TRUE
  DecFirst = TRUE
  Cancel = FALSE
SPECIFICATION Spec
INVARIANT ClosedClean AssumerSafe WriterSafe Counted
