\* SuspectGate.cfg with the gate opened after the assumers read zero: a fill
\* registers in between and is never waited for. Fails AssumerSafe.
CONSTANTS
  Finishes = {f1, f2}
  Assumers = {a1, a2}
  Closers = {c1}
  Writers = {w1}
  Recheck = TRUE
  RunCheck = TRUE
  BumpFirst = FALSE
  DecFirst = TRUE
  Cancel = FALSE
SPECIFICATION Spec
INVARIANT ClosedClean AssumerSafe WriterSafe Counted
