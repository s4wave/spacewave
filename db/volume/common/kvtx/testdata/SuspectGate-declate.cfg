\* SuspectGate.cfg with release loading the epoch before it decrements: it
\* sees the gate closed, a Finish opens it and waits, and the last release
\* never wakes it. Deadlocks.
CONSTANTS
  Finishes = {f1, f2}
  Assumers = {a1, a2}
  Closers = {c1}
  Writers = {w1}
  Recheck = TRUE
  RunCheck = TRUE
  BumpFirst = TRUE
  DecFirst = FALSE
  Cancel = FALSE
SPECIFICATION Spec
INVARIANT ClosedClean AssumerSafe WriterSafe Counted
