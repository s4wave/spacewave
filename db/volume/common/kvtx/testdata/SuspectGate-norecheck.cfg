\* SuspectGate.cfg without the re-check in assume: a fill that loaded a closed
\* gate registers after a Finish read no assumers, and skips suspect reads
\* while the Finish writes. Fails AssumerSafe.
CONSTANTS
  Finishes = {f1, f2}
  Assumers = {a1, a2}
  Closers = {c1}
  Writers = {w1}
  Recheck = FALSE
  RunCheck = TRUE
  BumpFirst = TRUE
  DecFirst = TRUE
  Cancel = FALSE
SPECIFICATION Spec
INVARIANT ClosedClean AssumerSafe WriterSafe Counted
