\* SuspectGate.cfg without the running check in close: a closer closes the
\* gate from the epoch a running Finish opened. Fails ClosedClean.
CONSTANTS
  Finishes = {f1, f2}
  Assumers = {a1, a2}
  Closers = {c1}
  Writers = {w1}
  Recheck = TRUE
  RunCheck = FALSE
  BumpFirst = TRUE
  DecFirst = TRUE
  Cancel = FALSE
SPECIFICATION Spec
INVARIANT ClosedClean AssumerSafe WriterSafe Counted
