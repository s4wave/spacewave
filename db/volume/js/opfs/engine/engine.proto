syntax = "proto3";
package volume.opfs.engine;
option go_package = "github.com/s4wave/spacewave/db/volume/js/opfs/engine;engine";

// Root selects one complete immutable catalogue.
message Root {
  // Format identifies the immutable layout accepted by this engine.
  uint32 format = 1;
  // Generation orders all root publications, including physical maintenance.
  uint64 generation = 2;
  // Catalogue names the immutable root routing page.
  string catalogue = 3;
  // ReclaimNext is the first retirement generation still requiring examination.
  uint64 reclaim_next = 4;
  // Publication identifies the intent that produced this committed root.
  string publication = 5;
  // RetireThrough is the last logical publication with retirement records.
  uint64 retire_through = 6;
  // BlockCount counts live payload locations in the committed index.
  uint64 block_count = 7;
  // BlockBytes sums the lengths of live payload locations.
  uint64 block_bytes = 8;
  // JournalSequence is the last allocated GC journal sequence.
  uint64 journal_sequence = 9;
  // Revision changes for logical writes, not relocation or retirement.
  uint64 revision = 10;
}

// Catalogue contains either ordered children or ordered run partitions.
message Catalogue {
  // Children route ordered key ranges when this is a branch page.
  repeated Child children = 1;
  // Partitions route ordered run ranges when this is a leaf page.
  repeated Partition partitions = 2;
}

// Child routes keys beginning at lower to an immutable catalogue page.
message Child {
  // Lower is the inclusive lower key bound of this range.
  bytes lower = 1;
  // File names the immutable child catalogue page.
  string file = 2;
}

// Partition covers keys up to the next partition and bounds overlapping runs.
message Partition {
  // Lower is the inclusive lower key bound of this range.
  bytes lower = 1;
  // Runs names at most four immutable runs, oldest first.
  repeated string runs = 2;
}

// Run stores sorted small records, newest runs taking precedence.
message Run {
  // Records contains complete keys in ascending byte order.
  repeated Record records = 1;
}

// Record is one complete key and its current value or deletion.
message Record {
  // Key is the complete binary identity, including its internal namespace.
  bytes key = 1;
  // Value holds the current encoded value when Deleted is false.
  bytes value = 2;
  // Deleted hides older values for this key until run consolidation.
  bool deleted = 3;
}

// Files records a bounded publication's allocated or retired immutable files.
message Files {
  // Names lists the bounded immutable files owned by this publication.
  repeated string names = 1;
  // Publication matches the committed root or its recoverable intent.
  string publication = 2;
}

// Location identifies an immutable payload extent and its full-record checksum.
message Location {
  // Pack names the immutable payload file containing this extent.
  string pack = 1;
  // Offset is the first payload byte within Pack.
  uint64 offset = 2;
  // Length is the number of payload bytes in the extent.
  uint32 length = 3;
  // Checksum is the IEEE CRC32 of the complete payload extent.
  uint32 checksum = 4;
  // PackBytes is the complete file length, bounding aligned reads at the tail.
  uint32 pack_bytes = 5;
}

// Pack records the complete block identities and extents in one payload file.
message Pack {
  // Records preserves complete block identities and locations in payload arrival order.
  repeated Record records = 1;
  // LiveBytes counts payload bytes still referenced in this pack.
  uint64 live_bytes = 2;
  // CleanupKey identifies the ordered internal queue entry for this pack.
  bytes cleanup_key = 3;
}

// JournalEntry preserves one ordered GC ownership transition until replay.
message JournalEntry {
  // Adds contains ownership edges applied before removals in this entry.
  repeated Edge adds = 1;
  // Removes contains ownership edges deleted after additions in this entry.
  repeated Edge removes = 2;
}

// Edge records complete source and target identities in the GC journal.
message Edge {
  // Subject is the complete source node identity.
  string subject = 1;
  // Object is the complete target node identity.
  string object = 2;
}
