\* previous s4db engine and bbolt before v0.57.22 do. Its commits after the
\* unlock go to the kept source, so they stay reachable but are not in P.
CONSTANTS
  OldOpener = TRUE
  OldRechecks = FALSE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT TypeOK NewAckKept OldAckReachable OriginalKept OnlyReservedRemoved
