syntax = "proto3";
package world.block.engine;

import "github.com/s4wave/spacewave/db/block/transform/transform.proto";
import "github.com/s4wave/spacewave/db/bucket/bucket.proto";
import "github.com/s4wave/spacewave/db/world/block/world.proto";

// Config configures a World Graph engine bound to a block graph.
// Builds a bucket handle using the given bucket ID.
// Stores the HEAD reference in an object store.
message Config {
  // EngineId is the identifier used to look up the world on the bus.
  // Used to match & resolve WorldEngine directives.
  // If empty, LookupWorldEngine will not be processed.
  string engine_id = 1;
  // BucketId is the bucket id to attach to for reading/writing state.
  // If set, overrides the bucket id from init_head_ref and the state.
  // If unset, the bucket id is determined from head_ref.
  string bucket_id = 2;
  // VolumeId is the volume id to attach to for writing DB state.
  // If unset, init_head_ref must be set, and the db will be read-only.
  string volume_id = 3;
  // ObjectStoreId is the object store an older engine kept the head in, and
  // whose Volume coordinates the World's writers. The head is the
  // world:<engine_id> root of the bucket; an open adopts the head the object
  // store kept once and deletes its record.
  // If unset with an init_head_ref root, the World is read-only at that root.
  string object_store_id = 4;
  // ObjectStorePrefix is the prefix of the older engine's head record.
  string object_store_prefix = 5;
  // ObjectStoreHeadKey is the key of the older engine's head record.
  //
  // Defaults to "world-head"
  string object_store_head_key = 6;
  // InitHeadRef is the reference to the initial HEAD state of the database.
  // A writable World with no head starts at it.
  // BucketId is overridden by BucketId field if it is set.
  .bucket.ObjectRef init_head_ref = 7;
  // StateTransformConf is the transform of the older engine's head record.
  // NOTE: this does not transform the entire world state.
  // To transform the world state, add the transform config to InitHeadRef.
  .block.transform.Config state_transform_conf = 11;
  // DisableChangelog disables the changelog in the world structure.
  // Note: has no effect unless we initialize the world from empty.
  bool disable_changelog = 13;
  // GraphSettings are the settings of the World's graph store.
  // A new World starts with these settings. An existing writable World moves
  // to them in the background, one step at a time alongside writers.
  // Empty leaves an existing World's settings unchanged and starts a new World
  // with the default settings; list the default indexes to return to them.
  .world.block.GraphSettings graph_settings = 15;
  // Format is the stored layout a new World starts with. An existing World
  // keeps the format it has.
  .world.block.WorldFormat format = 17;
  // Regen moves an existing writable World to the node graph format in the
  // background, alongside writers. Each step lands in the World's roots, so a
  // regeneration stopped by a restart resumes at the next open.
  RegenConfig regen = 18;

  // DisableLookup disables looking up anything on the bus via directives.
  // Implies both DisableApplyWorldOp and DisableApplyObjectOp.
  bool disable_lookup = 8;
  // DisableApplyWorldOp disables calling the ApplyWorldOp directive.
  bool disable_apply_world_op = 9;
  // DisableApplyObjectOp directive.
  bool disable_apply_object_op = 10;

  // Ephemeral opens a World that persists no head: it starts at
  // init_head_ref's root, or empty, on every open, and its commits stay in
  // memory, for scratch work such as a bundle build.
  bool ephemeral = 16;

  // RecoverMissingPersistedHead replaces a persisted head that cannot be
  // resolved because one of its blocks is missing with InitHeadRef. An empty
  // InitHeadRef creates a new World. Enable only for reconstructible state.
  bool recover_missing_persisted_head = 14;

  // Verbose logs all operation results as debug messages.
  bool verbose = 12;

  // TODO Auth, Version override
}

// RegenTarget is the stage a configured regeneration moves a World to.
enum RegenTarget {
  // REGEN_TARGET_NONE takes no step. A regeneration in progress keeps its
  // roots and resumes when a target is set again.
  REGEN_TARGET_NONE = 0;
  // REGEN_TARGET_SWITCHED builds the node graph World and swaps it in as the
  // head, holding the old root so a switch back still works.
  REGEN_TARGET_SWITCHED = 1;
  // REGEN_TARGET_DONE swaps, compares the new World with the old root and
  // releases the old root when they match. A mismatch switches back.
  REGEN_TARGET_DONE = 2;
  // REGEN_TARGET_SWITCHED_BACK returns a switched World to the held old root,
  // carrying the commits made since the swap, and holds the new root.
  REGEN_TARGET_SWITCHED_BACK = 3;
  // REGEN_TARGET_RELEASED drops the regeneration's roots: it abandons a build
  // or catch-up, or lets go of the new root a switch back held. A switched
  // World refuses it until it is compared or switched back.
  REGEN_TARGET_RELEASED = 4;
}

// RegenConfig configures a World's regeneration.
message RegenConfig {
  // Target is the stage to move the World to.
  RegenTarget target = 1;
  // SpillDir is the directory the regeneration's sorts write their disposable
  // runs in. The regeneration owns it and clears runs a killed process left, so
  // no other World or program may sort there. Required with a target that
  // builds.
  string spill_dir = 2;
  // BudgetBytes is the sort's memory before it spills a run.
  // Defaults to 256 MiB.
  uint64 budget_bytes = 3;
  // SwapChanges is the most changed records the swap applies inside the writer
  // turn, which bounds the wait a commit can take behind it.
  // Defaults to 4096.
  uint32 swap_changes = 4;
  // FloorDir is a directory on the file system holding the World's Volume.
  // The build keeps free disk there, and in spill_dir, above floor_bytes.
  // Required with a target that builds.
  string floor_dir = 5;
  // FloorBytes is the least free disk the build leaves on the file systems of
  // floor_dir and spill_dir. Below it the build stops before the switch and
  // the old tree stays live.
  // Defaults to 4 GiB.
  uint64 floor_bytes = 6;
}

// HeadState is the record an older engine kept the head in. An open reads it
// once to adopt the head into the World root, then deletes it.
message HeadState {
  // HeadRef is the reference to the current HEAD state of the database.
  .bucket.ObjectRef head_ref = 1;
}
