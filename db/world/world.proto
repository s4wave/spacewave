syntax = "proto3";
package world;

import "google/protobuf/descriptor.proto";

// RefOption declares that a string or repeated string field holds the object
// keys of other World objects, and declares the graph edge each key forms from
// the record's own object.
//
// The aptre Go generator reads it by field number and emits RangeWorldRefs on
// every message holding such a field, directly or through a message field.
message RefOption {
  // Predicate is the graph predicate of the edge as a bare IRI, such as
  // glados/llm-session/parent. The quad holds <glados/llm-session/parent>.
  string predicate = 1;
  // Index writes the edge as a graph quad with an empty label in the
  // transaction that creates the record, so the edge can be walked from
  // either end.
  bool index = 2;
}

// SpanOption declares the fields holding the time span a record covers.
//
// Each field is a singular string holding an RFC 3339 time or a
// google.protobuf.Timestamp. The aptre Go generator reads it by field number
// and emits WorldSpan on the message.
message SpanOption {
  // Start selects the field holding when the record's span begins.
  string start = 1;
  // End selects the field holding when the record's span ends. Empty when the
  // record declares no end.
  string end = 2;
}

// TypeCount is the number of objects of one type in a World: the number of
// <type> edges to the key types/<type_id>.
message TypeCount {
  // TypeId is the object type ID.
  string type_id = 1;
  // Count is the number of objects with the type.
  uint64 count = 2;
}

extend google.protobuf.FieldOptions {
  // Ref declares the World edge a reference field forms.
  RefOption ref = 51701;
}

extend google.protobuf.MessageOptions {
  // Span declares the fields holding a record's time span.
  SpanOption span = 51702;
}
