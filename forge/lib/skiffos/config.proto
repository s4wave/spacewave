syntax = "proto3";
package forge.lib.skiffos;

// Config configures one whole-workspace SkiffOS build on the Worker host.
//
// Runs "make configure compile" in a SkiffOS checkout for one workspace and
// config list, then stores the workspace's images directory, the boot set, as
// a UnixFS directory in the Task's World. The build runs on the Worker that
// serves the Execution and owns its workspace: a later build of the same
// workspace reuses its build tree and ccache.
//
// Inputs:
//  - each name in input_env: a UnixFS directory the build reads.
//
// Outputs:
//  - images: the boot set, a BLOCK_REF to a UnixFS directory.
message Config {
  // SkiffDir is the absolute path of the SkiffOS checkout on the Worker host.
  string skiff_dir = 1;
  // Workspace names the SkiffOS workspace this build owns.
  // Another builder of the same workspace in the same checkout would
  // overwrite its tree, so give each build Step its own workspace.
  string workspace = 2;
  // Configs is the SKIFF_CONFIG list in order, such as
  // ["intel/x64", "virt/qemu"].
  repeated string configs = 3;
  // ExtraConfigsPaths are absolute paths of directories holding out-of-tree
  // config packages, passed as SKIFF_EXTRA_CONFIGS_PATH.
  repeated string extra_configs_paths = 4;
  // InputEnv maps a Step input to an environment variable of the build.
  // The controller writes each input, a UnixFS directory, to inputs/<name> in
  // the workspace and sets the variable to that directory. The inputs are
  // part of the Task's reuse key, so changed input bytes rebuild.
  map<string, string> input_env = 5;
}
