syntax = "proto3";
package forge.runtime;

import "github.com/s4wave/spacewave/db/block/quad/quad.proto";
import "github.com/s4wave/spacewave/sdk/device/device.proto";
import "google/protobuf/timestamp.proto";

// CapacityOwnerState is the lifecycle state of a capacity record's durable
// owner claim.
enum CapacityOwnerState {
  // CAPACITY_OWNER_STATE_UNKNOWN is the zero value and never valid on a stored
  // record.
  CAPACITY_OWNER_STATE_UNKNOWN = 0;
  // CAPACITY_OWNER_STATE_ACTIVE means the claim is live and admits new work.
  CAPACITY_OWNER_STATE_ACTIVE = 1;
  // CAPACITY_OWNER_STATE_DRAINING means the claim is live but blocks new work
  // until reserved debits clear or declared totals grow to fit them.
  CAPACITY_OWNER_STATE_DRAINING = 2;
}

// ReservationState describes whether capacity remains held and whether the
// runtime outcome is known.
enum ReservationState {
  // RESERVATION_STATE_UNKNOWN is the zero value and never valid on a stored
  // reservation.
  RESERVATION_STATE_UNKNOWN = 0;
  // RESERVATION_STATE_RESERVED holds debited capacity before a runtime claims
  // it.
  RESERVATION_STATE_RESERVED = 1;
  // RESERVATION_STATE_ACTIVE holds debited capacity for one claimed runtime
  // generation.
  RESERVATION_STATE_ACTIVE = 2;
  // RESERVATION_STATE_UNCERTAIN holds debited capacity while the runtime
  // outcome is unknown, for example after a Device disconnect. Capacity stays
  // debited until the same fenced runtime reconnects or the lease expires.
  RESERVATION_STATE_UNCERTAIN = 3;
  // RESERVATION_STATE_PENDING_STOP holds a fenced runtime whose stop has not
  // been confirmed yet. Capacity release follows the expiry rule while the
  // runtime outcome stays unknown until the stop is confirmed.
  RESERVATION_STATE_PENDING_STOP = 4;
  // RESERVATION_STATE_RELEASED is terminal: cleanup is recorded and no
  // capacity is held.
  RESERVATION_STATE_RELEASED = 5;
}

// CleanupReason records why a reservation released.
enum CleanupReason {
  // CLEANUP_REASON_UNKNOWN is the zero value and never valid on a receipt.
  CLEANUP_REASON_UNKNOWN = 0;
  // CLEANUP_REASON_STOPPED records a caller-requested stop of a live runtime.
  CLEANUP_REASON_STOPPED = 1;
  // CLEANUP_REASON_EXPIRED records a lease-expiry release.
  CLEANUP_REASON_EXPIRED = 2;
}

// ResourceRequest declares the host capacity and backend required by one
// execution attempt.
message ResourceRequest {
  // MilliCpu is the requested CPU in milli-cores.
  uint64 milli_cpu = 1;
  // MemoryBytes is the requested memory in bytes.
  uint64 memory_bytes = 2;
  // Backend identifies the runtime backend required by the attempt.
  string backend = 3;
  // Cards asks for whole graphics cards. Unset or a zero count asks for none.
  .s4wave.device.GraphicsCardRequest cards = 4;
}

// BackendRuntimeIdentity identifies one backend runtime instance for one
// reservation generation. The identity is stable across Worker restarts so
// reconcile can resume observation without another launch.
message BackendRuntimeIdentity {
  // Backend identifies the runtime backend that owns the runtime.
  string backend = 1;
  // Id is the backend-scoped runtime identifier, for example a container id.
  string id = 2;
  // StopCommand is the runtime CLI executable used to stop this instance.
  string stop_command = 3;
  // StopEnv is its complete subprocess environment, retained across restarts.
  repeated string stop_env = 4;
  // StopTimeoutSeconds is the stop grace period for this instance.
  uint32 stop_timeout_seconds = 5;
}

// CleanupReceipt records the terminal cleanup facts for one reservation
// generation.
message CleanupReceipt {
  // ReservationObjectKey is the released reservation object key.
  string reservation_object_key = 1;
  // ExecutionObjectKey is the Execution attempt or logical standing node
  // identity whose capacity grant was released.
  string execution_object_key = 2;
  // RuntimeIdentity is the stopped runtime identity, empty when no runtime
  // launched.
  string runtime_identity = 3;
  // Generation is the fenced generation the receipt applies to.
  uint64 generation = 4;
  // RuntimeStopped records that the backend runtime was confirmed stopped, or
  // that no runtime ever launched. RuntimeStopped stays false while a stop is
  // pending. The receipt never fabricates this fact.
  bool runtime_stopped = 5;
  // CapacityReleased records that reserved capacity was credited back exactly
  // once.
  bool capacity_released = 6;
  // Reason records why the reservation released.
  CleanupReason reason = 7;
}

// WorkerCapacity is the observed and reserved capacity for one Forge Worker.
// The Worker process owns this record. Forge validates and debits it, and
// callers never keep a parallel ledger.
message WorkerCapacity {
  // WorkerObjectKey is the Forge Worker object key this record describes. The
  // record's own object key is a one-way hash of this value, so scans and
  // reclaim need it stored to identify the Worker.
  string worker_object_key = 1;
  // MilliCpuTotal is the observed total CPU in milli-cores.
  uint64 milli_cpu_total = 2;
  // MilliCpuReserved is the CPU debited by live reservations.
  uint64 milli_cpu_reserved = 3;
  // MemoryBytesTotal is the observed total memory in bytes.
  uint64 memory_bytes_total = 4;
  // MemoryBytesReserved is the memory debited by live reservations.
  uint64 memory_bytes_reserved = 5;
  // Backends lists the runtime backends the Worker supports.
  repeated string backends = 6;
  // ObservedAt is when the Worker reported the totals.
  google.protobuf.Timestamp observed_at = 7;
  // Generation increments on every mutation of this record so observers can
  // fence stale capacity views.
  uint64 generation = 8;
  // OwnerDeviceObjectKey is the enrolled Device object key of the owning
  // Worker execution.
  string owner_device_object_key = 9;
  // ClaimId identifies one owning Worker execution claim.
  string claim_id = 10;
  // OwnerEpoch increments on every claim transition. Calls fencing against an
  // older epoch are stale. A new record starts at its claim time in Unix
  // milliseconds, so deleting the record never lets an epoch repeat.
  uint64 owner_epoch = 11;
  // OwnerLeaseExpiresAt is when an unrenewed owner claim expires.
  google.protobuf.Timestamp owner_lease_expires_at = 12;
  // OwnerState is the claim lifecycle state.
  CapacityOwnerState owner_state = 13;
  // Cards lists the graphics cards the Worker offers, its declared card
  // totals.
  repeated .s4wave.device.GraphicsCard cards = 14;
  // ReservedCardIds lists the card ids debited by live reservations. An ACTIVE
  // record reserves only cards it offers. A DRAINING record may hold an id
  // whose card left the host until its reservation credits it.
  repeated string reserved_card_ids = 15;
}

// Reservation records a generation-fenced capacity grant. Runtime custody
// follows its lease. A standing grant follows its placement edge. The record is
// the durable truth: a Worker restart reconciles by reading it.
message Reservation {
  // WorkerObjectKey is the Forge Worker object key holding the capacity.
  string worker_object_key = 1;
  // ExecutionObjectKey is the holder identity used to derive this grant key:
  // an Execution attempt object key or a logical standing node identity.
  string execution_object_key = 2;
  // Request is the reserved capacity request.
  ResourceRequest request = 3;
  // Generation fences runtime custody. Resume after uncertainty increments the
  // generation. Calls fenced against an older generation are stale.
  uint64 generation = 4;
  // LeaseExpiresAt is when unobserved runtime custody expires. Standing grants
  // retain their debit until the placement edge is removed.
  google.protobuf.Timestamp lease_expires_at = 5;
  // State is the reservation lifecycle state.
  ReservationState state = 6;
  // Runtime identifies the claimed backend runtime, set on activation.
  BackendRuntimeIdentity runtime = 7;
  // Placement snapshots the edge that owns a standing grant. The graph edge is
  // the lifetime authority. Placement locates the edge after a restart.
  .quad.Quad placement = 8;
  // Cleanup records the terminal cleanup receipt, set on release.
  CleanupReceipt cleanup = 9;
  // CardIds lists the graphics card ids this grant holds. They return to the
  // Worker only when the reservation releases, after its runtime's stop is
  // confirmed.
  repeated string card_ids = 10;
}
