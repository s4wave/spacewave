syntax = "proto3";
package os.image;

import "github.com/s4wave/spacewave/db/bucket/bucket.proto";
import "github.com/s4wave/spacewave/net/peer/peer.proto";

// OSRootManifest names one Spacewave OS image and carries its producer's
// signature.
//
// The image is a read-only World. Its content-addressed root covers the system
// root tree, the boot set, the runtime profile and the provenance of every
// build input, so the signature over the root covers all of them. The boot
// executable verifies the signature against the signers it pinned on first
// boot before it serves the root, with no Space reachable.
message OSRootManifest {
  // Image is the image World's root, with its bucket and transform.
  .bucket.ObjectRef image = 1;
  // Signature is the producer's signature over this manifest with the
  // signature cleared. It carries the signer's public key, which identifies
  // the signing peer.
  .peer.Signature signature = 2;
}
