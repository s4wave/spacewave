syntax = "proto3";
package notes;

import "google/protobuf/timestamp.proto";

// Notebook is a world object that curates markdown files from UnixFS
// sources into a note-browsing experience.
message Notebook {
  // Name is the display name of the notebook.
  string name = 1;
  // Sources is the ordered list of content sources.
  repeated NotebookSource sources = 2;
}

// NotebookSource is a reference to a UnixFS path.
message NotebookSource {
  // Name is the display name for this source in the sidebar.
  string name = 1;
  // Ref is a UnixFS path reference (object-uri format: key/-/path).
  string ref = 2;
}

// InitNotebookOp creates a Notebook with a UnixFS source and starter notes.
message InitNotebookOp {
  // NotebookObjectKey is the world object key for the notebook.
  string notebook_object_key = 1;
  // UnixfsObjectKey is the world object key for the UnixFS storage.
  string unixfs_object_key = 2;
  // Timestamp is the creation timestamp.
  google.protobuf.Timestamp timestamp = 3;
  // Name is the notebook's display name; empty names it Notes.
  string name = 4;
}

// NotebookEditOp changes one Notebook's source list in a single World
// transaction. Remove and Reorder carry the sources the editor saw and apply
// only while the stored list still matches them, so an edit made against a
// stale view is refused instead of hitting the wrong source.
message NotebookEditOp {
  // ObjectKey is the world object key of the Notebook.
  string object_key = 1;
  // Edit is the change to apply.
  oneof edit {
    // Add appends a source.
    NotebookAddSource add = 2;
    // Remove removes the source at an index.
    NotebookRemoveSource remove = 3;
    // Reorder permutes the sources.
    NotebookReorderSources reorder = 4;
  }
}

// NotebookAddSource appends a source to a Notebook.
message NotebookAddSource {
  // Source is the source to append; its ref is required.
  NotebookSource source = 1;
}

// NotebookRemoveSource removes the source at index, only while the stored
// source at that index equals source.
message NotebookRemoveSource {
  // Index is the position of the source to remove.
  uint32 index = 1;
  // Source is the source the editor saw at index.
  NotebookSource source = 2;
}

// NotebookReorderSources reorders the sources, only while the stored list
// equals sources.
message NotebookReorderSources {
  // Order lists, for each new position, the index of the source in sources.
  repeated uint32 order = 1;
  // Sources is the source list the editor saw.
  repeated NotebookSource sources = 2;
}
