syntax = "proto3";
package volume.filesnap;

import "github.com/s4wave/spacewave/db/store/kvtx/kvtx.proto";
import "github.com/s4wave/spacewave/db/store/kvkey/kvkey.proto";
import "github.com/s4wave/spacewave/db/volume/controller/controller.proto";

// Config is the snapshot-file volume controller config.
message Config {
  // Path is the snapshot file path.
  string path = 1;
  // KvKeyOpts are key/value key constants.
  .store.kvkey.Config kv_key_opts = 2;
  // VolumeConfig is the volume controller config.
  .volume.controller.Config volume_config = 3;
  // StoreConfig is the store configuration for kvtx.
  .store.kvtx.Config store_config = 4;
  // NoGenerateKey indicates the controller should not generate a private
  // key if one is not already present.
  bool no_generate_key = 5;
  // NoWriteKey indicates the controller should not write a private key to
  // storage if it generates one.
  bool no_write_key = 6;
}
