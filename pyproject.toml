[project]
name = "spacewave-resource"
version = "0.0.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "starpc @ git+https://github.com/aperturerobotics/starpc.git@b78c815f1e13b4a2d8e7f602658d6c695fa26e53",
]

[dependency-groups]
dev = [
    "mypy==2.3.0",
    "ruff==0.16.2",
    "starpc-python-plugin @ git+https://github.com/aperturerobotics/starpc.git@b78c815f1e13b4a2d8e7f602658d6c695fa26e53#subdirectory=python/plugin",
    "types-protobuf==7.34.1.20260518",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["spacewave_resource*", "bldr.resource"]
namespaces = true

[tool.setuptools.package-data]
spacewave_resource = ["py.typed"]
"bldr.resource" = ["py.typed"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["bldr.resource.resource_pb2", "rpcstream.rpcstream_pb2"]
disable_error_code = ["type-arg"]
