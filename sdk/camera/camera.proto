syntax = "proto3";
package s4wave.camera;

import "google/protobuf/timestamp.proto";
import "github.com/aperturerobotics/common/typeid/typeid.proto";
import "github.com/s4wave/spacewave/core/frametrack/frametrack.proto";
import "github.com/s4wave/spacewave/sdk/device/device.proto";

option go_package = "github.com/s4wave/spacewave/sdk/camera;s4wave_camera";

// Camera is the world-block state for a camera a Device serves. It names the
// Device object and the capability, not the Device's peer, so the viewer
// follows the Device through re-enrollment.
message Camera {
  option (typeid.id) = "spacewave/camera";

  // Name is the display name for this camera.
  string name = 1;
  // DeviceObjectKey is the Device object that serves the camera.
  string device_object_key = 2;
  // CapabilityId is the ID of the Device capability that serves the camera.
  string capability_id = 3;
  // CreatedAt is when this Camera object was created.
  .google.protobuf.Timestamp created_at = 4;
}

// CreateCameraOp creates a Camera world object.
message CreateCameraOp {
  option (typeid.id) = "spacewave/camera/create";

  // ObjectKey is the key to create the Camera at.
  string object_key = 1;
  // Name is the Camera display name.
  string name = 2;
  // DeviceObjectKey is the Device object that serves the camera.
  string device_object_key = 3;
  // CapabilityId is the ID of the Device capability that serves the camera.
  string capability_id = 4;
  // Timestamp is the creation timestamp.
  .google.protobuf.Timestamp timestamp = 5;
}

service CameraResourceService {
  rpc WatchCamera(WatchCameraRequest) returns (stream WatchCameraResponse);
  // WatchFrames opens the Camera's frame track on its Device and streams the
  // newest picture until the caller or the Device ends it.
  rpc WatchFrames(WatchFramesRequest) returns (stream WatchFramesResponse);
}

// WatchCameraRequest is a request to watch a Camera and its Device.
message WatchCameraRequest {}

// WatchCameraResponse is the Camera and its Device's availability, sent
// whole on each change.
message WatchCameraResponse {
  // Camera is the Camera block state.
  Camera camera = 1;
  // Device is the Camera's Device and its reachability from the viewer's
  // Session.
  .s4wave.device.DeviceAvailability device = 2;
}

// WatchFramesRequest is a request to play the Camera's frame track.
message WatchFramesRequest {}

// WatchFramesResponse is one state of the frame track: opened on the Device,
// then each picture the caller keeps up with. A caller that falls behind
// receives only the newest picture.
message WatchFramesResponse {
  // State is the frame track's state at this message.
  oneof state {
    // Opened reports that the Device's control stream holds the subscription.
    WatchFramesOpened opened = 1;
    // Frame is the newest picture with its group's header.
    WatchFramesFrame frame = 2;
  }
}

// WatchFramesOpened is the frame track after the Device accepted the
// subscription and before its first picture.
message WatchFramesOpened {}

// WatchFramesFrame is one picture and the header of the group it decodes in.
message WatchFramesFrame {
  // Header describes the picture's group: its codec and size.
  .s4wave.frametrack.GroupHeader header = 1;
  // Frame is the coded picture.
  .s4wave.frametrack.Frame frame = 2;
}
