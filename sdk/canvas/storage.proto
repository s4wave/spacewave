syntax = "proto3";
package s4wave.canvas;

option go_package = "github.com/s4wave/spacewave/sdk/canvas;s4wave_canvas";

import "github.com/s4wave/spacewave/db/kvtx/block/kvtx.proto";
import "github.com/s4wave/spacewave/sdk/canvas/canvas.proto";

// CanvasStorage is the root block of a Canvas state DAG.
message CanvasStorage {
  // Nodes stores Canvas nodes. Key: UTF-8 node ID. Value: block.BlockRef to CanvasNode.
  .kvtx.block.KeyValueStore nodes = 1;
  // Edges contains user-drawn visual edges.
  repeated CanvasEdge edges = 2;
  // StrokeTreeRef identifies the freeform stroke tree.
  bytes stroke_tree_ref = 3;
  // HiddenGraphLinks contains canvas-scoped hidden world graph links.
  repeated HiddenGraphLink hidden_graph_links = 4;
  // LayoutMetadata contains projection layout metadata keyed by canvas node ID.
  map<string, CanvasLayoutMetadata> layout_metadata = 5;
}
