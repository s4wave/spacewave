syntax = "proto3";
package s4wave.flowgraph;

import "github.com/s4wave/spacewave/db/block/block.proto";
import "github.com/s4wave/spacewave/forge/target/target.proto";
import "github.com/aperturerobotics/common/typeid/typeid.proto";
import "github.com/aperturerobotics/starpc/rpcstream/rpcstream.proto";

option go_package = "github.com/s4wave/spacewave/sdk/flowgraph;s4wave_flowgraph";

// Flowgraph holds an authored composition of Device nodes and Steps.
message Flowgraph {
  // Name is the display name of this graph.
  string name = 1;
  // Nodes contains nodes keyed by their graph-local ID.
  map<string, FlowgraphNode> nodes = 2;
  // Connections contains connections keyed by their graph-local ID.
  map<string, FlowgraphConnection> connections = 3;
}

// FlowgraphNode holds the authored settings and ports of one node.
message FlowgraphNode {
  // TypeId selects the node type supplied by a core or plugin controller.
  string type_id = 1;
  // Parameters contains named settings interpreted by the node type.
  map<string, string> parameters = 2;
  // Ports declares the node's inputs and outputs.
  repeated FlowgraphPort ports = 3;
  // Step holds instructions for a node that runs once per activation.
  FlowgraphStep step = 4;
  // ObjectKey binds the node to a Space object, such as a chat room or a
  // repository. It is empty for an unbound node. The binding state is derived
  // from the World when the graph is read and is never stored.
  string object_key = 5;
}

// FlowgraphPortDirection selects the end of a directed connection.
enum FlowgraphPortDirection {
  // FLOWGRAPH_PORT_DIRECTION_UNKNOWN is unset.
  FLOWGRAPH_PORT_DIRECTION_UNKNOWN = 0;
  // FLOWGRAPH_PORT_DIRECTION_INPUT accepts data or an activation.
  FLOWGRAPH_PORT_DIRECTION_INPUT = 1;
  // FLOWGRAPH_PORT_DIRECTION_OUTPUT supplies data or routes an activation.
  FLOWGRAPH_PORT_DIRECTION_OUTPUT = 2;
}

// FlowgraphPort declares a node-local connection endpoint.
message FlowgraphPort {
  // Name is unique among this node's ports.
  string name = 1;
  // Direction selects input or output.
  FlowgraphPortDirection direction = 2;
  // TypeId is the data contract of the port, such as stream or activation.
  string type_id = 3;
  // Condition states when an activation takes this Step output.
  string condition = 4;
}

// FlowgraphStep holds the instructions for an actor or code Step.
message FlowgraphStep {
  // Prompt contains the actor's instructions.
  string prompt = 1;
  // Skills lists the skills the actor may invoke.
  repeated FlowgraphSkill skills = 2;
  // Target contains the execution definition for the Step. It declares one
  // EXEC output per Step output port, named after the port, and its exec sets
  // exactly one of them. It may also set a spend output.
  //
  // A code Step's exec runs its code. An actor Step's exec is the runner
  // controller for the actor's object type, configured with the Step's prompt
  // and each output port's condition. The runner gives the actor the prompt,
  // the conditions and the activation inputs, and sets the chosen port's
  // output to a World object snapshot of the actor's conclusion, which records
  // a confidence and a reason for every output port. A runner whose actor
  // concludes nothing sets no port, so the run pauses with its inputs kept.
  .forge.target.Target target = 3;
  // Bound limits this Step's activations within one run.
  FlowgraphBound bound = 4;
  // Keyed makes the Step hold one running activation per arrival key. Its
  // input ports are satisfied by arrivals that carry the same key, and an
  // arrival for a key that has a running activation reaches that activation's
  // inbox. An unkeyed Step ignores the key.
  bool keyed = 5;
}

// FlowgraphBound limits the visits and the reported spend of a Step in a run.
// A run that would exceed a limit pauses at the Step. Zero is unlimited.
message FlowgraphBound {
  // MaxVisits is the number of activations the Step may have.
  uint32 max_visits = 1;
  // MaxSpend is the total spend the Step's activations may report.
  uint64 max_spend = 2;
}

// FlowgraphSkill declares an allowed skill invocation.
message FlowgraphSkill {
  // Name selects the skill.
  string name = 1;
  // Parameters contains the invocation's named settings.
  map<string, string> parameters = 2;
}

// FlowgraphConnection connects an output to an input within the graph.
message FlowgraphConnection {
  // OutputNode is the graph-local ID of the supplying node.
  string output_node = 1;
  // OutputPort is the supplying node's output port name.
  string output_port = 2;
  // InputNode is the graph-local ID of the receiving node.
  string input_node = 3;
  // InputPort is the receiving node's input port name.
  string input_port = 4;
}

// FlowgraphPlacementKind selects the component that runs a node.
enum FlowgraphPlacementKind {
  // FLOWGRAPH_PLACEMENT_KIND_UNKNOWN is unset.
  FLOWGRAPH_PLACEMENT_KIND_UNKNOWN = 0;
  // FLOWGRAPH_PLACEMENT_KIND_DEVICE places a standing node on a Device.
  FLOWGRAPH_PLACEMENT_KIND_DEVICE = 1;
  // FLOWGRAPH_PLACEMENT_KIND_ACTOR places a Step on an actor.
  FLOWGRAPH_PLACEMENT_KIND_ACTOR = 2;
  // FLOWGRAPH_PLACEMENT_KIND_ACTOR_TEMPLATE starts an actor for each activation.
  FLOWGRAPH_PLACEMENT_KIND_ACTOR_TEMPLATE = 3;
}

// FlowgraphPlacement is a command or readback of a placement graph edge.
message FlowgraphPlacement {
  // Kind selects the Device or actor placement predicate.
  FlowgraphPlacementKind kind = 1;
  // ObjectKey is the edge's destination, supplied to or read from the graph.
  // This message is never stored in the Flowgraph body.
  string object_key = 2;
}

// FlowgraphBindingState is the derived state of a node's bound Space object.
enum FlowgraphBindingState {
  // FLOWGRAPH_BINDING_STATE_UNKNOWN is unset.
  FLOWGRAPH_BINDING_STATE_UNKNOWN = 0;
  // FLOWGRAPH_BINDING_STATE_UNBOUND means the node names no object.
  FLOWGRAPH_BINDING_STATE_UNBOUND = 1;
  // FLOWGRAPH_BINDING_STATE_BOUND means the object exists and its type is
  // registered, so the declared ports are known.
  FLOWGRAPH_BINDING_STATE_BOUND = 2;
  // FLOWGRAPH_BINDING_STATE_UNREGISTERED means the object exists but no loaded
  // plugin registers its type.
  FLOWGRAPH_BINDING_STATE_UNREGISTERED = 3;
  // FLOWGRAPH_BINDING_STATE_UNAVAILABLE means the object does not exist.
  FLOWGRAPH_BINDING_STATE_UNAVAILABLE = 4;
}

// FlowgraphBinding is a readback of a node's bound Space object.
// This message is never stored in the Flowgraph body.
message FlowgraphBinding {
  // ObjectKey is the bound object, copied from the node.
  string object_key = 1;
  // TypeId is the object's World type, empty when the object is absent.
  string type_id = 2;
  // State is the binding state derived from the World and the type registry.
  FlowgraphBindingState state = 3;
  // Ports lists the ports the object's registered type declares. The node's
  // connections may name these ports. It is empty unless the state is BOUND.
  repeated FlowgraphPort ports = 4;
}

// FlowgraphSnapshot reads authored state and its placement edges together.
message FlowgraphSnapshot {
  // State is the authored object body.
  Flowgraph state = 1;
  // Placements contains placement edges keyed by node ID.
  map<string, FlowgraphPlacement> placements = 2;
  // Revision is the object's revision observed by this read.
  uint64 revision = 3;
  // Bindings contains the binding of each node that names an object, keyed by
  // node ID. An unbound node has no entry.
  map<string, FlowgraphBinding> bindings = 4;
}

// CreateFlowgraphOp creates one independently addressed Flowgraph.
message CreateFlowgraphOp {
  option (typeid.id) = "flowgraph/create";

  // ObjectKey is the new Flowgraph's identity, of the form flowgraph/<id>.
  string object_key = 1;
  // Name is the graph's display name.
  string name = 2;
}

// FlowgraphResourceService reads and edits an authored graph.
service FlowgraphResourceService {
  // OpenNodePort opens a stream port through this graph's granting Session.
  // RpcStreamInit.component_id is "<node>/<port>". The host resolves the node's
  // Device placement and carries its SRPC calls after acknowledging the route. The destination Session admits the source peer by its own rule.
  rpc OpenNodePort(stream .rpcstream.RpcStreamPacket) returns (stream .rpcstream.RpcStreamPacket);
  // GetFlowgraph reads the current body and placement edges.
  rpc GetFlowgraph(GetFlowgraphRequest) returns (GetFlowgraphResponse);
  // UpdateFlowgraph applies one authored change atomically.
  rpc UpdateFlowgraph(UpdateFlowgraphRequest) returns (UpdateFlowgraphResponse);
  // WatchFlowgraph streams committed body and placement changes.
  rpc WatchFlowgraph(WatchFlowgraphRequest) returns (stream WatchFlowgraphResponse);
  // ListFlowgraphChanges reads the graph's revisions from the World changelog.
  rpc ListFlowgraphChanges(ListFlowgraphChangesRequest) returns (ListFlowgraphChangesResponse);
}

// GetFlowgraphRequest reads the mounted graph.
message GetFlowgraphRequest {
}

// GetFlowgraphResponse contains the current graph snapshot.
message GetFlowgraphResponse {
  // Snapshot is the graph at the observed revision.
  FlowgraphSnapshot snapshot = 1;
}

// UpdateFlowgraphRequest edits nodes, connections, and placement edges.
message UpdateFlowgraphRequest {
  // Name replaces the display name when set.
  optional string name = 1;
  // SetNodes adds or replaces nodes by ID.
  map<string, FlowgraphNode> set_nodes = 2;
  // RemoveNodeIds removes nodes, their placements, and their connections.
  repeated string remove_node_ids = 3;
  // SetConnections adds or replaces connections by ID.
  map<string, FlowgraphConnection> set_connections = 4;
  // RemoveConnectionIds removes connections by ID.
  repeated string remove_connection_ids = 5;
  // SetPlacements adds or replaces placement edges by node ID.
  map<string, FlowgraphPlacement> set_placements = 6;
  // RemovePlacementNodeIds removes placement edges without deleting the nodes.
  repeated string remove_placement_node_ids = 7;
}

// UpdateFlowgraphResponse contains the committed authored result.
message UpdateFlowgraphResponse {
  // Snapshot is the graph at this change's revision.
  FlowgraphSnapshot snapshot = 1;
}

// WatchFlowgraphRequest watches the mounted graph.
message WatchFlowgraphRequest {
}

// WatchFlowgraphResponse contains one committed graph snapshot.
message WatchFlowgraphResponse {
  // Snapshot is the graph at the observed revision.
  FlowgraphSnapshot snapshot = 1;
}

// FlowgraphChange is one revision of a graph, read from the World changelog.
message FlowgraphChange {
  // Seqno is the World changelog seqno that recorded the revision.
  uint64 seqno = 1;
  // Created is set when the revision created the graph.
  bool created = 2;
  // Edit is the change from the preceding revision, as an update request.
  UpdateFlowgraphRequest edit = 3;
}

// ListFlowgraphChangesRequest reads the mounted graph's history.
message ListFlowgraphChangesRequest {
  // Limit bounds the number of changes returned; zero returns all retained.
  uint32 limit = 1;
}

// ListFlowgraphChangesResponse contains the graph's retained revisions.
message ListFlowgraphChangesResponse {
  // Changes contains the revisions, newest first.
  repeated FlowgraphChange changes = 1;
  // ChangelogDisabled is set when the World keeps no changelog, so the graph
  // has no history.
  bool changelog_disabled = 2;
  // Complete is set when changes reach back to the graph's creation.
  bool complete = 3;
}

// FlowgraphRunState is the lifecycle state of a run.
enum FlowgraphRunState {
  // FLOWGRAPH_RUN_STATE_UNKNOWN is unset.
  FLOWGRAPH_RUN_STATE_UNKNOWN = 0;
  // FLOWGRAPH_RUN_STATE_RUNNING starts each Step whose inputs have arrived.
  FLOWGRAPH_RUN_STATE_RUNNING = 1;
  // FLOWGRAPH_RUN_STATE_PAUSED starts no Step until its owner resumes it.
  FLOWGRAPH_RUN_STATE_PAUSED = 2;
  // FLOWGRAPH_RUN_STATE_COMPLETE has no activation running or waiting.
  FLOWGRAPH_RUN_STATE_COMPLETE = 3;
}

// FlowgraphRun is the state of one run of a Flowgraph's Steps on a Forge Job.
// The run, not the Job, says whether the run is done: the Job reads COMPLETE
// whenever no activation is running.
message FlowgraphRun {
  // FlowgraphKey is the Flowgraph this run executes.
  string flowgraph_key = 1;
  // FlowgraphRevision is the Flowgraph revision the run executes.
  uint64 flowgraph_revision = 2;
  // GraphRef is the Flowgraph body at flowgraph_revision.
  .block.BlockRef graph_ref = 3;
  // JobKey is the Forge Job holding one Task per activation.
  string job_key = 4;
  // State is the run's lifecycle state.
  FlowgraphRunState state = 5;
  // Activations lists every Step activation in start order.
  repeated FlowgraphActivation activations = 6;
  // Arrivals holds outputs delivered to Step inputs and not yet consumed.
  repeated FlowgraphArrival arrivals = 7;
  // Visits counts activations and reported spend by Step node ID.
  map<string, FlowgraphVisits> visits = 8;
  // PausedNode is the Step the run paused at.
  string paused_node = 9;
  // PauseReason says why the run paused.
  string pause_reason = 10;
  // Standing marks the run a graph's event sources feed. A graph has at most
  // one standing run.
  bool standing = 11;
  // Cursor holds the opaque position after the last event delivered from each
  // event-source node, by node ID. A delivery applies only when it names the
  // stored cursor, so two readers of the same events deliver each once.
  map<string, bytes> cursor = 12;
  // Placements is the immutable placement snapshot at FlowgraphRevision.
  map<string, FlowgraphPlacement> placements = 13;
}

// FlowgraphActivation is one activation of a Step, run as one Forge Task.
message FlowgraphActivation {
  // NodeId is the activated Step.
  string node_id = 1;
  // TaskKey is the activation's Task in the run's Job.
  string task_key = 2;
  // Inputs are the arrivals the activation consumed, kept so a failed
  // activation can run again with the same context.
  repeated FlowgraphArrival inputs = 3;
  // Done is set once the run has routed the activation's outcome.
  bool done = 4;
  // Output is the Step output port the activation chose.
  string output = 5;
  // Key is the arrival key of a keyed Step's activation, empty for an unkeyed
  // Step. A run holds at most one running activation per Step and key.
  string key = 6;
  // Inbox holds the live inputs delivered to the running activation and not
  // yet acknowledged, in sequence order. When the activation ends, the run
  // returns them to its arrivals.
  repeated FlowgraphLiveInput inbox = 7;
  // LastInputSeq is the sequence number of the latest live input. It only
  // grows, so a sequence number is never reused after an acknowledgement.
  uint64 last_input_seq = 8;
  // ActorKey is the immutable receipt of the actor started for this activation.
  // RecordActivationActor sets it once; restarted execs reattach to this actor.
  string actor_key = 9;
}

// FlowgraphActivationContext is supplied as the flowgraph/context Task input.
// An exec uses it to record its actor and watch or acknowledge live inputs.
message FlowgraphActivationContext {
  // RunKey names the owning run, an immutable execution snapshot.
  string run_key = 1;
  // ActivationId is the activation's Task key within that run.
  string activation_id = 2;
  // Key is the activation's arrival key, empty for an unkeyed Step.
  string key = 3;
  // TemplateKey names the template in the run's immutable placement snapshot.
  // It is empty unless the Step is placed on an actor template.
  string template_key = 4;
}

// FlowgraphLiveInput is an arrival delivered to a running keyed activation.
message FlowgraphLiveInput {
  // Seq orders the activation's live inputs, from one.
  uint64 seq = 1;
  // Arrival is the arrival that reached the activation, with its key.
  FlowgraphArrival arrival = 2;
}

// FlowgraphArrival is an output or event delivered to a Step's input port.
message FlowgraphArrival {
  // NodeId is the receiving Step.
  string node_id = 1;
  // Port is the receiving input port, or empty for a run's start.
  string port = 2;
  // Key routes the arrival to a keyed Step activation. It is empty for an
  // ordinary arrival.
  string key = 3;
  // Source is where the arrival came from. It is unset for a run's start.
  oneof source {
    // TaskOutput is an output of a completed Task.
    FlowgraphTaskOutput task_output = 4;
    // Event is an event on a World object.
    FlowgraphEvent event = 5;
  }
}

// FlowgraphTaskOutput names an output of a Forge Task.
message FlowgraphTaskOutput {
  // TaskKey is the Task whose output arrived.
  string task_key = 1;
  // OutputName is the arriving output of that Task.
  string output_name = 2;
}

// FlowgraphEvent names one event on a World object.
message FlowgraphEvent {
  // ObjectKey is the World object the event happened on. The receiving Step's
  // Task reads it as a WORLD_OBJECT input.
  string object_key = 1;
  // EventId identifies the event within its event source.
  string event_id = 2;
  // Port is the source output port, or empty for every outgoing connection.
  string port = 3;
}

// FlowgraphVisits counts one Step's activations in a run.
message FlowgraphVisits {
  // Count is the number of activations started.
  uint32 count = 1;
  // Spend is the total spend the completed activations reported.
  uint64 spend = 2;
}
