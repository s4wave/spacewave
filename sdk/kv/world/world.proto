syntax = "proto3";
package s4wave.kv.world;

import "github.com/s4wave/spacewave/db/bucket/bucket.proto";

option go_package = "github.com/s4wave/spacewave/sdk/kv/world;s4wave_kv_world";

// KvSetRootOp advances a kv/store world object's root after a KVTX commit.
message KvSetRootOp {
  // ObjectKey is the kv/store object key to update.
  string object_key = 1;
  // RootRef is the committed KVTX root reference.
  .bucket.ObjectRef root_ref = 2;
}
