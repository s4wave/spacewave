syntax = "proto3";
package s4wave.space.invoke;

// SpaceInvocationHandlerService serves bounded Space operations with host-issued authority.
service SpaceInvocationHandlerService {
  // InvokeSpace invokes one operation under the supplied grant and lease.
  rpc InvokeSpace(InvokeSpaceRequest) returns (InvokeSpaceResponse);
}

// AccessMode limits the mutations permitted through a granted binding.
enum AccessMode {
  // ACCESS_MODE_UNKNOWN rejects use when the host did not select an access mode.
  ACCESS_MODE_UNKNOWN = 0;
  // ACCESS_MODE_READ permits operations that do not mutate the bound Resource.
  ACCESS_MODE_READ = 1;
  // ACCESS_MODE_READ_WRITE permits reads and accepted mutations through the bound Resource.
  ACCESS_MODE_READ_WRITE = 2;
}

// GrantedBinding identifies one host-attached Resource authorized for an invocation.
message GrantedBinding {
  // BindingId identifies the author-declared requirement satisfied by this binding.
  string binding_id = 1;
  // TypeId identifies the expected ObjectType and is empty for non-object capabilities.
  string type_id = 2;
  // ObjectKey identifies the bound World object.
  string object_key = 3;
  // ServiceId identifies the required Resource service contract.
  string service_id = 4;
  // AccessMode limits operations through the binding.
  AccessMode access_mode = 5;
  // AttachedResourceId identifies the Resource attached for this invocation lease.
  uint32 attached_resource_id = 6;
}

// SpaceInvocationEnvelope carries the host-issued identity, grant, lease, and
// bindings for one invocation.
message SpaceInvocationEnvelope {
  // SpaceId identifies the one Space authorized for this invocation.
  string space_id = 1;
  // GrantId identifies the stable Space-native capability grant.
  string grant_id = 2;
  // GrantVersion fences attachment against the current monotonic grant version.
  uint64 grant_version = 3;
  // PrincipalId identifies the subject receiving the grant.
  string principal_id = 4;
  // IssuerId identifies the authority that issued the grant.
  string issuer_id = 5;
  // LeaseExpiresUnixMs is the lease end in Unix milliseconds; zero bounds the lease to the call.
  int64 lease_expires_unix_ms = 6;
  // Bindings contains only Resources attached under the current grant.
  repeated GrantedBinding bindings = 7;
}

// InvokeSpaceRequest invokes one operation under an explicit Space grant.
message InvokeSpaceRequest {
  // Envelope carries the authority and Resources for this invocation.
  SpaceInvocationEnvelope envelope = 1;
  // OperationId identifies the registered operation to invoke.
  string operation_id = 2;
  // OpData contains the operation's protobuf-encoded request.
  bytes op_data = 3;
}

// InvokeSpaceResponse returns the operation result and optional child Resource.
message InvokeSpaceResponse {
  // ResourceId identifies an invocation-scoped child Resource, or zero when none is returned.
  uint32 resource_id = 1;
  // ResultData contains the operation's protobuf-encoded result.
  bytes result_data = 2;
}
