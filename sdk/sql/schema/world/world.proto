syntax = "proto3";
package s4wave.sql.schema.world;

import "github.com/s4wave/spacewave/db/bucket/bucket.proto";

option go_package = "github.com/s4wave/spacewave/sdk/sql/schema/world;s4wave_sql_schema_world";

// SqlSchemaSetRootOp advances a sql/schema world object's root.
message SqlSchemaSetRootOp {
  // ObjectKey is the sql/schema object key to update.
  string object_key = 1;
  // RootRef is the committed schema root reference.
  .bucket.ObjectRef root_ref = 2;
}
