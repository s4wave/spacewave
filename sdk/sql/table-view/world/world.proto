syntax = "proto3";
package s4wave.sql.table_view.world;

import "github.com/s4wave/spacewave/db/bucket/bucket.proto";

option go_package = "github.com/s4wave/spacewave/sdk/sql/table-view/world;s4wave_sql_table_view_world";

// SqlTableViewSetRootOp advances a sql/table-view world object's root.
message SqlTableViewSetRootOp {
  // ObjectKey is the sql/table-view object key to update.
  string object_key = 1;
  // RootRef is the committed table view root reference.
  .bucket.ObjectRef root_ref = 2;
}
