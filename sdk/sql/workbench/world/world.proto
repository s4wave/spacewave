syntax = "proto3";
package s4wave.sql.workbench.world;

import "github.com/s4wave/spacewave/db/bucket/bucket.proto";

option go_package = "github.com/s4wave/spacewave/sdk/sql/workbench/world;s4wave_sql_workbench_world";

// SqlWorkbenchSetRootOp advances a sql/workbench world object's root.
message SqlWorkbenchSetRootOp {
  // ObjectKey is the sql/workbench object key to update.
  string object_key = 1;
  // RootRef is the committed workbench root reference.
  .bucket.ObjectRef root_ref = 2;
  // InitializeOnly rejects the operation when the object already has a root.
  bool initialize_only = 3;
}
