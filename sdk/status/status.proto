syntax = "proto3";
package s4wave.status;

option go_package = "github.com/s4wave/spacewave/sdk/status;s4wave_status";

service SystemStatusService {
  rpc WatchControllers(WatchControllersRequest) returns (stream WatchControllersResponse);

  rpc WatchDirectives(WatchDirectivesRequest) returns (stream WatchDirectivesResponse);

  rpc WatchPlugins(WatchPluginsRequest) returns (stream WatchPluginsResponse);

  rpc WatchNetworkStats(WatchNetworkStatsRequest) returns (stream WatchNetworkStatsResponse);

  rpc ReportRecoveryStatus(ReportRecoveryStatusRequest) returns (ReportRecoveryStatusResponse);

  rpc WatchRecoveryStatus(WatchRecoveryStatusRequest) returns (stream WatchRecoveryStatusResponse);
}

// ControllerInfo describes a running controller.
message ControllerInfo {
  // Id is the controller identifier.
  string id = 1;
  // Version is the controller version string.
  string version = 2;
  // Description is a human-readable description.
  string description = 3;
}

// DirectiveInfo describes an active directive.
message DirectiveInfo {
  // Name is the directive type name.
  string name = 1;
  // Ident is the human-readable directive identification string.
  string ident = 2;
}

// PluginInfo describes a runtime plugin load request.
message PluginInfo {
  // Id is the plugin identifier.
  string id = 1;
  // InstanceKey is the optional instance key for instanced plugins.
  string instance_key = 2;
  // State is the plugin runtime state.
  string state = 3;
}

// NetworkLinkInfo describes a live bifrost link.
message NetworkLinkInfo {
  // LocalPeerId is the local peer ID for the link.
  string local_peer_id = 1;
  // RemotePeerId is the remote peer ID for the link.
  string remote_peer_id = 2;
  // LinkId is the host-unique link ID.
  uint64 link_id = 3;
  // TransportId is the local transport UUID for the link.
  uint64 transport_id = 4;
  // RemoteTransportId is the remote transport UUID reported by the link.
  uint64 remote_transport_id = 5;
}

// NetworkPeerInfo describes a peer with active bifrost links.
message NetworkPeerInfo {
  // PeerId is the peer ID.
  string peer_id = 1;
  // LinkCount is the number of active links to the peer.
  uint32 link_count = 2;
  // Links is the active link list for the peer.
  repeated NetworkLinkInfo links = 3;
}

// LauncherRecoveryStatus reports launcher-owned release/config recovery facts.
message LauncherRecoveryStatus {
  uint64 selected_config_rev = 1;
  string selected_config_source = 2;
  uint64 fetched_config_rev = 3;
  string fetched_config_source = 4;
  string release_metadata_outcome = 5;
  string release_world_head_ref = 6;
  string selected_channel_key = 7;
  string selected_entrypoint_manifest_id = 8;
  string selected_entrypoint_platform_id = 9;
  uint64 selected_entrypoint_manifest_rev = 10;
  string selected_entrypoint_manifest_ref = 11;
  string update_phase = 12;
  string update_version = 13;
  string staged_path = 14;
  string update_error = 15;
}

// PluginManifestRecoveryStatus reports scheduler-owned Manifest recovery facts.
message PluginManifestRecoveryStatus {
  string plugin_id = 1;
  string instance_key = 2;
  string execute_manifest_ref = 3;
  string download_manifest_ref = 4;
  uint32 skipped_candidate_count = 5;
  string skipped_candidate_summary = 6;
  uint32 ignored_candidate_count = 7;
  string ignored_candidate_summary = 8;
  uint32 quarantined_candidate_count = 9;
  string quarantined_candidate_summary = 10;
}

// NativePackageRecoveryStatus reports process-host dist materialization facts.
message NativePackageRecoveryStatus {
  string plugin_id = 1;
  string dist_dir = 2;
  bool materialized = 3;
  bool invalidated = 4;
  string last_action = 5;
  string last_error = 6;
  string updated_at = 7;
}

// BrowserBootRecoveryStatus reports browser/desktop boot compatibility facts
// when a renderer has published them to the daemon status owner.
message BrowserBootRecoveryStatus {
  string compatibility_version = 1;
  string last_reset_decision = 2;
  string status = 3;
}

// RuntimeAssetRecoveryStatus reports the latest typed root plugin asset result
// when a renderer has published it to the daemon status owner.
message RuntimeAssetRecoveryStatus {
  string script_path = 1;
  uint32 status_code = 2;
  bool ok = 3;
  string classification = 4;
  string fetch_source = 5;
  string runtime_error = 6;
  string plugin_asset_result = 7;
  string content_type = 8;
  string body_prefix = 9;
  string status = 10;
}

// RecoveryStatus composes runtime recovery facts without owning decisions.
message RecoveryStatus {
  LauncherRecoveryStatus launcher = 1;
  repeated PluginManifestRecoveryStatus plugins = 2;
  repeated NativePackageRecoveryStatus native_packages = 3;
  BrowserBootRecoveryStatus boot = 4;
  RuntimeAssetRecoveryStatus runtime_asset = 5;
}

// WatchControllersRequest is the request type for WatchControllers.
message WatchControllersRequest {}

// WatchControllersResponse is the response type for WatchControllers.
message WatchControllersResponse {
  // Controllers is the current list of active controllers.
  repeated ControllerInfo controllers = 1;
  // ControllerCount is the total number of active controllers.
  uint32 controller_count = 2;
}

// WatchDirectivesRequest is the request type for WatchDirectives.
message WatchDirectivesRequest {}

// WatchDirectivesResponse is the response type for WatchDirectives.
message WatchDirectivesResponse {
  // Directives is the current list of active directives.
  repeated DirectiveInfo directives = 1;
  // DirectiveCount is the total number of active directives.
  uint32 directive_count = 2;
}

// WatchPluginsRequest is the request type for WatchPlugins.
message WatchPluginsRequest {}

// WatchPluginsResponse is the response type for WatchPlugins.
message WatchPluginsResponse {
  // Plugins is the current list of plugin load requests.
  repeated PluginInfo plugins = 1;
  // PluginCount is the total number of plugin load requests.
  uint32 plugin_count = 2;
}

// WatchNetworkStatsRequest is the request type for WatchNetworkStats.
message WatchNetworkStatsRequest {}

// WatchNetworkStatsResponse is the response type for WatchNetworkStats.
message WatchNetworkStatsResponse {
  // TransportRunning reports whether the session transport owner is active.
  bool transport_running = 1;
  // LocalPeerId is the local bifrost peer ID when the transport is active.
  string local_peer_id = 2;
  // Peers is the list of peers with at least one active link.
  repeated NetworkPeerInfo peers = 3;
  // PeerCount is the total number of linked peers.
  uint32 peer_count = 4;
  // LinkCount is the total number of active links.
  uint32 link_count = 5;
}

// WatchRecoveryStatusRequest is the request type for WatchRecoveryStatus.
message WatchRecoveryStatusRequest {}

// ReportRecoveryStatusRequest publishes renderer-owned recovery facts.
message ReportRecoveryStatusRequest {
  BrowserBootRecoveryStatus boot = 1;
  RuntimeAssetRecoveryStatus runtime_asset = 2;
}

// ReportRecoveryStatusResponse is the response type for ReportRecoveryStatus.
message ReportRecoveryStatusResponse {}

// WatchRecoveryStatusResponse is the response type for WatchRecoveryStatus.
message WatchRecoveryStatusResponse {
  RecoveryStatus status = 1;
}
