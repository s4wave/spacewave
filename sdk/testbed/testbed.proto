syntax = "proto3";
package s4wave.testbed;

service TestbedResourceService {
  rpc CreateWorld(CreateWorldRequest) returns (CreateWorldResponse);

  rpc MarkTestResult(MarkTestResultRequest) returns (MarkTestResultResponse);

  rpc ClaimTest(ClaimTestRequest) returns (ClaimTestResponse);

  rpc AccessStateAtom(AccessStateAtomRequest) returns (AccessStateAtomResponse);
}

// CreateWorldRequest is the request type for CreateWorld.
message CreateWorldRequest {
  // EngineId is the ID for the world engine (optional, will be generated if empty).
  string engine_id = 1;
}

// CreateWorldResponse is the response type for CreateWorld.
message CreateWorldResponse {
  // ResourceId is the ID of the created engine resource.
  uint32 resource_id = 1;
}

// MarkTestResultRequest is the request type for MarkTestResult.
message MarkTestResultRequest {
  // Success indicates if the test passed.
  bool success = 1;
  // ErrorMessage contains the error message if the test failed.
  string error_message = 2;
  // TestName identifies the queued test case when multiple results share one fixture.
  string test_name = 3;
}

// MarkTestResultResponse is the response type for MarkTestResult.
message MarkTestResultResponse {}

// ClaimTestRequest is the request type for ClaimTest.
message ClaimTestRequest {}

// ClaimTestResponse is the response type for ClaimTest.
message ClaimTestResponse {
  // TestName is the next queued test case name.
  string test_name = 1;
  // Closed is true when the queue has no more tests to run.
  bool closed = 2;
}

// AccessStateAtomRequest is the request for AccessStateAtom.
message AccessStateAtomRequest {
  // StoreId is the identifier for the state store.
  // If empty, uses the default "ui-state" store.
  string store_id = 1;
}

// AccessStateAtomResponse is the response for AccessStateAtom.
message AccessStateAtomResponse {
  // ResourceId is the ID of the state atom resource.
  uint32 resource_id = 1;
}
