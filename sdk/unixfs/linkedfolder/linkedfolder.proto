syntax = "proto3";
package s4wave.unixfs.linkedfolder;

option go_package = "github.com/s4wave/spacewave/sdk/unixfs/linkedfolder;unixfs_linkedfolder";

// Config configures the controller that keeps a Drive equal to a folder on
// the Device running it.
message Config {
  // EngineId is the World engine holding the Drive.
  string engine_id = 1;
  // ObjectKey is the Drive's object key.
  string object_key = 2;
  // Folder is the absolute path of the folder on the Device.
  string folder = 3;
  // Path is the path in the Drive the folder links to, with its parts
  // separated by slashes. An empty Path links the folder at the Drive's root.
  string path = 4;
  // TwoWay also applies the changes others make to the Drive to the folder:
  // a member's write reaches the file, a write that meets an edit on disk
  // keeps both versions under a conflict name, and a member's delete moves
  // the file to the Device's trash. Off, the folder is the only source and the
  // Drive follows it one way, replacing others' changes.
  bool two_way = 5;
}
